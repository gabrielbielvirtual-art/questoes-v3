mItem":90,"explain":"Gabarito oficial definitivo: CERTO.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 90"},{"id":1291,"type":"tf","subject":"Direito Previdenciário","topic":"RGPS","sub":"Plano de benefícios","difficulty":"Difícil","text":"O salário de benefício do segurado que contribui em razão de atividades concomitantes é calculado com base na soma dos salários de contribuição das atividades exercidas na data do requerimento ou do óbito, ou no período básico de cálculo.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2022 — Técnico do Seguro Social","examItem":91,"explain":"Gabarito oficial definitivo: CERTO.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 91"},{"id":1292,"type":"tf","subject":"Direito Previdenciário","topic":"RGPS","sub":"Qualidade de segurado e período de graça","difficulty":"Difícil","text":"Aquele que esteja em gozo de benefício, exceto do auxílio-acidente, perde a qualidade de segurado, independentemente de contribuições, sem limite de prazo.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2022 — Técnico do Seguro Social","examItem":92,"explain":"Gabarito oficial definitivo: ERRADO.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 92"},{"id":1293,"type":"tf","subject":"Direito Previdenciário","topic":"RGPS","sub":"Qualidade de segurado e período de graça","difficulty":"Difícil","text":"O segurado facultativo mantém essa qualidade por, no máximo, três meses após a cessação das contribuições.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2022 — Técnico do Seguro Social","examItem":93,"explain":"Gabarito oficial definitivo: CERTO.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 93"},{"id":1294,"type":"tf","subject":"Direito Previdenciário","topic":"RGPS","sub":"Qualidade de segurado e período de graça","difficulty":"Difícil","text":"Durante o período de graça, o segurado conserva todos os direitos perante a previdência social.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2022 — Técnico do Seguro Social","examItem":94,"explain":"Gabarito oficial definitivo: ERRADO.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 94"},{"id":1295,"type":"tf","subject":"Direito Previdenciário","topic":"RGPS","sub":"Serviço Social e reabilitação profissional","difficulty":"Difícil","text":"Ao serviço social compete esclarecer aos beneficiários seus direitos sociais e os meios de exercê-los, bem como estabelecer, juntamente com eles, o processo de solução dos problemas que emergirem da sua relação com a previdência social, no âmbito interno da instituição e na dinâmica da sociedade.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2022 — Técnico do Seguro Social","examItem":95,"explain":"Gabarito oficial definitivo: ERRADO.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 95"},{"id":1296,"type":"tf","subject":"Direito Previdenciário","topic":"RGPS","sub":"Serviço Social e reabilitação profissional","difficulty":"Difícil","text":"Na hipótese de habilitação e reabilitação profissional, é vedada a concessão de auxílio para tratamento ou exame fora do domicílio do beneficiário.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2022 — Técnico do Seguro Social","examItem":96,"explain":"Gabarito oficial definitivo: ERRADO.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 96"},{"id":1297,"type":"tf","subject":"Direito Previdenciário","topic":"Legislação Previdenciária","sub":"Benefícios de legislação especial e seguro-defeso","difficulty":"Difícil","text":"A pensão especial concedida às pessoas com deficiência física conhecida como síndrome da talidomida, ressalvado o direito à opção, é acumulável com rendimento ou remuneração que, a qualquer título, venha a ser pago pela União a seus beneficiários, salvo a indenização por dano moral concedida por lei específica.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2022 — Técnico do Seguro Social","examItem":97,"explain":"Gabarito oficial definitivo: CERTO.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 97"},{"id":1298,"type":"tf","subject":"Direito Previdenciário","topic":"Legislação Previdenciária","sub":"Benefícios de legislação especial e seguro-defeso","difficulty":"Difícil","text":"Os seringueiros que trabalharam nos seringais da região amazônica durante a Segunda Guerra Mundial, ainda que possuam meios para a sua subsistência e a da sua família, têm direito ao pagamento de pensão mensal vitalícia correspondente ao valor de dois salários mínimos vigentes no país.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2022 — Técnico do Seguro Social","examItem":98,"explain":"Gabarito oficial definitivo: CERTO.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 98"},{"id":1299,"type":"tf","subject":"Direito Previdenciário","topic":"Legislação Previdenciária","sub":"Benefícios de legislação especial e seguro-defeso","difficulty":"Difícil","text":"A pensão especial devida aos ex-combatentes da Segunda Guerra Mundial e a seus dependentes corresponde à pensão militar deixada por segundo-tenente das Forças Armadas.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2022 — Técnico do Seguro Social","examItem":99,"explain":"Gabarito oficial definitivo: CERTO.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 99"},{"id":1300,"type":"tf","subject":"Direito Previdenciário","topic":"Legislação Previdenciária","sub":"Benefícios de legislação especial e seguro-defeso","difficulty":"Difícil","text":"A pensão especial concedida às vítimas de hemodiálise de Caruaru não será transmitida aos seus sucessores.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2022 — Técnico do Seguro Social","examItem":100,"explain":"Gabarito oficial definitivo: CERTO.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 100"},{"id":1301,"type":"tf","subject":"Direito Previdenciário","topic":"Legislação Previdenciária","sub":"Benefícios de legislação especial e seguro-defeso","difficulty":"Difícil","text":"A pensão especial concedida às vítimas do acidente nuclear ocorrido em Goiânia – GO é transmissível ao cônjuge sobrevivente ou aos herdeiros, em caso de morte do beneficiário.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2022 — Técnico do Seguro Social","examItem":101,"explain":"Gabarito oficial definitivo: CERTO.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 101"},{"id":1302,"type":"tf","subject":"Direito Previdenciário","topic":"Legislação Previdenciária","sub":"Benefícios de legislação especial e seguro-defeso","difficulty":"Difícil","text":"O regime do anistiado político compreende, entre outros, o direito à reparação econômica, de caráter indenizatório, em prestação única ou mensal, permanente e continuada, sendo vedadas a readmissão e a promoção na inatividade.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2022 — Técnico do Seguro Social","examItem":102,"explain":"Gabarito oficial definitivo: ERRADO.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 102"},{"id":1303,"type":"tf","subject":"Direito Previdenciário","topic":"Legislação Previdenciária","sub":"Benefícios de legislação especial e seguro-defeso","difficulty":"Difícil","text":"A pensão especial concedida às pessoas atingidas pela hanseníase, ressalvado o direito à opção, não é acumulável com indenizações que a União venha a pagar em decorrência de responsabilização civil sobre os mesmos fatos, bem como não impede a fruição de qualquer benefício previdenciário.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2022 — Técnico do Seguro Social","examItem":103,"explain":"Gabarito oficial definitivo: ERRADO.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 103"},{"id":1304,"type":"tf","subject":"Direito Previdenciário","topic":"Legislação Previdenciária","sub":"Benefícios de legislação especial e seguro-defeso","difficulty":"Difícil","text":"A pensão especial destinada às crianças com síndrome congênita do zika vírus nascidas entre 1.º de janeiro de 2015 e 31 de dezembro de 2019 e beneficiárias do benefício de prestação continuada é mensal, vitalícia e intransferível, tendo o valor de um salário mínimo.","options":["Certo","Errado"],"answer":0,"annulled":true,"source":"INSS 2022 — Técnico do Seguro Social","examItem":104,"explain":"Gabarito oficial definitivo: ANULADA.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 104"},{"id":1305,"type":"tf","subject":"Direito Previdenciário","topic":"Legislação Previdenciária","sub":"Benefícios de legislação especial e seguro-defeso","difficulty":"Difícil","text":"O seguro-desemprego concedido, durante o período de defeso, ao pescador profissional que exerce a atividade pesqueira de forma artesanal é transferível a outrem.  A esse respeito, julgue os itens a seguir.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2022 — Técnico do Seguro Social","examItem":105,"explain":"Gabarito oficial definitivo: ERRADO.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 105"},{"id":1306,"type":"tf","subject":"Direito Previdenciário","topic":"Seguridade Social","sub":"Saúde, previdência, assistência e financiamento","difficulty":"Difícil","text":"São princípios da seguridade social a universalidade da cobertura e do atendimento, a seletividade e distributividade na prestação dos benefícios e serviços e a progressividade na forma de participação no custeio.","options":["Certo","Errado"],"answer":0,"annulled":true,"source":"INSS 2022 — Técnico do Seguro Social","examItem":106,"explain":"Gabarito oficial definitivo: ANULADA.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 106"},{"id":1307,"type":"tf","subject":"Direito Previdenciário","topic":"Seguridade Social","sub":"Saúde, previdência, assistência e financiamento","difficulty":"Difícil","text":"O direito à saúde deve ser garantido mediante políticas sociais e econômicas que assegurem o acesso universal e igualitário às ações e aos serviços voltados para sua promoção, proteção e recuperação, promovidos por meio de rede regionalizada e hierarquizada e integrados em sistema único.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2022 — Técnico do Seguro Social","examItem":107,"explain":"Gabarito oficial definitivo: ERRADO.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 107"},{"id":1308,"type":"tf","subject":"Direito Previdenciário","topic":"Seguridade Social","sub":"Saúde, previdência, assistência e financiamento","difficulty":"Difícil","text":"A previdência social tem a finalidade de assegurar aos seus contribuintes a proteção em face de eventos como incapacidade, idade avançada, desemprego voluntário e reclusão ou morte daqueles de quem dependam economicamente.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2022 — Técnico do Seguro Social","examItem":108,"explain":"Gabarito oficial definitivo: CERTO.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 108"},{"id":1309,"type":"tf","subject":"Direito Previdenciário","topic":"Seguridade Social","sub":"Saúde, previdência, assistência e financiamento","difficulty":"Difícil","text":"A assistência social será prestada a quem dela necessitar, independentemente de contribuição, a fim de garantir, entre outros objetivos, a proteção à maternidade, à infância e à pessoa com deficiência.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2022 — Técnico do Seguro Social","examItem":109,"explain":"Gabarito oficial definitivo: ERRADO.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 109"},{"id":1310,"type":"tf","subject":"Direito Previdenciário","topic":"Seguridade Social","sub":"Saúde, previdência, assistência e financiamento","difficulty":"Difícil","text":"A seguridade social será financiada por toda a sociedade, de forma direta e indireta, mediante recursos provenientes da União, dos estados, do Distrito Federal, dos municípios e de contribuições sociais como as incidentes sobre a receita de concursos de prognósticos. Quanto ao Regime Geral de Previdência Social (RGPS), seus segurados e respectivos dependentes, julgue os próximos itens.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2022 — Técnico do Seguro Social","examItem":110,"explain":"Gabarito oficial definitivo: CERTO.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 110"},{"id":1311,"type":"tf","subject":"Direito Previdenciário","topic":"RGPS","sub":"Segurados e dependentes","difficulty":"Difícil","text":"São segurados obrigatórios da previdência social o servidor público ocupante de cargo em comissão, sem vínculo efetivo com a União, com autarquias, inclusive em regime especial, e com fundações públicas federais, e a pessoa física que exerce, por conta própria, com finalidade de lucro, atividade econômica de natureza urbana.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2022 — Técnico do Seguro Social","examItem":111,"explain":"Gabarito oficial definitivo: ERRADO.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 111"},{"id":1312,"type":"tf","subject":"Direito Previdenciário","topic":"RGPS","sub":"Segurados e dependentes","difficulty":"Difícil","text":"É vedada a filiação ao RGPS, na qualidade de segurado facultativo, de pessoa participante de regime próprio de previdência social, salvo na hipótese de afastamento sem vencimento e desde que não permitida, nesta condição, contribuição ao respectivo regime próprio.","options":["Certo","Errado"],"answer":1,"annulled function saveManualComment(qid){
  const el=document.getElementById('manualCommentInput');
  if(!el || !el.value.trim()) return;
  let all={};
  try{all=JSON.parse(localStorage.getItem('manualComments')||'{}')}catch(e){}
  all[qid]=all[qid]||[];
  all[qid].push({id:Date.now(),text:el.value.trim(),at:new Date().toISOString()});
  localStorage.setItem('manualComments',JSON.stringify(all));
  questions();

function deleteManualComment(qid,cid){
  let all={};
  try{all=JSON.parse(localStorage.getItem('manualComments')||'{}')}catch(e){}
  all[qid]=(all[qid]||[]).filter(c=>c.id!==cid);
  localStorage.setItem('manualComments',JSON.stringify(all));

function selectAnswer(id,ch){if(state.answers[id])return;pendingChoice={id,choice:ch};questions()}

function filterActiveItems(){
  const selectedTopics=Array.isArray(filter.topic)?filter.topic:(filter.topic==='Todos'||!filter.topic?[]:[filter.topic]);
  const items=[];
  if(filter.subject!=='Todos') items.push({key:'Matéria',value:filter.subject,type:'subject'});
  selectedTopics.forEach((value,i)=>items.push({key:'Assunto',value,type:'topic',index:i}));
  if(filter.search) items.push({key:'Busca',value:filter.search,type:'search'});
  if(filter.difficulty!=='Todos') items.push({key:'Dificuldade',value:filter.difficulty,type:'difficulty'});
  if(filter.status!=='Todos') items.push({key:'Status',value:filter.status,type:'status'});
  return items;
}
function renderActiveFilters(){
  const items=filterActiveItems();
  const box=$('activeFilterChips'); if(!box)return;
  box.innerHTML=items.length?items.map((item,i)=>`<div class="active-chip" title="${esc(item.key)}: ${esc(item.value)}"><span>${esc(item.value)}</span><button type="button" class="chip-x" data-chip-index="${i}" aria-label="Remover ${esc(item.value)}">×</button></div>`).join(''):`<div class="active-empty"><b>Selecione os filtros ao lado</b><span>Os filtros escolhidos aparecerão aqui.</span></div>`;
  box.querySelectorAll('[data-chip-index]').forEach(btn=>btn.addEventListener('click',()=>{
    const item=items[Number(btn.dataset.chipIndex)]; if(!item)return;
    if(item.type==='topic') filter.topic=filterActiveItems().filter(x=>x.type==='topic').filter(x=>x.value!==item.value).map(x=>x.value);
    else if(item.type==='subject'){filter.subject='Todos';filter.topic=[]}
    else if(item.type==='search')filter.search='';
    else if(item.type==='difficulty')filter.difficulty='Todos';
    else if(item.type==='status')filter.status='Todos';
    filtersPage();
  }));
}

<script id="performance-pie-script">
(function(){
  function updatePerformance(){
    if(typeof state==='undefined') return;
    const answers=state.answers||{}, entries=Object.values(answers);
    const solved=entries.length;
    const correct=entries.filter(x=>x&&x.correct).length;
    const wrong=entries.filter(x=>x&&!x.correct).length;
    const available=(typeof qs!=='undefined')?qs.length:0;
    const remaining=Math.max(0,available-solved);
    const rate=solved?Math.round(correct/solved*100):0;
    const degrees=solved?Math.round(correct/solved*360):0;
    const pie=document.getElementById('performancePie');
    if(pie) pie.style.background=`conic-gradient(#49b987 0deg ${degrees}deg,#df7075 ${degrees}deg 360deg)`;
    const set=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=v};
    set('performanceRate',rate+'%');
    set('performanceCorrect',correct);
    set('performanceWrong',wrong);
    set('performanceSolved',solved);
    set('performanceAvailable',available);
    set('performanceRemaining',remaining);
  }
  function openPerformance(){
    updatePerformance();
    const m=document.getElementById('performanceModal');
    if(m){m.classList.add('open');m.setAttribute('aria-hidden','false')}
  }
  function closePerformance(){
    const m=document.getElementById('performanceModal');
    if(m){m.classList.remove('open');m.setAttribute('aria-hidden','true')}
  }
  document.addEventListener('click',e=>{
    if(e.target.closest('#performanceBtn'))openPerformance();

<script id="clean-button-sounds">
(function(){
  let audioCtx = null;
  let soundEnabled = localStorage.getItem('questoesSound') !== 'off';
  let lastSound = 0;

  function ensureAudio(){
    const C = window.AudioContext || window.webkitAudioContext;
    if(!C) return null;
    audioCtx = audioCtx || new C();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function playButtonSound(){
    if(!soundEnabled) return;
    const now = performance.now();
    if(now - lastSound < 45) return;
    lastSound = now;
    try{
      const ctx = ensureAudio();
      if(!ctx) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(690, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(520, ctx.currentTime + .045);
      gain.gain.setValueAtTime(.0001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(.07, ctx.currentTime + .004);
      gain.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + .055);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + .06);
    }catch(e){}
  }

  const soundControl = document.getElementById('soundControl');
  if(soundControl){ soundControl.textContent = soundEnabled ? '🔊' : '🔇'; soundControl.title = soundEnabled ? 'Desativar sons' : 'Ativar sons'; }

  document.addEventListener('pointerdown', function(e){
    const control = e.target.closest('button, [role="button"], input[type="button"], input[type="submit"], .v22-option');
    if(!control || control.disabled || control.getAttribute('aria-disabled') === 'true') return;

    if(control.id === 'soundControl'){
      soundEnabled = !soundEnabled;
      localStorage.setItem('questoesSound', soundEnabled ? 'on' : 'off');
      control.textContent = soundEnabled ? '🔊' : '🔇';
      control.title = soundEnabled ? 'Desativar sons' : 'Ativar sons';
      control.setAttribute('aria-label', control.title);
      if(soundEnabled) playButtonSound();
      return;
    }

    control.classList.add('sound-pressed');
    setTimeout(() => control.classList.remove('sound-pressed'), 80);
    playButtonSound();
  }, true);
})();
</script>
