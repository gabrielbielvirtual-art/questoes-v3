<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Questões V4</title><style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#e5e7eb;--p:#315efb;--g:#0f9d68;--r:#d92d20;--shadow:0 10px 30px rgba(16,24,40,.07)}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}.side{position:fixed;inset:0 auto 0 0;width:250px;background:#101828;color:#fff;padding:22px 16px}.brand{font-size:22px;font-weight:800;padding:0 12px 22px}.brand b{color:#84adff}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#cbd5e1;text-align:left;padding:13px;border-radius:10px}.nav button.active,.nav button:hover{background:#1d2939;color:#fff}.main{margin-left:250px;padding:28px;max-width:1600px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.top h1{margin:0;font-size:28px}.user{background:#fff;border:1px solid var(--line);padding:9px 13px;border-radius:999px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card,.stat{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:20px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:30px;margin-top:6px}.layout{display:grid;grid-template-columns:1fr 340px;gap:18px;margin-top:18px}.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:16px}.filters select,input,textarea{border:1px solid var(--line);border-radius:10px;padding:11px;background:#fff;width:100%}.tags{margin-bottom:10px}.tag{display:inline-block;padding:5px 9px;border-radius:99px;background:#eef4ff;color:var(--p);font-size:12px;font-weight:700;margin:2px}.qhead{display:flex;justify-content:space-between;gap:12px}.question{font-size:20px;line-height:1.5;margin:18px 0}.options{display:grid;gap:10px}.option{width:100%;text-align:left;padding:15px;border:1px solid var(--line);background:#fff;border-radius:12px}.option.selected{border:2px solid var(--p);background:#f4f7ff}.option.correct{border-color:var(--g);background:#ecfdf3}.option.wrong{border-color:var(--r);background:#fef3f2}.actions,.toolbar,.row{display:flex;gap:10px;align-items:center}.actions{justify-content:space-between;margin-top:18px}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:700}.primary{background:var(--p);color:#fff}.secondary{background:#fff;border:1px solid var(--line)}.danger{background:#fff;border:1px solid #f2b8b5;color:var(--r)}.explain{margin-top:16px;padding:14px;border:1px solid var(--line);border-radius:12px;background:#f8fafc;color:#475467}.row{justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px;border-bottom:1px solid var(--line);vertical-align:top}.muted{color:var(--muted)}.empty{text-align:center;padding:38px;color:var(--muted)}.notice{padding:12px;border-radius:10px;background:#eef4ff;border:1px solid #d7e2ff;margin-bottom:15px}.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}.hidden{display:none}.modal{position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:18px;z-index:10}.modal>div{background:#fff;border-radius:16px;padding:22px;max-width:700px;width:100%;max-height:90vh;overflow:auto}.modal.show{display:flex}
@media(max-width:900px){.side{width:74px}.brand{font-size:0}.brand b{font-size:20px}.nav button{font-size:0;text-align:center}.nav button:before{content:'•';font-size:22px}.main{margin-left:74px}.grid{grid-template-columns:repeat(2,1fr)}.layout,.two{grid-template-columns:1fr}.filters{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.main{padding:16px}.grid,.filters{grid-template-columns:1fr}.top h1{font-size:22px}.question{font-size:18px}}
</style></head><body><div class="app"><aside class="side"><div class="brand">Questões <b>V4</b></div><div class="nav"><button class="active" data-p="dashboard">Dashboard</button><button data-p="questions">Questões</button><button data-p="books">Cadernos</button><button data-p="sim">Simulados</button><button data-p="history">Histórico</button><button data-p="fav">Favoritas</button><button data-p="admin">Administração</button></div></aside><main class="main"><div class="top"><h1 id="title">Dashboard</h1><div class="user">Aluno • V4</div></div><section id="content"></section></main></div><div id="modal" class="modal hidden"><div id="modalIn"></div></div><script>
const seed=[
{id:1,type:'mc',subject:'Direito Constitucional',topic:'Direitos Fundamentais',sub:'Direitos e Garantias',difficulty:'Fácil',text:'Qual princípio está expressamente previsto como fundamento da República Federativa do Brasil?',options:['Soberania','Eficiência','Anterioridade','Duplo grau de jurisdição'],answer:0,explain:'A soberania está no art. 1º, I, da Constituição Federal.'},
{id:2,type:'tf',subject:'Direito Constitucional',topic:'Administração Pública',sub:'Princípios',difficulty:'Médio',text:'A administração pública direta e indireta obedecerá aos princípios de legalidade, impessoalidade, moralidade, publicidade e eficiência.',options:['Certo','Errado'],answer:0,explain:'Certo. É a regra do art. 37, caput, da Constituição.'},
{id:3,type:'mc',subject:'Português',topic:'Interpretação',sub:'Compreensão textual',difficulty:'Médio',text:'Em uma questão de interpretação, a resposta correta deve ser fundamentada principalmente:',options:['Em opinião pessoal','No texto apresentado','No senso comum','Na alternativa mais longa'],answer:1,explain:'A compreensão textual deve partir das informações e relações presentes no próprio texto.'},
{id:4,type:'mc',subject:'Raciocínio Lógico',topic:'Proposições',sub:'Lógica proposicional',difficulty:'Difícil',text:'Se uma proposição P é verdadeira e Q é falsa, então P ∧ Q é:',options:['Verdadeira','Falsa','Indeterminada','Uma tautologia'],answer:1,explain:'A conjunção só é verdadeira quando ambas as proposições são verdadeiras.'},
{id:5,type:'tf',subject:'Direito Administrativo',topic:'Atos Administrativos',sub:'Atributos',difficulty:'Fácil',text:'Todo ato administrativo possui presunção absoluta de legitimidade.',options:['Certo','Errado'],answer:1,explain:'Errado. A presunção de legitimidade é, em regra, relativa.'},
{id:6,type:'mc',subject:'Informática',topic:'Segurança',sub:'Boas práticas',difficulty:'Fácil',text:'Qual prática reduz o risco de comprometimento de uma conta?',options:['Reutilizar a mesma senha','Ativar autenticação em dois fatores','Desativar atualizações','Compartilhar códigos de acesso'],answer:1,explain:'A autenticação em dois fatores acrescenta uma camada de proteção além da senha.'}];
let saved=JSON.parse(localStorage.getItem('questoesV4')||'null'), old=JSON.parse(localStorage.getItem('questoesV3')||'null');
let state=saved||{answers:old?.answers||{},favorites:old?.favorites||[],notebooks:old?.notebooks||[{name:'Revisão geral',ids:[]}],history:old?.history||[],simulados:old?.simulados||[],customQuestions:[]};
state.customQuestions=state.customQuestions||[];let qs=[...seed,...state.customQuestions];let current=0,filter={subject:'Todos',topic:'Todos',sub:'Todos',type:'Todos',difficulty:'Todos',status:'Todos'},sim=null;
const $=id=>document.getElementById(id);function save(){localStorage.setItem('questoesV4',JSON.stringify(state))}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function stats(){let a=Object.values(state.answers);let c=a.filter(x=>x.correct).length;return{done:a.length,c,wrong:a.length-c,rate:a.length?Math.round(c/a.length*100):0}}
function page(p){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.p===p));let t={dashboard:'Dashboard',questions:'Banco de Questões',books:'Cadernos',sim:'Simulados',history:'Histórico',fav:'Favoritas',admin:'Administração'};$('title').textContent=t[p];({dashboard:dash,questions:questions,books:books,sim:simulados,history:history,fav:favorites,admin:admin}[p]||dash)()}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>page(b.dataset.p));
function dash(){let s=stats(),by={};qs.forEach(q=>{by[q.subject]??={d:0,c:0};if(state.answers[q.id]){by[q.subject].d++;if(state.answers[q.id].correct)by[q.subject].c++}});$('content').innerHTML=`<div class=grid><div class=stat><small>Resolvidas</small><strong>${s.done}</strong></div><div class=stat><small>Acertos</small><strong>${s.c}</strong></div><div class=stat><small>Erros</small><strong>${s.wrong}</strong></div><div class=stat><small>Aproveitamento</small><strong>${s.rate}%</strong></div></div><div class=layout><div class=card><h2>Desempenho por matéria</h2>${Object.entries(by).map(([k,v])=>{let cp=v.d?Math.round(v.c/v.d*100):0,wp=v.d?Math.round((v.d-v.c)/v.d*100):0;return `<div class=row style="display:block"><div style="display:flex;justify-content:space-between;gap:12px"><span><b>${esc(k)}</b></span><span class=muted>${v.d} resolvida${v.d===1?'':'s'}</span></div><div class=toolbar style="margin-top:8px;justify-content:space-between"><span style="color:var(--g);font-weight:800">✓ ${v.c} acerto${v.c===1?'':'s'} — ${cp}%</span><span style="color:var(--r);font-weight:800">✕ ${v.d-v.c} erro${v.d-v.c===1?'':'s'} — ${wp}%</span></div></div>`}).join('')}</div><div class=card><h2>Atalhos</h2><div class=toolbar><button class="btn primary" onclick="page('questions')">Resolver questões</button><button class="btn secondary" onclick="page('sim')">Montar simulado</button></div></div></div>`}
function opts(arr,sel){return `<option>Todos</option>${[...new Set(arr)].filter(x=>x&&x!=='Todos').sort().map(x=>`<option ${x===sel?'selected':''}>${esc(x)}</option>`).join('')}`}function filtered(){return qs.filter(q=>{let a=state.answers[q.id];return(filter.subject==='Todos'||q.subject===filter.subject)&&(filter.topic==='Todos'||q.topic===filter.topic)&&(filter.sub==='Todos'||q.sub===filter.sub)&&(filter.type==='Todos'||q.type===filter.type)&&(filter.difficulty==='Todos'||q.difficulty===filter.difficulty)&&(filter.status==='Todos'||(filter.status==='Não resolvidas'&&!a)||(filter.status==='Acertadas'&&a?.correct)||(filter.status==='Erradas'&&a&&!a.correct)||(filter.status==='Favoritas'&&state.favorites.includes(q.id)))});}
function questions(){let arr=filtered();if(current>=arr.length)current=0;let q=arr[current]||qs[0];if(!q){$('content').innerHTML='<div class=card>Nenhuma questão.</div>';return}let a=state.answers[q.id],fav=state.favorites.includes(q.id);$('content').innerHTML=`<div class=card><div class=filters><select id=fs>${opts(qs.map(x=>x.subject),filter.subject)}</select><select id=ft>${opts(qs.map(x=>x.topic),filter.topic)}</select><select id=fsub>${opts(qs.map(x=>x.sub),filter.sub)}</select><select id=fty><option>Todos</option><option value=mc ${filter.type==='mc'?'selected':''}>Múltipla escolha</option><option value=tf ${filter.type==='tf'?'selected':''}>Certo/Errado</option></select><select id=fd>${opts(['Fácil','Médio','Difícil'],filter.difficulty)}</select><select id=fst>${opts(['Não resolvidas','Acertadas','Erradas','Favoritas'],filter.status)}</select></div><div class=qhead><div class=tags><span class=tag>${esc(q.subject)}</span><span class=tag>${esc(q.topic)}</span><span class=tag>${esc(q.sub)}</span><span class=tag>${esc(q.difficulty)}</span></div><div class=toolbar><button class="btn secondary" onclick="addBook(${q.id})">＋ Caderno</button><button class="btn secondary" onclick="fav(${q.id})">${fav?'★ Favorita':'☆ Favoritar'}</button></div></div><div class=question>${esc(q.text)}</div><div class=options>${q.options.map((o,i)=>`<button class="option ${a&&i===q.answer?'correct':''} ${a&&i===a.choice&&!a.correct?'wrong':''} ${a&&i===a.choice?'selected':''}" onclick="answer(${q.id},${i})">${String.fromCharCode(65+i)}) ${esc(o)}</button>`).join('')}</div>${a?`<div class=explain><b>${a.correct?'Resposta correta':'Resposta incorreta'}</b><br>${esc(q.explain)}</div>`:''}<div class=actions><button class="btn secondary" onclick="prev()">← Anterior</button><span>${current+1} / ${arr.length}</span><button class="btn primary" onclick="next()">Próxima →</button></div></div>`;[['fs','subject'],['ft','topic'],['fsub','sub'],['fty','type'],['fd','difficulty'],['fst','status']].forEach(([id,k])=>$(id).onchange=e=>{filter[k]=e.target.value;current=0;questions()})}
function answer(id,ch){let q=qs.find(x=>x.id===id),now=new Date().toISOString(),correct=ch===q.answer;state.answers[id]={choice:ch,correct,at:now};state.history.unshift({id,choice:ch,correct,at:now});state.history=state.history.slice(0,2000);save();questions()}function fav(id){state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];save();questions()}function next(){current++;questions()}function prev(){current=Math.max(0,current-1);questions()}
function addBook(id){if(!state.notebooks.length)state.notebooks=[{name:'Revisão geral',ids:[]}];let html='<h2>Adicionar ao caderno</h2>'+state.notebooks.map((n,i)=>`<button class="btn secondary" style="width:100%;margin:5px 0" onclick="putBook(${i},${id})">${esc(n.name)} (${n.ids.length})</button>`).join('');modal(html)}function putBook(i,id){if(!state.notebooks[i].ids.includes(id))state.notebooks[i].ids.push(id);save();close();}
function books(){$('content').innerHTML=`<div class=layout><div class=card><h2>Seus cadernos</h2>${state.notebooks.map((n,i)=>`<div class=row><span><b>${esc(n.name)}</b><br><span class=muted>${n.ids.length} questões</span></span><button class="btn secondary" onclick="openBook(${i})">Abrir</button></div>`).join('')}</div><div class=card><h2>Novo caderno</h2><input id=newBook placeholder="Nome do caderno"><button class="btn primary" style="margin-top:10px" onclick="newBook()">Criar caderno</button></div></div>`}function newBook(){let n=$('newBook').value.trim();if(n){state.notebooks.push({name:n,ids:[]});save();books()}}function openBook(i){let n=state.notebooks[i],arr=qs.filter(q=>n.ids.includes(q.id));modal(`<h2>${esc(n.name)}</h2>${arr.length?arr.map(q=>`<div class=row><span>${esc(q.text)}</span><button class="btn danger" onclick="removeBook(${i},${q.id})">Remover</button></div>`).join(''):'<div class=empty>Caderno vazio.</div>'}<div class=actions><button class="btn secondary" onclick="close()">Fechar</button></div>`)}function removeBook(i,id){state.notebooks[i].ids=state.notebooks[i].ids.filter(x=>x!==id);save();openBook(i)}
function simulados(){$('content').innerHTML=`<div class=layout><div class=card><h2>Novo simulado</h2><p>Escolha a quantidade e, opcionalmente, uma matéria.</p><select id=sq><option>5</option><option>10</option><option>20</option></select><select id=ss style="margin-top:9px">${opts(qs.map(q=>q.subject),'Todos')}</select><button class="btn primary" style="margin-top:10px" onclick="startSim()">Iniciar</button></div><div class=card><h2>Últimos resultados</h2>${state.simulados.length?state.simulados.slice(0,10).map(s=>`<div class=row><span>${esc(s.date)}</span><b>${s.correct}/${s.total} (${s.rate}%)</b></div>`).join(''):'<div class=empty>Nenhum simulado finalizado.</div>'}</div></div>`}function startSim(){let n=Math.min(+$('sq').value,qs.length),sub=$('ss').value,p=sub==='Todos'?qs:qs.filter(q=>q.subject===sub);p=[...p].sort(()=>Math.random()-.5).slice(0,n);if(!p.length)return;sim={qs:p,i:0,a:[]};simQuestion()}function simQuestion(){let q=sim.qs[sim.i],ch=sim.a[sim.i];$('content').innerHTML=`<div class=card><div class=notice><b>Simulado em andamento</b> — ${sim.i+1}/${sim.qs.length}</div><div class=question>${esc(q.text)}</div><div class=options>${q.options.map((o,i)=>`<button class="option ${ch===i?'selected':''}" onclick="simPick(${i})">${String.fromCharCode(65+i)}) ${esc(o)}</button>`).join('')}</div><div class=actions><button class="btn secondary" onclick="simPrev()">← Anterior</button>${sim.i===sim.qs.length-1?'<button class="btn primary" onclick="finishSim()">Finalizar</button>':'<button class="btn primary" onclick="simNext()">Próxima →</button>'}</div></div>`}function simPick(i){sim.a[sim.i]=i;simQuestion()}function simNext(){if(sim.i<sim.qs.length-1){sim.i++;simQuestion()}}function simPrev(){if(sim.i>0){sim.i--;simQuestion()}}function finishSim(){let c=sim.qs.reduce((n,q,i)=>n+(sim.a[i]===q.answer?1:0),0),t=sim.qs.length,r=Math.round(c/t*100);state.simulados.unshift({date:new Date().toLocaleString('pt-BR'),correct:c,total:t,rate:r});save();modal(`<h2>Simulado finalizado</h2><div class=grid><div class=stat><small>Acertos</small><strong>${c}</strong></div><div class=stat><small>Erros</small><strong>${t-c}</strong></div><div class=stat><small>Aproveitamento</small><strong>${r}%</strong></div></div><div class=actions><button class="btn primary" onclick="close();page('sim')">Voltar</button></div>`);sim=null}
function history(){$('content').innerHTML=`<div class=card><div class=toolbar><h2 style="flex:1">Histórico (${state.history.length})</h2><button class="btn secondary" onclick="exportData()">💾 Backup</button></div>${state.history.length?`<table class=table><tr><th>Questão</th><th>Resultado</th><th>Data</th></tr>${state.history.slice(0,200).map(h=>{let q=qs.find(x=>x.id===h.id);return`<tr><td>#${h.id} — ${esc(q?.text||'Questão')}</td><td>${h.correct?'<span style="color:var(--g)">✓ Acerto</span>':'<span style="color:var(--r)">✕ Erro</span>'}</td><td>${new Date(h.at).toLocaleString('pt-BR')}</td></tr>`}).join('')}</table>`:'<div class=empty>Seu histórico aparecerá aqui.</div>'}</div>`}function favorites(){let a=qs.filter(q=>state.favorites.includes(q.id));$('content').innerHTML=`<div class=card><h2>Favoritas (${a.length})</h2>${a.length?`<table class=table><tr><th>Questão</th><th>Matéria</th><th>Status</th></tr>${a.map(q=>`<tr><td>${esc(q.text)}</td><td>${esc(q.subject)}</td><td>${state.answers[q.id]?.correct?'Acertada':state.answers[q.id]?'Errada':'Não resolvida'}</td></tr>`).join('')}</table>`:'<div class=empty>Nenhuma favorita.</div>'}</div>`}
function admin(){$('content').innerHTML=`<div class=grid><div class=stat><small>Questões</small><strong>${qs.length}</strong></div><div class=stat><small>Matérias</small><strong>${new Set(qs.map(q=>q.subject)).size}</strong></div><div class=stat><small>Favoritas</small><strong>${state.favorites.length}</strong></div><div class=stat><small>Respostas</small><strong>${state.history.length}</strong></div></div><div class=two style="margin-top:18px"><div class=card><h2>Adicionar questão</h2><input id=as placeholder="Matéria"><input id=at placeholder="Assunto" style="margin-top:7px"><input id=au placeholder="Subassunto" style="margin-top:7px"><select id=ay style="margin-top:7px"><option value=mc>Múltipla escolha</option><option value=tf>Certo/Errado</option></select><select id=ad style="margin-top:7px"><option>Fácil</option><option>Médio</option><option>Difícil</option></select><textarea id=ax rows=4 placeholder="Enunciado" style="margin-top:7px"></textarea><input id=aa placeholder="Alternativa A / Certo" style="margin-top:7px"><input id=ab placeholder="Alternativa B / Errado" style="margin-top:7px"><input id=ac placeholder="Alternativa C" style="margin-top:7px"><input id=ae placeholder="Alternativa D" style="margin-top:7px"><select id=ag style="margin-top:7px"><option value=0>Gabarito A</option><option value=1>Gabarito B</option><option value=2>Gabarito C</option><option value=3>Gabarito D</option></select><textarea id=ex rows=3 placeholder="Comentário / explicação" style="margin-top:7px"></textarea><button class="btn primary" style="margin-top:8px" onclick="addQ()">Salvar questão</button></div><div class=card><h2>Backup</h2><p class=muted>V4 aproveita o progresso que já estava salvo na V3 neste navegador.</p><div class=toolbar><button class="btn secondary" onclick="exportData()">💾 Exportar backup</button><button class="btn secondary" onclick="$('imp').click()">📥 Restaurar</button><input id=imp class=hidden type=file accept=.json onchange="importData(event)"></div><button class="btn danger" onclick="resetAll()">Apagar dados deste dispositivo</button></div></div>`}
function addQ(){let s=$('as').value.trim(),t=$('at').value.trim(),u=$('au').value.trim(),x=$('ax').value.trim(),type=$('ay').value,d=$('ad').value,o=type==='tf'?['Certo','Errado']:[$('aa').value.trim(),$('ab').value.trim(),$('ac').value.trim(),$('ae').value.trim()].filter(Boolean);if(!s||!t||!x||o.length<2){alert('Preencha matéria, assunto, enunciado e pelo menos duas alternativas.');return}let q={id:Date.now(),type,subject:s,topic:t,sub:u||'Geral',difficulty:d,text:x,options:o,answer:Math.min(+$('ag').value,o.length-1),explain:$('ex').value.trim()||'Sem comentário cadastrado.'};state.customQuestions.push(q);qs.push(q);save();alert('Questão adicionada ao banco local.');admin()}
function exportData(){let b=new Blob([JSON.stringify({version:'V4',state},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='questoes-v4-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.state)throw 0;state={...state,...d.state};state.customQuestions=state.customQuestions||[];qs=[...seed,...state.customQuestions];save();alert('Backup restaurado.');page('dashboard')}catch(_){alert('Backup inválido.')}};r.readAsText(f)}function resetAll(){if(confirm('Apagar progresso, favoritos, cadernos, simulados e questões adicionadas neste dispositivo?')){localStorage.removeItem('questoesV4');localStorage.removeItem('questoesV3');location.reload()}}function modal(h){if(!h)return; $('modalIn').innerHTML=h;$('modal').classList.add('show')}function close(){$('modal').classList.remove('show');$('modalIn').innerHTML=''}$('modal').onclick=e=>{if(e.target.id==='modal')close()};close();page('dashboard');
</script></body></html>
