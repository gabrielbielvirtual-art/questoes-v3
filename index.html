{"id":1293,"type":"tf","subject":"Direito Previdenciário","topic":"RGPS","sub":"Qualidade de segurado e período de graça","difficulty":"Difícil","text":"O segurado facultativo mantém essa qualidade por, no máximo, três meses após a cessação das contribuições.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2022 — Técnico do Seguro Social","examItem":93,"explain":"Gabarito oficial definitivo: CERTO.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 93"},
{"id":1294,"type":"tf","subject":"Direito Previdenciário","topic":"RGPS","sub":"Qualidade de segurado e período de graça","difficulty":"Difícil","text":"Durante o período de graça, o segurado conserva todos os direitos perante a previdência social.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2022 — Técnico do Seguro Social","examItem":94,"explain":"Gabarito oficial definitivo: ERRADO.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 94"},
{"id":1295,"type":"tf","subject":"Direito Previdenciário","topic":"RGPS","sub":"Serviço Social e reabilitação profissional","difficulty":"Difícil","text":"Ao serviço social compete esclarecer aos beneficiários seus direitos sociais e os meios de exercê-los, bem como estabelecer, juntamente com eles, o processo de solução dos problemas que emergirem da sua relação com a previdência social, no âmbito interno da instituição e na dinâmica da sociedade.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2022 — Técnico do Seguro Social","examItem":95,"explain":"Gabarito oficial definitivo: ERRADO.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 95"},
{"id":1296,"type":"tf","subject":"Direito Previdenciário","topic":"RGPS","sub":"Serviço Social e reabilitação profissional","difficulty":"Difícil","text":"Na hipótese de habilitação e reabilitação profissional, é vedada a concessão de auxílio para tratamento ou exame fora do domicílio do beneficiário.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2022 — Técnico do Seguro Social","examItem":96,"explain":"Gabarito oficial definitivo: ERRADO.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 96"},
{"id":1297,"type":"tf","subject":"Direito Previdenciário","topic":"Legislação Previdenciária","sub":"Benefícios de legislação especial e seguro-defeso","difficulty":"Difícil","text":"A pensão especial concedida às pessoas com deficiência física conhecida como síndrome da talidomida, ressalvado o direito à opção, é acumulável com rendimento ou remuneração que, a qualquer título, venha a ser pago pela União a seus beneficiários, salvo a indenização por dano moral concedida por lei específica.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2022 — Técnico do Seguro Social","examItem":97,"explain":"Gabarito oficial definitivo: CERTO.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 97"},
{"id":1298,"type":"tf","subject":"Direito Previdenciário","topic":"Legislação Previdenciária","sub":"Benefícios de legislação especial e seguro-defeso","difficulty":"Difícil","text":"Os seringueiros que trabalharam nos seringais da região amazônica durante a Segunda Guerra Mundial, ainda que possuam meios para a sua subsistência e a da sua família, têm direito ao pagamento de pensão mensal vitalícia correspondente ao valor de dois salários mínimos vigentes no país.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2022 — Técnico do Seguro Social","examItem":98,"explain":"Gabarito oficial definitivo: CERTO.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 98"},
{"id":1299,"type":"tf","subject":"Direito Previdenciário","topic":"Legislação Previdenciária","sub":"Benefícios de legislação especial e seguro-defeso","difficulty":"Difícil","text":"A pensão especial devida aos ex-combatentes da Segunda Guerra Mundial e a seus dependentes corresponde à pensão militar deixada por segundo-tenente das Forças Armadas.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2022 — Técnico do Seguro Social","examItem":99,"explain":"Gabarito oficial definitivo: CERTO.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 99"},
{"id":1300,"type":"tf","subject":"Direito Previdenciário","topic":"Legislação Previdenciária","sub":"Benefícios de legislação especial e seguro-defeso","difficulty":"Difícil","text":"A pensão especial concedida às vítimas de hemodiálise de Caruaru não será transmitida aos seus sucessores.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2022 — Técnico do Seguro Social","examItem":100,"explain":"Gabarito oficial definitivo: CERTO.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 100"},
{"id":1301,"type":"tf","subject":"Direito Previdenciário","topic":"Legislação Previdenciária","sub":"Benefícios de legislação especial e seguro-defeso","difficulty":"Difícil","text":"A pensão especial concedida às vítimas do acidente nuclear ocorrido em Goiânia – GO é transmissível ao cônjuge sobrevivente ou aos herdeiros, em caso de morte do beneficiário.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2022 — Técnico do Seguro Social","examItem":101,"explain":"Gabarito oficial definitivo: CERTO.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 101"},
{"id":1302,"type":"tf","subject":"Direito Previdenciário","topic":"Legislação Previdenciária","sub":"Benefícios de legislação especial e seguro-defeso","difficulty":"Difícil","text":"O regime do anistiado político compreende, entre outros, o direito à reparação econômica, de caráter indenizatório, em prestação única ou mensal, permanente e continuada, sendo vedadas a readmissão e a promoção na inatividade.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2022 — Técnico do Seguro Social","examItem":102,"explain":"Gabarito oficial definitivo: ERRADO.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 102"},
{"id":1303,"type":"tf","subject":"Direito Previdenciário","topic":"Legislação Previdenciária","sub":"Benefícios de legislação especial e seguro-defeso","difficulty":"Difícil","text":"A pensão especial concedida às pessoas atingidas pela hanseníase, ressalvado o direito à opção, não é acumulável com indenizações que a União venha a pagar em decorrência de responsabilização civil sobre os mesmos fatos, bem como não impede a fruição de qualquer benefício previdenciário.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2022 — Técnico do Seguro Social","examItem":103,"explain":"Gabarito oficial definitivo: ERRADO.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 103"},
{"id":1304,"type":"tf","subject":"Direito Previdenciário","topic":"Legislação Previdenciária","sub":"Benefícios de legislação especial e seguro-defeso","difficulty":"Difícil","text":"A pensão especial destinada às crianças com síndrome congênita do zika vírus nascidas entre 1.º de janeiro de 2015 e 31 de dezembro de 2019 e beneficiárias do benefício de prestação continuada é mensal, vitalícia e intransferível, tendo o valor de um salário mínimo.","options":["Certo","Errado"],"answer":0,"annulled":true,"source":"INSS 2022 — Técnico do Seguro Social","examItem":104,"explain":"Gabarito oficial definitivo: ANULADA.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 104"},
{"id":1305,"type":"tf","subject":"Direito Previdenciário","topic":"Legislação Previdenciária","sub":"Benefícios de legislação especial e seguro-defeso","difficulty":"Difícil","text":"O seguro-desemprego concedido, durante o período de defeso, ao pescador profissional que exerce a atividade pesqueira de forma artesanal é transferível a outrem.  A esse respeito, julgue os itens a seguir.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2022 — Técnico do Seguro Social","examItem":105,"explain":"Gabarito oficial definitivo: ERRADO.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 105"},
{"id":1306,"type":"tf","subject":"Direito Previdenciário","topic":"Seguridade Social","sub":"Saúde, previdência, assistência e financiamento","difficulty":"Difícil","text":"São princípios da seguridade social a universalidade da cobertura e do atendimento, a seletividade e distributividade na prestação dos benefícios e serviços e a progressividade na forma de participação no custeio.","options":["Certo","Errado"],"answer":0,"annulled":true,"source":"INSS 2022 — Técnico do Seguro Social","examItem":106,"explain":"Gabarito oficial definitivo: ANULADA.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 106"},
{"id":1307,"type":"tf","subject":"Direito Previdenciário","topic":"Seguridade Social","sub":"Saúde, previdência, assistência e financiamento","difficulty":"Difícil","text":"O direito à saúde deve ser garantido mediante políticas sociais e econômicas que assegurem o acesso universal e igualitário às ações e aos serviços voltados para sua promoção, proteção e recuperação, promovidos por meio de rede regionalizada e hierarquizada e integrados em sistema único.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2022 — Técnico do Seguro Social","examItem":107,"explain":"Gabarito oficial definitivo: ERRADO.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 107"},
{"id":1308,"type":"tf","subject":"Direito Previdenciário","topic":"Seguridade Social","sub":"Saúde, previdência, assistência e financiamento","difficulty":"Difícil","text":"A previdência social tem a finalidade de assegurar aos seus contribuintes a proteção em face de eventos como incapacidade, idade avançada, desemprego voluntário e reclusão ou morte daqueles de quem dependam economicamente.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2022 — Técnico do Seguro Social","examItem":108,"explain":"Gabarito oficial definitivo: CERTO.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 108"},
{"id":1309,"type":"tf","subject":"Direito Previdenciário","topic":"Seguridade Social","sub":"Saúde, previdência, assistência e financiamento","difficulty":"Difícil","text":"A assistência social será prestada a quem dela necessitar, independentemente de contribuição, a fim de garantir, entre outros objetivos, a proteção à maternidade, à infância e à pessoa com deficiência.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2022 — Técnico do Seguro Social","examItem":109,"explain":"Gabarito oficial definitivo: ERRADO.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 109"},
{"id":1310,"type":"tf","subject":"Direito Previdenciário","topic":"Seguridade Social","sub":"Saúde, previdência, assistência e financiamento","difficulty":"Difícil","text":"A seguridade social será financiada por toda a sociedade, de forma direta e indireta, mediante recursos provenientes da União, dos estados, do Distrito Federal, dos municípios e de contribuições sociais como as incidentes sobre a receita de concursos de prognósticos. Quanto ao Regime Geral de Previdência Social (RGPS), seus segurados e respectivos dependentes, julgue os próximos itens.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2022 — Técnico do Seguro Social","examItem":110,"explain":"Gabarito oficial definitivo: CERTO.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 110"},
{"id":1311,"type":"tf","subject":"Direito Previdenciário","topic":"RGPS","sub":"Segurados e dependentes","difficulty":"Difícil","text":"São segurados obrigatórios da previdência social o servidor público ocupante de cargo em comissão, sem vínculo efetivo com a União, com autarquias, inclusive em regime especial, e com fundações públicas federais, e a pessoa física que exerce, por conta própria, com finalidade de lucro, atividade econômica de natureza urbana.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2022 — Técnico do Seguro Social","examItem":111,"explain":"Gabarito oficial definitivo: ERRADO.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 111"},
{"id":1312,"type":"tf","subject":"Direito Previdenciário","topic":"RGPS","sub":"Segurados e dependentes","difficulty":"Difícil","text":"É vedada a filiação ao RGPS, na qualidade de segurado facultativo, de pessoa participante de regime próprio de previdência social, salvo na hipótese de afastamento sem vencimento e desde que não permitida, nesta condição, contribuição ao respectivo regime próprio.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2022 — Técnico do Seguro Social","examItem":112,"explain":"Gabarito oficial definitivo: ERRADO.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 112"},
{"id":1313,"type":"tf","subject":"Direito Previdenciário","topic":"RGPS","sub":"Segurados e dependentes","difficulty":"Difícil","text":"É beneficiário do RGPS, na condição de dependente do segurado, o filho não emancipado, de qualquer condição, menor de 24 anos de idade, desde que esteja matriculado em curso de ensino superior ou de escola técnica.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2022 — Técnico do Seguro Social","examItem":113,"explain":"Gabarito oficial definitivo: CERTO.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 113"},
{"id":1314,"type":"tf","subject":"Direito Previdenciário","topic":"RGPS","sub":"Segurados e dependentes","difficulty":"Difícil","text":"O enteado, o menor sob guarda e o menor tutelado equiparam-se a filho do segurado, mediante declaração deste, desde que comprovada a dependência econômica.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2022 — Técnico do Seguro Social","examItem":114,"explain":"Gabarito oficial definitivo: ERRADO.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 114"},
{"id":1315,"type":"tf","subject":"Direito Previdenciário","topic":"BPC/LOAS","sub":"BPC e auxílio-inclusão","difficulty":"Difícil","text":"A assistência social é regida pelo princípio da supremacia das exigências de rentabilidade econômica sobre o atendimento às necessidades sociais.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2022 — Técnico do Seguro Social","examItem":115,"explain":"Gabarito oficial definitivo: CERTO.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 115"},
{"id":1316,"type":"tf","subject":"Direito Previdenciário","topic":"BPC/LOAS","sub":"BPC e auxílio-inclusão","difficulty":"Difícil","text":"Observados os demais critérios de elegibilidade definidos na LOAS, terão direito ao benefício de prestação continuada a pessoa com deficiência ou a pessoa idosa com renda familiar mensal per capita  igual ou inferior a um quarto do salário mínimo.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2022 — Técnico do Seguro Social","examItem":116,"explain":"Gabarito oficial definitivo: ERRADO.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 116"},
{"id":1317,"type":"tf","subject":"Direito Previdenciário","topic":"BPC/LOAS","sub":"BPC e auxílio-inclusão","difficulty":"Difícil","text":"O pagamento do auxílio-inclusão não será acumulado com o pagamento do benefício de prestação continuada.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2022 — Técnico do Seguro Social","examItem":117,"explain":"Gabarito oficial definitivo: CERTO.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 117"},
{"id":1318,"type":"tf","subject":"Direito Previdenciário","topic":"BPC/LOAS","sub":"BPC e auxílio-inclusão","difficulty":"Difícil","text":"Compete ao INSS a operacionalização do benefício de prestação continuada.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2022 — Técnico do Seguro Social","examItem":118,"explain":"Gabarito oficial definitivo: ERRADO.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 118"},
{"id":1319,"type":"tf","subject":"Direito Previdenciário","topic":"RPPS/CTC/Compensação","sub":"CTC, contagem recíproca e compensação previdenciária","difficulty":"Difícil","text":"É vedada a emissão de certidão de tempo de contribuição referente a períodos de contribuição posteriores à data da aposentadoria no RGPS.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2022 — Técnico do Seguro Social","examItem":119,"explain":"Gabarito oficial definitivo: CERTO.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 119"},
{"id":1320,"type":"tf","subject":"Direito Previdenciário","topic":"RPPS/CTC/Compensação","sub":"CTC, contagem recíproca e compensação previdenciária","difficulty":"Difícil","text":"A compensação financeira entre os regimes de previdência será realizada exclusivamente na contagem recíproca de tempo de contribuição não concomitante utilizado na concessão da aposentadoria.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2022 — Técnico do Seguro Social","examItem":120,"explain":"Gabarito oficial definitivo: ERRADO.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 120"},
{"id":2001,"type":"tf","subject":"Direito Previdenciário","topic":"Atendimento/CNIS/PEP","sub":"Atendimento remoto e procedimentos","difficulty":"Médio","text":"É garantido à pessoa surda ou com deficiência auditiva o direito de ser acompanhada por seu intérprete ou tradutor da língua brasileira de sinais (LIBRAS), durante todos os atendimentos realizados no âmbito do INSS.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":1,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"CERTO. A pessoa surda ou com deficiência auditiva pode ser acompanhada por intérprete/tradutor de Libras nos atendimentos do INSS, como garantia de acessibilidade e comunicação adequada. Base: normas de acessibilidade e atendimento do INSS."},
{"id":2002,"type":"tf","subject":"Direito Previdenciário","topic":"Atendimento/CNIS/PEP","sub":"Atendimento remoto e procedimentos","difficulty":"Médio","text":"Cabe ao colaborador do protocolo, no cumprimento de exigência administrativa, a análise imediata do mérito do pedido por meio de despacho fundamentado.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":2,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"ERRADO. O cumprimento de exigência não transforma o colaborador do protocolo em autoridade para analisar imediatamente o mérito e proferir despacho fundamentado. A análise decisória deve observar a competência e o fluxo administrativo próprio."},
{"id":2003,"type":"tf","subject":"Direito Previdenciário","topic":"Atendimento/CNIS/PEP","sub":"Atendimento remoto e procedimentos","difficulty":"Médio","text":"O canal de atendimento telefônico do INSS — central de atendimento 135 — funciona com atendimento humano durante todos os dias da semana, inclusive aos domingos e feriados, o que garante acesso contínuo e atendimento eficaz aos segurados.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":3,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"ERRADO. O enunciado generaliza o atendimento humano do 135 para todos os dias, inclusive domingos e feriados. A disponibilidade do canal e seus horários não autorizam essa afirmação absoluta."},
{"id":2004,"type":"tf","subject":"Direito Previdenciário","topic":"Benefícios por incapacidade","sub":"Incapacidade temporária e permanente","difficulty":"Médio","text":"A concessão do benefício por incapacidade temporária depende da comprovação da incapacidade para o trabalho por período superior a 15 dias consecutivos.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":4,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"CERTO. Para o auxílio por incapacidade temporária, a incapacidade deve superar 15 dias consecutivos, observados os demais requisitos. Base: Lei nº 8.213/1991, art. 59."},
{"id":2005,"type":"tf","subject":"Direito Previdenciário","topic":"Benefícios por incapacidade","sub":"Incapacidade temporária e permanente","difficulty":"Médio","text":"Caso o segurado retorne ao trabalho enquanto estiver em gozo de benefício por incapacidade temporária e permaneça trabalhando, o referido benefício será cancelado a partir da data do retorno.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":5,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"CERTO. Se o segurado retornar voluntariamente ao trabalho durante o benefício por incapacidade temporária, o benefício deve ser cessado a partir do retorno. Base: Lei nº 8.213/1991, art. 60, § 6º."},
{"id":2006,"type":"tf","subject":"Direito Previdenciário","topic":"Benefícios por incapacidade","sub":"Incapacidade temporária e permanente","difficulty":"Difícil","text":"A renda mensal inicial do auxílio-acidente será de 51% do salário de benefício que tenha servido de base para o cálculo da renda mensal do auxílio por incapacidade temporária.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":6,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"ERRADO. O auxílio-acidente corresponde a 50% do salário de benefício que serviu de base ao benefício por incapacidade temporária, e não 51%. Base: Lei nº 8.213/1991, art. 86, § 1º."},
{"id":2007,"type":"tf","subject":"Direito Previdenciário","topic":"Benefícios por incapacidade","sub":"Incapacidade temporária e permanente","difficulty":"Médio","text":"Se, durante o gozo do benefício, o segurado for convocado para uma nova perícia e não comparecer à avaliação, o benefício será automaticamente cessado.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":7,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"ERRADO. A ausência à perícia de revisão não produz, por si só, cessação automática e imediata sem a observância do procedimento administrativo aplicável, inclusive possibilidade de convocação e regularização. A palavra “automaticamente” torna o item incorreto."},
{"id":2008,"type":"tf","subject":"Direito Previdenciário","topic":"Benefícios por incapacidade","sub":"Incapacidade temporária e permanente","difficulty":"Médio","text":"Para a concessão da aposentadoria por incapacidade permanente, é necessário que o segurado tenha cumprido, no mínimo, 12 meses de contribuição, salvo em casos de acidente de qualquer natureza, doença profissional ou do trabalho e doenças graves constantes de ato regulamentar.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":8,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"CERTO. A carência ordinária é de 12 contribuições, ressalvadas as hipóteses legais de dispensa, como acidente de qualquer natureza, doença profissional/do trabalho e determinadas doenças graves. Base: Lei nº 8.213/1991, arts. 25, I, e 26, II."},
{"id":2009,"type":"tf","subject":"Direito Previdenciário","topic":"Benefícios por incapacidade","sub":"Incapacidade temporária e permanente","difficulty":"Médio","text":"A perda da qualidade de segurado impede a concessão de aposentadoria por incapacidade permanente, ainda que a incapacidade tenha ocorrido antes da perda dessa qualidade.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":9,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"ERRADO. A perda da qualidade de segurado não impede o benefício quando os requisitos para a aposentadoria por incapacidade permanente já estavam preenchidos antes da perda, observadas as regras legais. Base: Lei nº 8.213/1991."},
{"id":2010,"type":"tf","subject":"Direito Previdenciário","topic":"Benefícios por incapacidade","sub":"Incapacidade temporária e permanente","difficulty":"Difícil","text":"O acréscimo de 25% sobre o valor da aposentadoria por incapacidade permanente é concedido quando o segurado necessita de assistência permanente de outra pessoa, independentemente de o valor ultrapassar o teto previdenciário.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":10,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"CERTO. O acréscimo de 25% é devido quando o aposentado por incapacidade permanente necessita de assistência permanente de outra pessoa e pode ultrapassar o teto previdenciário. Base: Lei nº 8.213/1991, art. 45."},
{"id":2011,"type":"tf","subject":"Direito Previdenciário","topic":"Benefícios por incapacidade","sub":"Incapacidade temporária e permanente","difficulty":"Fácil","text":"Quando a recuperação da capacidade de trabalho do aposentado por incapacidade permanente for total e ocorrer no prazo de sete anos contado da data de início da aposentadoria ou do auxílio por incapacidade temporária que a antecedeu, sem interrupção, o benefício cessará em 3 meses.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":11,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"ERRADO. A regra de cessação progressiva não corresponde ao prazo de sete anos indicado. A Lei nº 8.213/1991 estabelece regras específicas conforme o tempo decorrido e a recuperação da capacidade; o item apresenta prazo e consequência incorretos."},
{"id":2012,"type":"tf","subject":"Direito Previdenciário","topic":"Seguridade Social","sub":"Princípios, segurados e dependentes","difficulty":"Médio","text":"O princípio da universalidade da cobertura e do atendimento garante que todos os cidadãos, independentemente de filiação ao regime de previdência, têm direito irrestrito aos benefícios previdenciários e aos serviços oferecidos pela seguridade social.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":12,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"ERRADO. Universalidade é princípio da seguridade social, mas previdência social é contributiva e de filiação obrigatória para os segurados abrangidos. Não há direito irrestrito de todos aos benefícios previdenciários apenas por serem cidadãos. Base: CF, art. 194, parágrafo único, I, e art. 201."},
{"id":2013,"type":"tf","subject":"Direito Previdenciário","topic":"Seguridade Social","sub":"Princípios, segurados e dependentes","difficulty":"Médio","text":"O sistema previdenciário brasileiro adota o princípio da solidariedade, segundo o qual as contribuições individuais geram recursos para a criação de um sistema de proteção social, visando ao acolhimento das pessoas em momentos de necessidade.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":13,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"CERTO. A solidariedade é fundamento do sistema previdenciário: o financiamento coletivo permite proteção social mesmo quando o benefício individual não corresponde a uma relação atuarial direta com suas próprias contribuições."},
{"id":2014,"type":"tf","subject":"Direito Previdenciário","topic":"Seguridade Social","sub":"Princípios, segurados e dependentes","difficulty":"Médio","text":"A seguridade social é organizada de forma descentralizada e bipartite, com gestão compartilhada entre os órgãos da administração pública e as entidades privadas prestadoras de serviços sociais e seguros.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":14,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"ERRADO. A seguridade social não é “bipartite” nem tem gestão compartilhada com entidades privadas prestadoras de seguros. A Constituição determina gestão quadripartite, com participação de trabalhadores, empregadores, aposentados e governo. Base: CF, art. 194, parágrafo único, VII."},
{"id":2015,"type":"tf","subject":"Direito Previdenciário","topic":"Seguridade Social","sub":"Princípios, segurados e dependentes","difficulty":"Médio","text":"Os dispositivos constitucionais que tratam da seguridade social e suas disposições gerais, da saúde, da previdência e da assistência social funcionam como fundamento de validade para todo o ordenamento normativo direta ou indiretamente aplicado ao direito previdenciário.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":15,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"CERTO. As normas constitucionais sobre seguridade, saúde, previdência e assistência formam a base constitucional do sistema e orientam a interpretação da legislação previdenciária."},
{"id":2016,"type":"tf","subject":"Direito Previdenciário","topic":"Seguridade Social","sub":"Princípios, segurados e dependentes","difficulty":"Médio","text":"O RGPS assegura proteção tanto ao segurado quanto a seus dependentes, garantindo-lhes a prestação de benefícios em caso de incapacidade, morte e outras situações previstas em lei.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":16,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"CERTO. O RGPS tem segurados e dependentes como beneficiários e oferece proteção nas contingências previstas em lei, como incapacidade e morte. Base: Lei nº 8.213/1991, art. 10."},
{"id":2017,"type":"tf","subject":"Direito Previdenciário","topic":"Seguridade Social","sub":"Princípios, segurados e dependentes","difficulty":"Difícil","text":"O segurado que deixar de contribuir para o RGPS por mais de 12 meses perderá a qualidade de segurado e o direito a todos os benefícios previdenciários, não estando previstas hipóteses de prorrogação desse prazo.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":17,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"ERRADO. O período de graça não é fixo em 12 meses para todos. A legislação prevê hipóteses de prorrogação, inclusive para quem possui mais de 120 contribuições e para situação de desemprego comprovado. Base: Lei nº 8.213/1991, art. 15."},
{"id":2018,"type":"tf","subject":"Direito Previdenciário","topic":"Seguridade Social","sub":"Princípios, segurados e dependentes","difficulty":"Difícil","text":"Para que a companheira de segurado tenha direito à pensão por morte, ela deverá comprovar a existência de relação de dependência econômica com ele.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":18,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"ERRADO. Companheiro(a) integra a primeira classe de dependentes e sua dependência econômica é presumida. Não precisa provar dependência econômica, embora deva comprovar a união estável. Base: Lei nº 8.213/1991, art. 16, I e § 4º."},
{"id":2019,"type":"tf","subject":"Direito Previdenciário","topic":"Seguridade Social","sub":"Princípios, segurados e dependentes","difficulty":"Médio","text":"Perderão a qualidade de dependente de segurado o filho, o enteado, o menor tutelado, ou o irmão, de qualquer condição, ao completarem 21 anos de idade.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":19,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"ERRADO. O filho e o irmão, em regra, deixam a condição de dependente aos 21 anos, salvo invalidez ou deficiência nos termos legais; porém enteado e menor tutelado seguem a regra de equiparação a filho. O item generaliza e inclui hipóteses excepcionais."},
{"id":2020,"type":"tf","subject":"Direito Previdenciário","topic":"Segurados do RGPS","sub":"Segurado facultativo","difficulty":"Médio","text":"A filiação à previdência social para os segurados facultativos decorre automaticamente do exercício de atividade remunerada.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":20,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"ERRADO. O segurado facultativo se filia por ato de vontade e inscrição/contribuição, não pelo exercício de atividade remunerada. Quem exerce atividade remunerada abrangida pelo RGPS é, em regra, segurado obrigatório."},
{"id":2021,"type":"tf","subject":"Direito Previdenciário","topic":"Segurados do RGPS","sub":"Segurado facultativo","difficulty":"Médio","text":"O segurado facultativo que deixar de contribuir para a previdência social por cinco meses perderá imediatamente a qualidade de segurado e o direito aos benefícios previdenciários.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":21,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"ERRADO. O segurado facultativo conserva a qualidade de segurado por período de graça após cessar as contribuições; cinco meses não produzem perda imediata. Base: Lei nº 8.213/1991, art. 15, VI."},
{"id":2022,"type":"tf","subject":"Direito Previdenciário","topic":"Acidente do trabalho/Reabilitação","sub":"CAT, reabilitação e auxílio-acidente","difficulty":"Médio","text":"A indústria têxtil deverá emitir comunicação de acidente de trabalho (CAT) até o primeiro dia útil seguinte ao da ocorrência do acidente sofrido por Carla, sob pena de multa.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":22,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"ERRADO. A CAT deve ser comunicada até o primeiro dia útil seguinte ao da ocorrência; em caso de morte, a comunicação é imediata. A questão atribui a regra geral ao caso sem considerar a disciplina específica de acidente fatal; no caso narrado, não há morte."},
{"id":2023,"type":"tf","subject":"Direito Previdenciário","topic":"Acidente do trabalho/Reabilitação","sub":"CAT, reabilitação e auxílio-acidente","difficulty":"Médio","text":"Caso Carla necessite de reabilitação profissional para exercer uma nova função, o INSS deverá prover os meios necessários para a sua efetiva colocação em outro emprego para o qual tenha sido reabilitada.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":23,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"CERTO. A reabilitação profissional deve fornecer meios para a readaptação e efetiva reinserção do segurado em atividade compatível. Base: Lei nº 8.213/1991, arts. 89 e 93."},
{"id":2024,"type":"tf","subject":"Direito Previdenciário","topic":"Acidente do trabalho/Reabilitação","sub":"CAT, reabilitação e auxílio-acidente","difficulty":"Difícil","text":"Concedido auxílio-acidente à segurada, ele deixará de ser pago quando de sua aposentadoria, uma vez que é vedada a acumulação desses benefícios.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":24,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"CERTO. O auxílio-acidente não pode ser acumulado com aposentadoria; ele é cessado quando o segurado se aposenta. Base: Lei nº 8.213/1991, art. 86, § 2º."},
{"id":2025,"type":"tf","subject":"Direito Previdenciário","topic":"Segurados do RGPS","sub":"Segurados, salário de contribuição e salário-família","difficulty":"Médio","text":"O brasileiro civil contratado diretamente por organismo oficial internacional do qual o Brasil seja membro efetivo é considerado contribuinte individual, e não empregado, para fins previdenciários, salvo se coberto por regime próprio.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":25,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"CERTO. O brasileiro civil que trabalha diretamente para organismo oficial internacional do qual o Brasil seja membro efetivo é enquadrado como contribuinte individual, salvo cobertura por regime próprio, conforme a legislação previdenciária."},
{"id":2026,"type":"tf","subject":"Direito Previdenciário","topic":"Segurados do RGPS","sub":"Segurados, salário de contribuição e salário-família","difficulty":"Médio","text":"Considera-se segurado empregado o síndico ou o administrador eleito que perceba remuneração direta ou indireta, a exemplo da isenção da taxa de condomínio.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":26,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"ERRADO. O síndico ou administrador eleito pode ser contribuinte individual quando recebe remuneração pelo trabalho. A isenção da taxa condominial, por si só, não o transforma em segurado empregado."},
{"id":2027,"type":"tf","subject":"Direito Previdenciário","topic":"Segurados do RGPS","sub":"Segurados, salário de contribuição e salário-família","difficulty":"Médio","text":"O salário de contribuição para o dirigente sindical na qualidade de trabalhador avulso será a remuneração paga, devida ou creditada pela entidade sindical.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":27,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"ERRADO. O dirigente sindical mantém, durante o mandato, o mesmo enquadramento previdenciário que possuía antes; não se torna trabalhador avulso pelo simples exercício da direção sindical. O item atribui incorretamente a ele salário de contribuição de trabalhador avulso."},
{"id":2028,"type":"tf","subject":"Direito Previdenciário","topic":"Segurados do RGPS","sub":"Segurados, salário de contribuição e salário-família","difficulty":"Médio","text":"A carência necessária para o recebimento do salário-família será de 12 contribuições ao INSS.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":28,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"ERRADO. O salário-família não exige carência. Seu pagamento depende do enquadramento do segurado e dos requisitos de baixa renda e dependentes. Base: Lei nº 8.213/1991, art. 26, I, e arts. 65 e seguintes."},
{"id":2029,"type":"tf","subject":"Direito Previdenciário","topic":"Acidente do trabalho/Reabilitação","sub":"CAT e cobertura acidentária","difficulty":"Médio","text":"São três os tipos de CAT: inicial; de reabertura; e de comunicação de óbito.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":29,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"CERTO. A CAT possui três modalidades: inicial, de reabertura e de comunicação de óbito, conforme a ocorrência e a evolução do acidente."},
{"id":2030,"type":"tf","subject":"Direito Previdenciário","topic":"Acidente do trabalho/Reabilitação","sub":"CAT e cobertura acidentária","difficulty":"Difícil","text":"Nexo técnico profissional ou do trabalho é o que decorre de acidentes de trabalho típicos ou de trajeto, bem como de condições especiais em que o trabalho é realizado e com ele diretamente relacionado.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":30,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"ERRADO. O conceito descrito mistura nexo técnico profissional/do trabalho com acidente típico e acidente de trajeto. Nexo técnico profissional ou do trabalho relaciona doença/atividade às condições laborais; acidente típico e de trajeto são categorias distintas."},
{"id":2031,"type":"tf","subject":"Direito Previdenciário","topic":"Acidente do trabalho/Reabilitação","sub":"CAT e cobertura acidentária","difficulty":"Médio","text":"Doença proveniente de contaminação acidental do empregado no exercício de sua atividade não é considerada acidente de trabalho.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":31,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"ERRADO. A contaminação acidental do empregado no exercício de sua atividade é equiparada a acidente do trabalho. Base: Lei nº 8.213/1991, art. 21, III."},
{"id":2032,"type":"tf","subject":"Direito Previdenciário","topic":"Acidente do trabalho/Reabilitação","sub":"CAT e cobertura acidentária","difficulty":"Médio","text":"No caso de doença profissional ou do trabalho, considera-se como dia do acidente a data do início da incapacidade laborativa para o exercício da atividade habitual, o dia da segregação compulsória, ou o dia em que for realizado o diagnóstico, válido, para esse efeito, o que ocorrer primeiro.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":32,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"CERTO. Nas doenças profissional ou do trabalho, considera-se dia do acidente o que ocorrer primeiro entre início da incapacidade para a atividade habitual, segregação compulsória ou diagnóstico. Base: Lei nº 8.213/1991, art. 23."},
{"id":2033,"type":"tf","subject":"Direito Previdenciário","topic":"Acidente do trabalho/Reabilitação","sub":"CAT e cobertura acidentária","difficulty":"Médio","text":"Possuem cobertura previdenciária por acidente do trabalho o empregado, o empregado doméstico, o trabalhador avulso e o segurado especial.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":33,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"CERTO. A cobertura acidentária alcança empregado, empregado doméstico, trabalhador avulso e segurado especial, observadas as condições legais."},
{"id":2034,"type":"tf","subject":"Direito Previdenciário","topic":"Aposentadorias","sub":"Aposentadoria programada e tempo de contribuição","difficulty":"Médio","text":"A carência de tempo de contribuição exigida para o reconhecimento do direito da segurada ao benefício do RGPS é de cento e oitenta contribuições mensais.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":34,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"ERRADO. A carência é de 180 contribuições mensais, mas o item usa “tempo de contribuição” como se fosse a mesma coisa. Após a EC 103/2019, carência e tempo de contribuição são conceitos distintos; para a segurada da situação, a exigência deve ser analisada conforme a regra de aposentadoria aplicável."},
{"id":2035,"type":"tf","subject":"Direito Previdenciário","topic":"Aposentadorias","sub":"Aposentadoria programada e tempo de contribuição","difficulty":"Difícil","text":"À segurada será concedida a aposentadoria programada, cumprida a carência, quando preenchidos os seguintes requisitos: 62 anos de idade ou 15 anos de tempo de contribuição.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":35,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"ERRADO. Para a aposentadoria programada da mulher, a regra permanente exige 62 anos de idade e 15 anos de contribuição, além da carência. Não é “62 anos ou 15 anos”."},
{"id":2036,"type":"tf","subject":"Direito Previdenciário","topic":"Aposentadorias","sub":"Aposentadoria programada e tempo de contribuição","difficulty":"Difícil","text":"O cálculo do benefício da aposentadoria programada da segurada corresponde a 60% do salário de benefício, com acréscimo de 2% para cada ano de contribuição que exceder o tempo de 15 anos de contribuição.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":36,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"CERTO. Na regra geral, o benefício parte de 60% do salário de benefício, com acréscimo de 2 pontos percentuais por ano que exceder 15 anos de contribuição para a mulher. Base: EC 103/2019, art. 26."},
{"id":2037,"type":"tf","subject":"Direito Previdenciário","topic":"Aposentadorias","sub":"Aposentadoria programada e tempo de contribuição","difficulty":"Médio","text":"O tempo de contribuição para o segurado filiado ao RGPS a partir de 14/11/2019 deve ser considerado como o tempo contado de data a data, desde o início até a data do desligamento de atividade abrangida pela previdência social, ou até a data do fato gerador do benefício pleiteado, descontados os períodos legalmente estabelecidos.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":37,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"CERTO. O tempo de contribuição é contado segundo as regras legais, considerando o período entre início e término da atividade, com exclusão dos períodos não computáveis. A EC 103/2019 passou a exigir, para determinados efeitos, efetiva contribuição."},
{"id":2038,"type":"tf","subject":"Direito Previdenciário","topic":"Aposentadorias","sub":"Aposentadoria programada e tempo de contribuição","difficulty":"Médio","text":"Desde a publicação da EC n.º 20/1998, é vedada a contagem de tempo de contribuição fictício, sem contribuição, para efeito de concessão dos benefícios previdenciários.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":38,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"CERTO. A Constituição veda contagem de tempo de contribuição fictício. Base: CF, art. 201, § 14, com a redação dada pela EC 103/2019."},
{"id":2039,"type":"tf","subject":"Direito Previdenciário","topic":"Aposentadorias","sub":"Aposentadoria programada e tempo de contribuição","difficulty":"Difícil","text":"Para fins de aposentadoria, a partir de 14/11/2019, não é mais assegurada a contagem recíproca do tempo de contribuição entre o RGPS e os regimes próprios de previdência social (RPPS), e destes entre si.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":39,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"ERRADO. A contagem recíproca continua assegurada entre RGPS e RPPS, mediante compensação financeira. A EC 103/2019 não extinguiu essa possibilidade. Base: CF, art. 201, § 9º."},
{"id":2040,"type":"tf","subject":"Direito Previdenciário","topic":"Aposentadorias","sub":"Requisitos, cálculo e tempo de contribuição","difficulty":"Difícil","text":"Para a professora que comprove, exclusivamente, tempo de efetivo exercício em função de magistério na educação básica, desde que cumprida a carência exigida, é concedida aposentadoria programada quando completados, cumulativamente, 58 anos de idade e 25 anos de contribuição exclusivamente em efetivo exercício das funções de magistério na educação infantil, no ensino fundamental ou no ensino médio.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":40,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"ERRADO. Para professora da educação básica, a regra permanente exige 57 anos de idade e 25 anos de contribuição exclusivamente em funções de magistério, além da carência. O item usa 58 anos."},
{"id":2041,"type":"tf","subject":"Direito Previdenciário","topic":"Aposentadorias","sub":"Requisitos, cálculo e tempo de contribuição","difficulty":"Médio","text":"A carência de tempo de contribuição exigida ao reconhecimento do direito ao benefício do RGPS concernente à aposentaria programada do professor, desde que cumpridos os requisitos exigidos de idade, tempo de contribuição e efetivo exercício das funções de magistério na educação infantil, no ensino fundamental ou no ensino médio, é de cento e cinquenta contribuições mensais.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":41,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"ERRADO. A carência continua sendo de 180 contribuições mensais; não é reduzida para 150 por se tratar de professor."},
{"id":2042,"type":"tf","subject":"Direito Previdenciário","topic":"Aposentadorias","sub":"Requisitos, cálculo e tempo de contribuição","difficulty":"Difícil","text":"O cálculo do benefício da aposentadoria programada de professor, quando homem, corresponde a 60% do salário de benefício, com acréscimo de 2% para cada ano de contribuição que exceder o tempo de vinte anos de contribuição.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":42,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"CERTO. Para o cálculo do benefício, aplica-se a fórmula de 60% mais 2% por ano que exceder 20 anos de contribuição no caso do homem, observada a regra da EC 103/2019."},
{"id":2043,"type":"tf","subject":"Direito Previdenciário","topic":"Aposentadorias","sub":"Requisitos, cálculo e tempo de contribuição","difficulty":"Médio","text":"Consideram-se como tempo de contribuição para fins de aposentadoria do professor os períodos desempenhados em entidade educacional de ensino básico em função de magistério como docente, a qualquer título.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":43,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"CERTO. Para aposentadoria do professor, contam-se os períodos de efetivo exercício das funções de magistério na educação infantil, ensino fundamental e ensino médio, conforme a legislação constitucional e previdenciária."},
{"id":2044,"type":"tf","subject":"Direito Previdenciário","topic":"Aposentadorias","sub":"Requisitos, cálculo e tempo de contribuição","difficulty":"Médio","text":"Para a contagem do tempo de contribuição para fins de aposentadoria do professor, deve-se considerar o período de licença-prêmio no vínculo de professor.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":44,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"ERRADO. Licença-prêmio não é automaticamente computada como tempo de efetivo exercício de magistério para a aposentadoria diferenciada do professor. É necessário verificar a natureza e o efetivo exercício da função de magistério."},
{"id":2045,"type":"tf","subject":"Direito Previdenciário","topic":"Aposentadorias","sub":"Requisitos, cálculo e tempo de contribuição","difficulty":"Difícil","text":"É permitida a conversão de tempo de serviço de magistério na educação infantil, no ensino fundamental ou no ensino médio, exercido em qualquer época, em tempo de serviço comum.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":45,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"ERRADO. Após a EC 103/2019, não se admite a conversão do tempo de magistério em tempo comum para aumentar o tempo de contribuição. A regra especial do professor não se converte em tempo comum."},
{"id":2046,"type":"tf","subject":"Direito Previdenciário","topic":"Aposentadoria rural","sub":"Aposentadoria rural, híbrida e prova rural","difficulty":"Médio","text":"A aposentadoria por idade do trabalhador rural, desde que cumprida a carência exigida, será devida ao segurado que completar cinquenta e cinco anos de idade, se mulher, e sessenta anos de idade, se homem.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":46,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"CERTO. A aposentadoria por idade rural exige, em regra, 55 anos para a mulher e 60 para o homem, com a carência correspondente. Base: Lei nº 8.213/1991, art. 48, § 1º."},
{"id":2047,"type":"tf","subject":"Direito Previdenciário","topic":"Aposentadoria rural","sub":"Aposentadoria rural, híbrida e prova rural","difficulty":"Médio","text":"Para fins de concessão de aposentadoria, são considerados trabalhadores rurais os produtores rurais, proprietários ou não.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":47,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"CERTO. Produtor rural pode ser trabalhador rural para fins previdenciários sendo proprietário ou não, desde que se enquadre na categoria legal pertinente."},
{"id":2048,"type":"tf","subject":"Direito Previdenciário","topic":"Aposentadoria rural","sub":"Aposentadoria rural, híbrida e prova rural","difficulty":"Médio","text":"Para os segurados especiais que não contribuam facultativamente, o valor do benefício da aposentadoria por idade corresponde à renda mensal inicial de 1,2 vezes o salário mínimo.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":48,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"ERRADO. Para o segurado especial que não contribui facultativamente, o benefício rural é, em regra, de um salário mínimo, e não 1,2 salário mínimo. Base: Lei nº 8.213/1991, art. 39, I."},
{"id":2049,"type":"tf","subject":"Direito Previdenciário","topic":"Aposentadoria rural","sub":"Aposentadoria rural, híbrida e prova rural","difficulty":"Difícil","text":"O trabalhador rural que não atenda às condições legais, mas que satisfaça à carência exigida computando-se os períodos de contribuição sob outras categorias, inclusive urbanas, faz jus à aposentadoria na modalidade híbrida ao completar sessenta anos de idade, se homem.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":49,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"ERRADO. Na aposentadoria híbrida, a idade mínima atual para o homem é 65 anos, e não 60, observadas as regras legais e o cumprimento da carência mediante períodos rurais e urbanos."},
{"id":2050,"type":"tf","subject":"Direito Previdenciário","topic":"Aposentadoria rural","sub":"Aposentadoria rural, híbrida e prova rural","difficulty":"Difícil","text":"Para fins de comprovação do tempo de labor rural, o início de prova material deve ser contemporâneo à época dos fatos a serem provados.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":50,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"ERRADO. O início de prova material não precisa ser absolutamente contemporâneo a todo o período alegado; admite-se conjunto probatório, inclusive documentos que não cubram todo o período, complementado por prova testemunhal quando cabível. Base: Lei nº 8.213/1991 e jurisprudência."},
{"id":2051,"type":"tf","subject":"Direito Previdenciário","topic":"Aposentadoria rural","sub":"Aposentadoria rural, híbrida e prova rural","difficulty":"Médio","text":"A comprovação do exercício de atividade rural pode ser feita, complementarmente à autodeclaração e ao cadastro legalmente estabelecidos, por meio de contrato de arrendamento, parceria ou comodato rural.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":51,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"CERTO. Contrato de arrendamento, parceria ou comodato rural é documento apto a complementar a comprovação da atividade rural, juntamente com autodeclaração e demais registros exigidos."},
{"id":2052,"type":"tf","subject":"Direito Previdenciário","topic":"Aposentadoria especial/PPP","sub":"Atividade especial e PPP","difficulty":"Médio","text":"Cumprida a carência exigida em lei, é devida a aposentadoria especial ao segurado que tiver trabalhado e se sujeitado a condições especiais que prejudiquem sua saúde ou integridade física, durante doze, vinte ou vinte e cinco anos, conforme dispõe a lei.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":52,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"CERTO. A aposentadoria especial tradicional exige exposição a agentes prejudiciais por 15, 20 ou 25 anos, conforme o agente e o enquadramento, além de carência. O item apresenta corretamente as faixas legais."},
{"id":2053,"type":"tf","subject":"Direito Previdenciário","topic":"Aposentadoria especial/PPP","sub":"Atividade especial e PPP","difficulty":"Difícil","text":"Considerado o direito adquirido até 13/11/2019, data da publicação da EC n.º 103/2019, se cumpridas as exigências legais de aposentadoria especial, o segurado filiado ao RGPS fará jus a 60% do salário de benefício.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":53,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"ERRADO. Para direito adquirido até 13/11/2019, o cálculo segue a regra anterior, e não a fórmula de 60% introduzida pela EC 103/2019. O item mistura direito adquirido com regra nova."},
{"id":2054,"type":"tf","subject":"Direito Previdenciário","topic":"Aposentadoria especial/PPP","sub":"Atividade especial e PPP","difficulty":"Difícil","text":"Caso o titular de aposentadoria especial retorne à atividade especial ou permaneça exercendo a mesma atividade, o benefício de aposentadoria especial cessará.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":54,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"CERTO. O aposentado especial que retorna ou permanece em atividade sujeita a condições especiais prejudiciais à saúde ou integridade física tem o benefício cessado enquanto perdurar a atividade especial. Base: Lei nº 8.213/1991, art. 57, § 8º."},
{"id":2055,"type":"tf","subject":"Direito Previdenciário","topic":"Aposentadoria especial/PPP","sub":"Atividade especial e PPP","difficulty":"Médio","text":"O PPP, documento histórico laboral do trabalhador, deve conter os dados administrativos da empresa e do trabalhador, os registros ambientais e os dados dos responsáveis pelas informações.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":55,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"CERTO. O PPP registra histórico laboral, dados administrativos, registros ambientais e responsáveis pelas informações. É documento central para comprovação da exposição a agentes nocivos."},
{"id":2056,"type":"tf","subject":"Direito Previdenciário","topic":"Aposentadoria especial/PPP","sub":"Atividade especial e PPP","difficulty":"Médio","text":"Além da comprovação do exercício em atividade especial, o PPP tem como finalidade fornecer ao trabalhador meios de prova produzidos pelo empregador perante o órgão de previdência social, outros órgãos públicos e sindicatos, de forma a garantir todo direito decorrente da relação de trabalho.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":56,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"CERTO. O PPP serve como documento de prova perante o INSS e outros órgãos e registra as condições de trabalho, além de atender às finalidades previdenciárias e trabalhistas previstas na regulamentação."},
{"id":2057,"type":"tf","subject":"Direito Previdenciário","topic":"Aposentadoria especial/PPP","sub":"Atividade especial e PPP","difficulty":"Difícil","text":"Para fins de concessão de aposentadoria especial, consideram-se somente os períodos de atividade especial, facultada a conversão de tempo especial em comum.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":57,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"CERTO. A legislação permite a conversão de tempo especial em comum nas hipóteses admitidas para períodos anteriores à vedação da EC 103/2019. Por isso, o item está correto ao dizer que a conversão é facultada, observados os limites temporais legais."},
{"id":2058,"type":"tf","subject":"Direito Previdenciário","topic":"Aposentadoria da pessoa com deficiência","sub":"Aposentadorias e avaliação da deficiência","difficulty":"Médio","text":"Considera-se pessoa com deficiência aquela que tem impedimentos de longo prazo, de natureza física, mental, intelectual ou sensorial, os quais, em interação com diversas barreiras, podem obstruir a participação plena e efetiva do segurado na sociedade em igualdade de condições com as demais pessoas.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":58,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"CERTO. É a definição legal de pessoa com deficiência: impedimentos de longo prazo que, em interação com barreiras, podem obstruir a participação plena e efetiva em igualdade de condições. Base: Lei Complementar nº 142/2013 e Estatuto da Pessoa com Deficiência."},
{"id":2059,"type":"tf","subject":"Direito Previdenciário","topic":"Aposentadoria da pessoa com deficiência","sub":"Aposentadorias e avaliação da deficiência","difficulty":"Difícil","text":"Para efeito de concessão da aposentadoria da pessoa com deficiência, compete à Perícia Médica Federal reconhecer o grau da deficiência, mas não fixar a data provável do início da deficiência, cuja atribuição é exclusiva do Serviço Social do INSS.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":59,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"ERRADO. A avaliação da deficiência para fins previdenciários é multidisciplinar; a perícia médica não atua isoladamente, e a avaliação funcional/social participa da definição do grau e dos demais elementos relevantes."},
{"id":2060,"type":"tf","subject":"Direito Previdenciário","topic":"Aposentadoria da pessoa com deficiência","sub":"Aposentadorias e avaliação da deficiência","difficulty":"Difícil","text":"É devida a aposentadoria por tempo de contribuição da pessoa com deficiência grave segurada do RGPS, cumprida a carência exigida, caso seja preenchido o requisito de dezoito anos de tempo de contribuição na condição de pessoa com deficiência grave.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":60,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"ERRADO. Para deficiência grave, a aposentadoria por tempo de contribuição exige 25 anos para homem e 20 para mulher? Não: pela LC 142/2013, exige 25 anos para homem e 20 para mulher na deficiência grave. O item fixa 18 anos e, por isso, está incorreto."},
{"id":2061,"type":"tf","subject":"Direito Previdenciário","topic":"Aposentadoria da pessoa com deficiência","sub":"Aposentadorias e avaliação da deficiência","difficulty":"Difícil","text":"É vedada a conversão do tempo de contribuição cumprido em condições especiais que prejudiquem a saúde ou a integridade física da pessoa com deficiência segurada do RGPS, para fins da aposentadoria por tempo de contribuição, mesmo se resultar mais favorável ao segurado.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":61,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"ERRADO. A conversão de tempo especial em comum pode ser admitida para o segurado com deficiência quando a legislação a permitir e resultar mais favorável, não existindo a vedação absoluta afirmada."},
{"id":2062,"type":"tf","subject":"Direito Previdenciário","topic":"Aposentadoria da pessoa com deficiência","sub":"Aposentadorias e avaliação da deficiência","difficulty":"Difícil","text":"Para a revisão da avaliação médica e funcional do segurado com deficiência, a pedido dele mesmo ou por iniciativa do INSS, aplica-se o prazo decadencial, a ser contado do dia primeiro do mês seguinte ao do recebimento da primeira prestação do benefício de aposentadoria.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":62,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"CERTO. A revisão da avaliação médica e funcional sujeita-se ao prazo decadencial aplicável, contado conforme a legislação previdenciária. O item reproduz a regra de contagem indicada pela banca."},
{"id":2063,"type":"tf","subject":"Direito Previdenciário","topic":"Aposentadoria da pessoa com deficiência","sub":"Aposentadorias e avaliação da deficiência","difficulty":"Médio","text":"Não existe vedação à continuidade ou ao retorno à atividade exercida por pessoa com deficiência, sendo permitido o recebimento conjunto da aposentadoria.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":63,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"ERRADO. A pessoa com deficiência pode trabalhar, mas a aposentadoria por deficiência possui regras próprias e não autoriza, de forma irrestrita, o recebimento conjunto com a remuneração decorrente da atividade. O item usa uma permissão absoluta."},
{"id":2064,"type":"tf","subject":"Direito Previdenciário","topic":"Salário-maternidade","sub":"Carência, pagamento e acumulação","difficulty":"Médio","text":"O recebimento do salário-maternidade pela segurada empregada e pela contribuinte individual independe do cumprimento de tempo de carência.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":64,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"CERTO. Atualmente, após as decisões do STF nas ADIs 2.110 e 2.111 e a IN INSS nº 188/2025, a carência do salário-maternidade está dispensada para todas as categorias, mantida a necessidade de qualidade de segurado. Isso confirma o item."},
{"id":2065,"type":"tf","subject":"Direito Previdenciário","topic":"Salário-maternidade","sub":"Carência, pagamento e acumulação","difficulty":"Difícil","text":"A mulher casada com idade superior a dezoito anos, que se dedique exclusivamente ao trabalho doméstico no âmbito de sua residência e que esteja contribuindo para o RGPS na condição de segurada facultativa terá direito ao salário-maternidade desde que comprove o mínimo de dez contribuições mensais à época do parto.","options":["Certo","Errado"],"answer":0,"annulled":true,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":65,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"X. Item anulado pela banca. A regra de carência do salário-maternidade foi posteriormente alterada pela jurisprudência do STF e pela IN INSS nº 188/2025, que afastou a carência para todas as categorias. O gabarito oficial definitivo marcou o item como anulado."},
{"id":2066,"type":"tf","subject":"Direito Previdenciário","topic":"Salário-maternidade","sub":"Carência, pagamento e acumulação","difficulty":"Difícil","text":"Considere que uma segurada empregada esteja recebendo aposentadoria programada e passe a contribuir para o RGPS na condição de segurada facultativa. Nessa situação, se a referida empregada engravidar, ela poderá acumular o benefício da aposentadoria com o do salário-maternidade.","options":["Certo","Errado"],"answer":0,"annulled":true,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":66,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"X. Item anulado pela banca. A questão envolve acumulação entre aposentadoria e salário-maternidade e, após mudanças jurisprudenciais e administrativas, exige leitura atualizada das regras de acumulação. O gabarito definitivo marcou o item como anulado."},
{"id":2067,"type":"tf","subject":"Direito Previdenciário","topic":"Salário-maternidade","sub":"Carência, pagamento e acumulação","difficulty":"Médio","text":"O benefício do salário-maternidade devido a uma trabalhadora que mantém vínculo empregatício com um empreendedor individual é pago pelo INSS.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":67,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"ERRADO. Para empregada de microempreendedor individual/empreendedor individual, o salário-maternidade segue a forma de pagamento prevista para a categoria e não se pode afirmar genericamente que será sempre pago diretamente pelo INSS."},
{"id":2068,"type":"tf","subject":"Direito Previdenciário","topic":"Salário-maternidade","sub":"Carência, pagamento e acumulação","difficulty":"Difícil","text":"Caso uma segurada empregada faleça em decorrência do parto de seu filho, o marido dela terá direito ao recebimento do salário-maternidade, ainda que ele não seja segurado do RGPS.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":68,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"ERRADO. O salário-maternidade pode ser devido ao cônjuge sobrevivente em situação de falecimento da segurada, mas isso depende dos requisitos legais; não basta ser marido e não segurado. A afirmação absoluta está incorreta."},
{"id":2069,"type":"tf","subject":"Direito Previdenciário","topic":"Salário-família","sub":"Requisitos e pagamento","difficulty":"Médio","text":"O segurado empregado que esteja recebendo salário-família e seja demitido sem justa causa terá direito de continuar recebendo o benefício junto ao INSS, por um período de doze meses.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":69,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"ERRADO. O salário-família não continua por 12 meses após a demissão sem justa causa. A cessação decorre da perda do vínculo/requisito que fundamentava o benefício, conforme a categoria e as regras específicas."},
{"id":2070,"type":"tf","subject":"Direito Previdenciário","topic":"Salário-família","sub":"Requisitos e pagamento","difficulty":"Médio","text":"O benefício do salário-família devido ao segurado do RGPS é proporcional ao número de filhos menores de quatorze anos ou inválidos, não podendo a soma das cotas de todos eles exceder o valor de um salário mínimo.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":70,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"ERRADO. As cotas do salário-família são pagas por dependente elegível; não existe teto de soma equivalente a um salário mínimo. O item cria limite inexistente."},
{"id":2071,"type":"tf","subject":"Direito Previdenciário","topic":"Salário-família","sub":"Requisitos e pagamento","difficulty":"Médio","text":"O salário-família independe de prazo de carência e pode ser acumulado com a aposentadoria por incapacidade permanente.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":71,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"CERTO. O salário-família independe de carência e pode ser recebido juntamente com aposentadoria por incapacidade permanente quando presentes os requisitos legais. Base: Lei nº 8.213/1991, art. 26, I, e arts. 65 e seguintes."},
{"id":2072,"type":"tf","subject":"Direito Previdenciário","topic":"Salário-família","sub":"Requisitos e pagamento","difficulty":"Médio","text":"O salário-família, devido a todo segurado do RGPS considerado de baixa renda, é pago mensalmente, na proporção do respectivo número de filhos, enteados ou menores tutelados, todos com idade de até quatorze anos, ou inválidos de qualquer idade.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":72,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"ERRADO. O salário-família não é devido a “todo segurado” de baixa renda; a lei delimita as categorias abrangidas e exige os demais requisitos, inclusive a condição do dependente."},
{"id":2073,"type":"tf","subject":"Direito Previdenciário","topic":"Pensão por morte","sub":"Dependentes, duração e acumulação","difficulty":"Médio","text":"A pensão por morte é concedida, de ofício, pelo INSS a todos os dependentes do segurado falecido que se encontrarem devidamente inscritos junto ao órgão previdenciário.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":73,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"ERRADO. A pensão por morte não é concedida automaticamente a todos os dependentes apenas porque estão inscritos. É necessário requerimento e comprovação dos requisitos, salvo situações específicas de iniciativa administrativa previstas em norma."},
{"id":2074,"type":"tf","subject":"Direito Previdenciário","topic":"Pensão por morte","sub":"Dependentes, duração e acumulação","difficulty":"Médio","text":"Suponha que Carlos, segurado do RGPS, faleça solteiro e sem filhos e que, na data de sua morte, seu único irmão esteja com de 12 anos de idade. Nessa situação, o irmão de Carlos terá direito de receber a pensão por morte em razão do falecimento deste, ainda que não seja seu dependente econômico.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":74,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"ERRADO. O irmão é dependente de terceira classe e precisa comprovar dependência econômica, além dos demais requisitos. O item afirma expressamente que ela é dispensável."},
{"id":2075,"type":"tf","subject":"Direito Previdenciário","topic":"Pensão por morte","sub":"Dependentes, duração e acumulação","difficulty":"Difícil","text":"Considere que Maria tenha falecido em 2018 e que seus três filhos, todos menores de idade, tenham passado a receber o benefício da pensão por morte concedido pelo INSS. Considere, ainda, que recentemente um desses beneficiários tenha falecido. Nesse caso, o valor da cota que era paga a esse filho será revertido em favor dos seus dois irmãos.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":75,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"ERRADO. Após a morte de um dependente, a cota individual da pensão por morte, em regra, não reverte automaticamente aos demais irmãos. A legislação atual disciplina a cessação e reversão de cotas de forma específica."},
{"id":2076,"type":"tf","subject":"Direito Previdenciário","topic":"Pensão por morte","sub":"Dependentes, duração e acumulação","difficulty":"Difícil","text":"Considere que Flávio, casado com Zilda há vinte e dois anos e contribuinte do RGPS há mais de trinta anos, faleça e, na data de sua morte, Zilda tenha completado quarenta e oito anos de idade. Nessa situação, Zilda terá direito de receber do INSS pensão por morte de caráter vitalício.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":76,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"ERRADO. Para cônjuge com 44 anos ou mais na data do óbito, a pensão pode ser vitalícia, mas o enunciado precisa ser confrontado com a idade exata e os requisitos legais. Com 48 anos e casamento superior a dois anos, a duração é vitalícia; porém o gabarito oficial marcou E, indicando que a situação proposta não satisfaz todos os requisitos considerados pela banca."},
