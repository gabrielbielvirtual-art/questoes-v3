<script>
const seed=[
{id:1,type:'mc',subject:'Direito Constitucional',topic:'Direitos Fundamentais',sub:'Direitos e Garantias',difficulty:'Fácil',text:'Qual princípio está expressamente previsto como fundamento da República Federativa do Brasil?',options:['Soberania','Eficiência','Anterioridade','Duplo grau de jurisdição'],answer:0,explain:'A soberania está entre os fundamentos da República Federativa do Brasil.'},
{id:2,type:'tf',subject:'Direito Constitucional',topic:'Administração Pública',sub:'Princípios',difficulty:'Médio',text:'A administração pública direta e indireta obedecerá aos princípios de legalidade, impessoalidade, moralidade, publicidade e eficiência.',options:['Certo','Errado'],answer:0,explain:'Certo. Esses princípios estão previstos no art. 37, caput, da Constituição.'},
{id:3,type:'mc',subject:'Português',topic:'Interpretação',sub:'Compreensão textual',difficulty:'Médio',text:'Em uma questão de interpretação, a resposta correta deve ser fundamentada principalmente:',options:['Em opinião pessoal','No texto apresentado','No senso comum','Na alternativa mais longa'],answer:1,explain:'A resposta deve ser construída a partir das informações e relações presentes no texto.'},
{id:4,type:'mc',subject:'Raciocínio Lógico',topic:'Proposições',sub:'Lógica proposicional',difficulty:'Difícil',text:'Se uma proposição P é verdadeira e Q é falsa, então P ∧ Q é:',options:['Verdadeira','Falsa','Indeterminada','Uma tautologia'],answer:1,explain:'A conjunção só é verdadeira quando as duas proposições são verdadeiras.'},
{id:5,type:'tf',subject:'Direito Administrativo',topic:'Atos Administrativos',sub:'Atributos',difficulty:'Fácil',text:'Todo ato administrativo possui presunção absoluta de legitimidade.',options:['Certo','Errado'],answer:1,explain:'Errado. A presunção de legitimidade é, em regra, relativa.'},
{id:6,type:'mc',subject:'Informática',topic:'Segurança',sub:'Boas práticas',difficulty:'Fácil',text:'Qual prática reduz o risco de comprometimento de uma conta?',options:['Reutilizar a mesma senha','Ativar autenticação em dois fatores','Desativar atualizações','Compartilhar códigos de acesso'],answer:1,explain:'A autenticação em dois fatores acrescenta uma camada de proteção além da senha.'},
{id:7,type:'tf',subject:'Direito Previdenciário',topic:'Talidomida',sub:'Pensão especial',difficulty:'Médio',text:'A pensão especial destinada às pessoas com deficiência física conhecida como Síndrome da Talidomida possui natureza mensal, vitalícia e intransferível.',options:['Certo','Errado'],answer:0,explain:'Certo. A Lei nº 7.070/1982 prevê pensão especial mensal, vitalícia e intransferível. A questão foi adaptada de temas cobrados pelo Cebraspe sobre benefícios de legislação especial.'},
{id:8,type:'tf',subject:'Direito Previdenciário',topic:'Talidomida',sub:'Acumulação',difficulty:'Médio',text:'A pensão especial da Síndrome da Talidomida não prejudica o recebimento de benefícios de natureza previdenciária.',options:['Certo','Errado'],answer:0,explain:'Certo. A Lei nº 7.070/1982 estabelece que o benefício tem natureza indenizatória e não prejudica eventuais benefícios de natureza previdenciária.'},
{id:9,type:'tf',subject:'Direito Previdenciário',topic:'Talidomida',sub:'Acumulação',difficulty:'Difícil',text:'A pensão especial da Síndrome da Talidomida pode ser acumulada, sem direito de opção, com qualquer rendimento ou indenização paga pela União.',options:['Certo','Errado'],answer:1,explain:'Errado. A lei estabelece regra de não acumulação com rendimento ou indenização paga pela União, ressalvada a indenização por dano moral prevista em lei específica e o direito de opção.'},
{id:10,type:'tf',subject:'Direito Previdenciário',topic:'Seringueiros',sub:'Pensão mensal vitalícia',difficulty:'Médio',text:'A pensão especial dos seringueiros prevista no art. 54 do ADCT corresponde a dois salários mínimos vigentes no país.',options:['Certo','Errado'],answer:0,explain:'Certo. A Lei nº 7.986/1989 prevê pensão mensal vitalícia de dois salários mínimos para os seringueiros que preencham os requisitos legais.'},
{id:11,type:'tf',subject:'Direito Previdenciário',topic:'Seringueiros',sub:'Acumulação',difficulty:'Difícil',text:'O beneficiário da pensão especial dos seringueiros está impedido, em qualquer hipótese, de receber outro benefício pago pelo RGPS ou por RPPS.',options:['Certo','Errado'],answer:1,explain:'Errado. A questão reproduz, em sentido adaptado, tema cobrado pelo Cebraspe. A legislação e a regulamentação devem ser observadas quanto às hipóteses de acumulação; não se pode afirmar uma vedação absoluta e genérica.'},
{id:12,type:'tf',subject:'Direito Previdenciário',topic:'Ex-combatentes',sub:'Pensão especial',difficulty:'Médio',text:'A Lei nº 8.059/1990 disciplina a pensão especial devida a quem participou de operações bélicas durante a Segunda Guerra Mundial e aos respectivos dependentes.',options:['Certo','Errado'],answer:0,explain:'Certo. Esse é o objeto central da Lei nº 8.059/1990.'},
{id:13,type:'tf',subject:'Direito Previdenciário',topic:'Ex-combatentes',sub:'Dependentes',difficulty:'Médio',text:'Para a Lei nº 8.059/1990, companheira é, entre outras hipóteses, aquela que tenha filho comum com o ex-combatente ou viva com ele em união estável pelo período mínimo previsto em lei.',options:['Certo','Errado'],answer:0,explain:'Certo. A lei define companheira para fins da pensão especial e estabelece as condições pertinentes.'},
{id:14,type:'tf',subject:'Direito Previdenciário',topic:'Anistiados políticos',sub:'Reparação econômica',difficulty:'Médio',text:'A reparação econômica do anistiado político pode ocorrer em prestação única ou em prestação mensal, permanente e continuada, conforme as condições legais.',options:['Certo','Errado'],answer:0,explain:'Certo. A Lei nº 10.559/2002 prevê essas duas modalidades de reparação econômica.'},
{id:15,type:'tf',subject:'Direito Previdenciário',topic:'Anistiados políticos',sub:'Acumulação',difficulty:'Difícil',text:'A reparação econômica em prestação única pode ser acumulada com a reparação econômica em prestação mensal, permanente e continuada.',options:['Certo','Errado'],answer:1,explain:'Errado. A Lei nº 10.559/2002 veda a acumulação entre essas duas modalidades, assegurando a opção conforme a disciplina legal.'},
{id:16,type:'tf',subject:'Direito Previdenciário',topic:'Anistiados políticos',sub:'Prestação mensal',difficulty:'Médio',text:'A reparação econômica mensal, permanente e continuada é assegurada aos anistiados políticos que comprovem vínculos com a atividade laboral, ressalvada a opção pela prestação única.',options:['Certo','Errado'],answer:0,explain:'Certo. É o que dispõe o art. 5º da Lei nº 10.559/2002.'},
{id:17,type:'tf',subject:'Direito Previdenciário',topic:'Hemodiálise de Caruaru',sub:'Pensão especial',difficulty:'Médio',text:'A pensão especial prevista na Lei nº 9.422/1996 é devida aos dependentes especificados das vítimas fatais de hepatite tóxica decorrente de contaminação em processo de hemodiálise no Instituto de Doenças Renais de Caruaru, no período legalmente delimitado.',options:['Certo','Errado'],answer:0,explain:'Certo. A Lei nº 9.422/1996 trata dessa pensão especial e delimita as vítimas e o período da contaminação.'},
{id:18,type:'tf',subject:'Direito Previdenciário',topic:'Hemodiálise de Caruaru',sub:'Valor',difficulty:'Médio',text:'A pensão especial prevista na Lei nº 9.422/1996 possui valor correspondente a um salário mínimo vigente no país.',options:['Certo','Errado'],answer:0,explain:'Certo. O art. 1º da Lei nº 9.422/1996 estabelece esse valor.'},
{id:19,type:'tf',subject:'Direito Previdenciário',topic:'Hanseníase',sub:'Isolamento compulsório',difficulty:'Médio',text:'A pensão especial das pessoas atingidas pela hanseníase alcança quem foi compulsoriamente submetido, até 31 de dezembro de 1986, a isolamento ou internação nas hipóteses previstas em lei.',options:['Certo','Errado'],answer:0,explain:'Certo. A Lei nº 11.520/2007, com alterações posteriores, contempla essas situações.'},
{id:20,type:'tf',subject:'Direito Previdenciário',topic:'Hanseníase',sub:'Natureza',difficulty:'Difícil',text:'A pensão especial destinada às pessoas atingidas pela hanseníase, nas hipóteses da Lei nº 11.520/2007, é personalíssima e pode ser transferida aos dependentes e herdeiros após a morte do beneficiário.',options:['Certo','Errado'],answer:1,explain:'Errado. A lei estabelece que a pensão é personalíssima e não é transmissível a dependentes e herdeiros. A legislação de 2023 também ampliou o alcance do benefício a filhos em situações específicas, sem transformar a pensão original em benefício transmissível.'},
{id:21,type:'tf',subject:'Direito Previdenciário',topic:'Zika vírus',sub:'Pensão especial',difficulty:'Médio',text:'A pensão especial da Lei nº 13.985/2020 é mensal, vitalícia, intransferível e tem valor de um salário mínimo.',options:['Certo','Errado'],answer:0,explain:'Certo. Essas características estão expressamente previstas no art. 1º, § 1º, da Lei nº 13.985/2020.'},
{id:22,type:'tf',subject:'Direito Previdenciário',topic:'Zika vírus',sub:'Acumulação',difficulty:'Difícil',text:'A pensão especial destinada a crianças com Síndrome Congênita do Zika Vírus pode ser acumulada com o BPC e com indenizações pagas pela União pelos mesmos fatos.',options:['Certo','Errado'],answer:1,explain:'Errado. A Lei nº 13.985/2020 veda a acumulação com o BPC e com indenizações pagas pela União em razão de decisão judicial sobre os mesmos fatos.'},
{id:23,type:'tf',subject:'Direito Previdenciário',topic:'Jogadores campeões',sub:'Auxílio especial mensal',difficulty:'Médio',text:'O auxílio especial mensal previsto na Lei nº 12.663/2012 é destinado aos jogadores titulares ou reservas das seleções brasileiras campeãs das Copas do Mundo de 1958, 1962 e 1970 que estejam nas condições previstas na lei.',options:['Certo','Errado'],answer:0,explain:'Certo. A Lei nº 12.663/2012 instituiu o auxílio especial mensal para jogadores dessas seleções que preencham os requisitos legais.'},
{id:24,type:'tf',subject:'Direito Previdenciário',topic:'Jogadores campeões',sub:'Dependentes',difficulty:'Difícil',text:'Em caso de falecimento do jogador beneficiário do auxílio especial mensal, o benefício é automaticamente transmitido a todos os seus parentes, independentemente das condições estabelecidas na Lei nº 12.663/2012.',options:['Certo','Errado'],answer:1,explain:'Errado. A lei prevê especificamente esposa ou companheira e filhos menores de 21 anos ou inválidos, observadas as condições legais, e não uma transmissão automática a todos os parentes.'},
{id:25,type:'tf',subject:'Direito Previdenciário',topic:'Jogadores campeões',sub:'Requerimento',difficulty:'Médio',text:'O pagamento do auxílio especial mensal aos jogadores das seleções campeãs retroage à data em que, atendidos os requisitos, tenha sido protocolado o requerimento no INSS.',options:['Certo','Errado'],answer:0,explain:'Certo. É o que dispõe o art. 45 da Lei nº 12.663/2012. Questão adaptada de cobrança do Cebraspe sobre esse benefício.'},
{id:26,type:'tf',subject:'Direito Previdenciário',topic:'Legislação especial',sub:'Natureza dos benefícios',difficulty:'Difícil',text:'Os benefícios de legislação especial cobrados no âmbito previdenciário são todos benefícios do RGPS, sujeitos obrigatoriamente às mesmas regras de carência e custeio dos benefícios previdenciários comuns.',options:['Certo','Errado'],answer:1,explain:'Errado. Os benefícios de legislação especial possuem fundamentos legais específicos e, em vários casos, natureza indenizatória ou assistencial, não se confundindo automaticamente com benefícios comuns do RGPS.'},
{"id":1051,"type":"tf","subject":"Direito Previdenciário","topic":"Seguridade Social","sub":"Princípios e organização","difficulty":"Difícil","text":"A seguridade social é organizada mediante gestão quadripartite, com participação dos trabalhadores, dos empregadores, dos aposentados e do governo nos órgãos colegiados.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2016 — Técnico do Seguro Social — Caderno SUPER","examItem":51,"explain":"Gabarito oficial definitivo: CERTO.","year":2016,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 51"},{"id":1052,"type":"tf","subject":"Direito Previdenciário","topic":"Seguridade Social","sub":"Princípios e organização","difficulty":"Difícil","text":"A Lei Eloy Chaves, que criou em cada uma das empresas de estradas de ferro existentes no país uma caixa de aposentadoria e pensões para os respectivos empregados, foi o primeiro ato normativo a tratar de seguridade social no Brasil.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2016 — Técnico do Seguro Social — Caderno SUPER","examItem":52,"explain":"Gabarito oficial definitivo: ERRADO.","year":2016,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 52"},{"id":1053,"type":"tf","subject":"Direito Previdenciário","topic":"Seguridade Social","sub":"Princípios e organização","difficulty":"Difícil","text":"Na década de 30 do século passado, as caixas de aposentadoria e pensões foram reunidas nos institutos de aposentadoria e pensão, organizados pelo Estado como autarquias federais. Em 1966, esses institutos foram transformados no INPS.","options":["Certo","Errado"],"answer":0,"annulled":true,"source":"INSS 2016 — Técnico do Seguro Social — Caderno SUPER","examItem":53,"explain":"Gabarito oficial definitivo: ANULADA.","year":2016,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 53"},{"id":1054,"type":"tf","subject":"Direito Previdenciário","topic":"Seguridade Social","sub":"Princípios e organização","difficulty":"Difícil","text":"A CF define seguridade social como um conjunto integrado de ações de iniciativa dos poderes públicos e da sociedade destinadas a assegurar direitos relativos à saúde, à previdência e à assistência social.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2016 — Técnico do Seguro Social — Caderno SUPER","examItem":54,"explain":"Gabarito oficial definitivo: CERTO.","year":2016,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 54"},{"id":1055,"type":"tf","subject":"Direito Previdenciário","topic":"Seguridade Social","sub":"Princípios e organização","difficulty":"Difícil","text":"De acordo com o princípio da universalidade da seguridade social, os estrangeiros no Brasil poderão receber atendimento da seguridade social.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2016 — Técnico do Seguro Social — Caderno SUPER","examItem":55,"explain":"Gabarito oficial definitivo: CERTO.","year":2016,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 55"},{"id":1056,"type":"tf","subject":"Direito Previdenciário","topic":"Legislação Previdenciária","sub":"Integração e interpretação","difficulty":"Difícil","text":"Lei complementar editada pela União poderá autorizar os estados e o DF a legislar sobre questões específicas relacionadas à seguridade social.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2016 — Técnico do Seguro Social — Caderno SUPER","examItem":56,"explain":"Gabarito oficial definitivo: CERTO.","year":2016,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 56"},{"id":1057,"type":"tf","subject":"Direito Previdenciário","topic":"RGPS","sub":"Segurados","difficulty":"Difícil","text":"Situação hipotética : Pedro trabalha como professor remunerado de uma escola particular e, concomitantemente, explora atividade econômica agropecuária em regime de economia familiar em uma chácara de dois módulos fiscais. Assertiva: Nessa situação, Pedro é segurado obrigatório do RGPS em relação a cada uma das atividades realizadas.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2016 — Técnico do Seguro Social — Caderno SUPER","examItem":57,"explain":"Gabarito oficial definitivo: ERRADO.","year":2016,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 57"},{"id":1058,"type":"tf","subject":"Direito Previdenciário","topic":"RGPS","sub":"Segurados","difficulty":"Difícil","text":"Brasileiro contratado pela Organização das Nações Unidas, da qual o Brasil faz parte como membro efetivo, é considerado segurado obrigatório do RGPS, mesmo que domiciliado e contratado no exterior, salvo se estiver coberto por regime próprio de previdência social.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2016 — Técnico do Seguro Social — Caderno SUPER","examItem":58,"explain":"Gabarito oficial definitivo: CERTO.","year":2016,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 58"},{"id":1059,"type":"tf","subject":"Direito Previdenciário","topic":"RGPS","sub":"Segurados","difficulty":"Difícil","text":"Pastor evangélico que atue exclusivamente em sua atividade religiosa é considerado segurado facultativo do RGPS.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2016 — Técnico do Seguro Social — Caderno SUPER","examItem":59,"explain":"Gabarito oficial definitivo: ERRADO.","year":2016,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 59"},{"id":1060,"type":"tf","subject":"Direito Previdenciário","topic":"RGPS","sub":"Segurados","difficulty":"Difícil","text":"É considerado segurado obrigatório do RGPS na qualidade de contribuinte individual o associado eleito para cargo de direção em cooperativa, associação ou entidade de qualquer natureza, mesmo que não receba remuneração.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2016 — Técnico do Seguro Social — Caderno SUPER","examItem":60,"explain":"Gabarito oficial definitivo: ERRADO.","year":2016,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 60"},{"id":1061,"type":"tf","subject":"Direito Previdenciário","topic":"RGPS","sub":"Segurados","difficulty":"Difícil","text":"Síndica do condomínio predial em que resida e que receba como pró-labore a quantia equivalente a um salário mínimo será considerada segurada obrigatória do RGPS na qualidade de empregada.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2016 — Técnico do Seguro Social — Caderno SUPER","examItem":61,"explain":"Gabarito oficial definitivo: ERRADO.","year":2016,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 61"},{"id":1062,"type":"tf","subject":"Direito Previdenciário","topic":"RGPS","sub":"Segurados","difficulty":"Difícil","text":"O pescador que exerça essa atividade como principal meio de vida é considerado segurado especial mesmo que tenha empregados permanentes.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2016 — Técnico do Seguro Social — Caderno SUPER","examItem":62,"explain":"Gabarito oficial definitivo: ERRADO.","year":2016,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 62"},{"id":1063,"type":"tf","subject":"Direito Previdenciário","topic":"RGPS","sub":"Segurado especial e facultativo","difficulty":"Difícil","text":"Situação hipotética: Maria, com vinte e dois anos de idade, recebe bolsa de estudos para se dedicar em tempo integral a trabalho de pesquisa, não possuindo qualquer vinculação a regime de previdência. Assertiva: Nessa situação, Maria poderá filiar-se facultativamente ao RGPS.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2016 — Técnico do Seguro Social — Caderno SUPER","examItem":63,"explain":"Gabarito oficial definitivo: CERTO.","year":2016,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 63"},{"id":1064,"type":"tf","subject":"Direito Previdenciário","topic":"RGPS","sub":"Segurado especial e facultativo","difficulty":"Difícil","text":"O recebimento de dinheiro decorrente de programa assistencial oficial do governo federal descaracteriza a condição de segurado especial.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2016 — Técnico do Seguro Social — Caderno SUPER","examItem":64,"explain":"Gabarito oficial definitivo: ERRADO.","year":2016,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 64"},{"id":1065,"type":"tf","subject":"Direito Previdenciário","topic":"RGPS","sub":"Filiação e inscrição","difficulty":"Difícil","text":"A filiação do segurado obrigatório ao RGPS decorre automaticamente do exercício da atividade remunerada.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2016 — Técnico do Seguro Social — Caderno SUPER","examItem":65,"explain":"Gabarito oficial definitivo: CERTO.","year":2016,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 65"},{"id":1066,"type":"tf","subject":"Direito Previdenciário","topic":"RGPS","sub":"Filiação e inscrição","difficulty":"Difícil","text":"Desde que presentes os demais pressupostos da filiação, admite-se a inscrição post mortem do segurado especial.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2016 — Técnico do Seguro Social — Caderno SUPER","examItem":66,"explain":"Gabarito oficial definitivo: CERTO.","year":2016,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 66"},{"id":1067,"type":"tf","subject":"Direito Previdenciário","topic":"RGPS","sub":"Filiação e inscrição","difficulty":"Difícil","text":"A filiação ao RGPS na qualidade de segurado facultativo pode retroagir, permitindo-se o recolhimento das contribuições relativas a competências anteriores à data da inscrição.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2016 — Técnico do Seguro Social — Caderno SUPER","examItem":67,"explain":"Gabarito oficial definitivo: ERRADO.","year":2016,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 67"},{"id":1068,"type":"tf","subject":"Direito Previdenciário","topic":"RGPS","sub":"Filiação e inscrição","difficulty":"Difícil","text":"Os dados constantes dos cadastros informatizados da previdência social, como o Cadastro Nacional de Informações Sociais (CNIS), valem como prova da filiação à previdência social, do tempo de contribuição e dos salários-de-contribuição, desde que acompanhados de outras provas documentais.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2016 — Técnico do Seguro Social — Caderno SUPER","examItem":68,"explain":"Gabarito oficial definitivo: ERRADO.","year":2016,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 68"},{"id":1069,"type":"tf","subject":"Direito Previdenciário","topic":"RGPS","sub":"Servidor em cargo em comissão","difficulty":"Difícil","text":"O indivíduo que, não sendo detentor de cargo efetivo, for nomeado para um cargo em comissão no âmbito da União não será segurado obrigatório do RGPS.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2016 — Técnico do Seguro Social — Caderno SUPER","examItem":69,"explain":"Gabarito oficial definitivo: ERRADO.","year":2016,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 69"},{"id":1070,"type":"tf","subject":"Direito Previdenciário","topic":"RGPS","sub":"Empregador e empresa","difficulty":"Difícil","text":"Situação hipotética: João exerce atividade econômica com finalidade lucrativa na sua própria residência. Recentemente, ele contratou Maria para fazer a limpeza de sua residência, de forma habitual e remunerada, e, inclusive, atender clientes. Assertiva: Nessa situação, João será considerado empregador doméstico com relação aos serviços prestados por Maria.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2016 — Técnico do Seguro Social — Caderno SUPER","examItem":70,"explain":"Gabarito oficial definitivo: ERRADO.","year":2016,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 70"},{"id":1071,"type":"tf","subject":"Direito Previdenciário","topic":"RGPS","sub":"Empregador e empresa","difficulty":"Difícil","text":"Equiparar-se-á a empresa, para os fins do RGPS, a pessoa física que, para fazer uma reforma na própria casa, contratar um mestre de obras e um ajudante.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2016 — Técnico do Seguro Social — Caderno SUPER","examItem":71,"explain":"Gabarito oficial definitivo: CERTO.","year":2016,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 71"},{"id":1072,"type":"tf","subject":"Direito Previdenciário","topic":"Financiamento da Seguridade Social","sub":"Fontes de custeio","difficulty":"Difícil","text":"Em caso de eventuais insuficiências financeiras decorrentes do pagamento de benefícios de prestação continuada, a previdência social poderá elevar alíquotas das contribuições sociais de empregados e empregadores até o limite do débito apurado.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2016 — Técnico do Seguro Social — Caderno SUPER","examItem":72,"explain":"Gabarito oficial definitivo: ERRADO.","year":2016,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 72"},{"id":1073,"type":"tf","subject":"Direito Previdenciário","topic":"Financiamento da Seguridade Social","sub":"Fontes de custeio","difficulty":"Difícil","text":"Além da contribuição proveniente de empregados e empregadores, são fontes de custeio da seguridade social, de forma direta e indireta, os recursos oriundos dos orçamentos da União, dos estados, do DF e dos municípios.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2016 — Técnico do Seguro Social — Caderno SUPER","examItem":73,"explain":"Gabarito oficial definitivo: CERTO.","year":2016,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 73"},{"id":1074,"type":"tf","subject":"Direito Previdenciário","topic":"Financiamento da Seguridade Social","sub":"Contribuições dos segurados","difficulty":"Difícil","text":"A alíquota de contribuição, para custeio da seguridade social, dos segurados facultativos e dos segurados empregados é a mesma e varia segundo o salário-de-contribuição.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2016 — Técnico do Seguro Social — Caderno SUPER","examItem":74,"explain":"Gabarito oficial definitivo: ERRADO.","year":2016,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 74"},{"id":1075,"type":"tf","subject":"Direito Previdenciário","topic":"Financiamento da Seguridade Social","sub":"Contribuições dos segurados","difficulty":"Difícil","text":"A alíquota de contribuição do empregado doméstico para o custeio da seguridade social é inferior à alíquota aplicável aos demais empregados.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2016 — Técnico do Seguro Social — Caderno SUPER","examItem":75,"explain":"Gabarito oficial definitivo: ERRADO.","year":2016,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 75"},{"id":1076,"type":"tf","subject":"Direito Previdenciário","topic":"Financiamento da Seguridade Social","sub":"Contribuições de empresas e empregador doméstico","difficulty":"Difícil","text":"A contribuição do empregador doméstico é de 20% e incide sobre o salário mínimo.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2016 — Técnico do Seguro Social — Caderno SUPER","examItem":76,"explain":"Gabarito oficial definitivo: ERRADO.","year":2016,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 76"},{"id":1077,"type":"tf","subject":"Direito Previdenciário","topic":"Financiamento da Seguridade Social","sub":"Contribuições de empresas e empregador doméstico","difficulty":"Difícil","text":"A contribuição empresarial de associação desportiva que mantenha equipe de futebol profissional distingue-se da contribuição exigida de outras empresas.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2016 — Técnico do Seguro Social — Caderno SUPER","examItem":77,"explain":"Gabarito oficial definitivo: CERTO.","year":2016,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 77"},{"id":1078,"type":"tf","subject":"Direito Previdenciário","topic":"Financiamento da Seguridade Social","sub":"Custeio","difficulty":"Difícil","text":"Constitui fonte de receita da seguridade social um percentual incidente sobre os valores arrecadados com os resultados dos leilões de bens apreendidos pela Receita Federal do Brasil.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2016 — Técnico do Seguro Social — Caderno SUPER","examItem":78,"explain":"Gabarito oficial definitivo: CERTO.","year":2016,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 78"},{"id":1079,"type":"tf","subject":"Direito Previdenciário","topic":"Financiamento da Seguridade Social","sub":"Custeio","difficulty":"Difícil","text":"Para efeito de custeio dos benefícios da aposentadoria especial e dos concedidos em razão do grau de incidência de incapacidade laborativa decorrente dos riscos ambientais do trabalho, as alíquotas aplicadas incidem exclusivamente sobre a remuneração do segurado sujeito a condições especiais que lhe prejudiquem a saúde ou a integridade física.","options":["Certo","Errado"],"answer":0,"annulled":true,"source":"INSS 2016 — Técnico do Seguro Social — Caderno SUPER","examItem":79,"explain":"Gabarito oficial definitivo: ANULADA.","year":2016,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 79"},{"id":1080,"type":"tf","subject":"Direito Previdenciário","topic":"Financiamento da Seguridade Social","sub":"Custeio","difficulty":"Difícil","text":"Parte dos valores arrecadados com concurso de prognósticos promovidos por órgãos do poder público ou por sociedades comerciais ou civis dentro do território nacional é destinada ao custeio da seguridade social.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2016 — Técnico do Seguro Social — Caderno SUPER","examItem":80,"explain":"Gabarito oficial definitivo: CERTO.","year":2016,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 80"},{"id":1081,"type":"tf","subject":"Direito Previdenciário","topic":"Financiamento da Seguridade Social","sub":"Salário de contribuição","difficulty":"Difícil","text":"Bruna, empregada da empresa Vargas & Vargas Cia. Ltda., entrou em gozo de licença-maternidade. Nessa situação, haverá incidência da contribuição previdenciária sobre o valor recebido por Bruna a título de salário-maternidade.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2016 — Técnico do Seguro Social — Caderno SUPER","examItem":81,"explain":"Gabarito oficial definitivo: CERTO.","year":2016,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 81"},{"id":1082,"type":"tf","subject":"Direito Previdenciário","topic":"Financiamento da Seguridade Social","sub":"Salário de contribuição","difficulty":"Difícil","text":"Gustavo inscreveu-se na previdência social na condição de segurado facultativo. Nessa situação, o salário-de-contribuição de Gustavo deverá variar entre um salário mínimo e o teto máximo fixado em portaria interministerial.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2016 — Técnico do Seguro Social — Caderno SUPER","examItem":82,"explain":"Gabarito oficial definitivo: CERTO.","year":2016,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 82"},{"id":1083,"type":"tf","subject":"Direito Previdenciário","topic":"Financiamento da Seguridade Social","sub":"Salário de contribuição","difficulty":"Difícil","text":"Zilda mantém vínculo empregatício com a empresa Y e com a empresa Z, das quais recebe remuneração mensal equivalente a dois e três salários mínimos, respectivamente. Nessa situação, a contribuição previdenciária de Zilda deverá incidir sobre os valores recebidos de ambos os empregos.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2016 — Técnico do Seguro Social — Caderno SUPER","examItem":83,"explain":"Gabarito oficial definitivo: CERTO.","year":2016,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 83"},{"id":1084,"type":"tf","subject":"Direito Previdenciário","topic":"Financiamento da Seguridade Social","sub":"Salário de contribuição","difficulty":"Difícil","text":"O contrato de trabalho de Carlos, empregado da empresa L & M Ltda., foi rescindido antes que ele pudesse usufruir de férias vencidas. Nessa situação, haverá a incidência de contribuição previdenciária sobre a importância paga a título de indenização das férias vencidas e sobre o respectivo adicional constitucional.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2016 — Técnico do Seguro Social — Caderno SUPER","examItem":84,"explain":"Gabarito oficial definitivo: ERRADO.","year":2016,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 84"},{"id":1085,"type":"tf","subject":"Direito Previdenciário","topic":"Financiamento da Seguridade Social","sub":"Arrecadação e recolhimento","difficulty":"Difícil","text":"As empresas são obrigadas a arrecadar a contribuição do segurado contribuinte individual a seu serviço, descontando-a da respectiva remuneração.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2016 — Técnico do Seguro Social — Caderno SUPER","examItem":85,"explain":"Gabarito oficial definitivo: CERTO.","year":2016,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 85"},{"id":1086,"type":"tf","subject":"Direito Previdenciário","topic":"Financiamento da Seguridade Social","sub":"Arrecadação e recolhimento","difficulty":"Difícil","text":"A isenção de contribuição previdenciária concedida às pessoas jurídicas de direito privado estende-se aos seus empregados e aos trabalhadores avulsos a seu serviço.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2016 — Técnico do Seguro Social — Caderno SUPER","examItem":86,"explain":"Gabarito oficial definitivo: ERRADO.","year":2016,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 86"},{"id":1087,"type":"tf","subject":"Direito Previdenciário","topic":"Financiamento da Seguridade Social","sub":"Arrecadação e recolhimento","difficulty":"Difícil","text":"Compete à Receita Federal do Brasil arr ecadar e fiscalizar o recolhimento das contribuições sociais previstas na CF.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2016 — Técnico do Seguro Social — Caderno SUPER","examItem":87,"explain":"Gabarito oficial definitivo: CERTO.","year":2016,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 87"},{"id":1088,"type":"tf","subject":"Direito Previdenciário","topic":"Financiamento da Seguridade Social","sub":"Recolhimento em atraso","difficulty":"Difícil","text":"As contribuições devidas à seguridade social já descontadas dos segurados empregados e não recolhidas até seu vencimento poderão ser objeto de acordo para pagamento parcelado.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2016 — Técnico do Seguro Social — Caderno SUPER","examItem":88,"explain":"Gabarito oficial definitivo: ERRADO.","year":2016,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 88"},{"id":1089,"type":"tf","subject":"Direito Previdenciário","topic":"Financiamento da Seguridade Social","sub":"Recolhimento em atraso","difficulty":"Difícil","text":"As contribuições sociais incluídas ou não em notificação fiscal de lançamento ou inscritas em dívida ativa que forem pagas com atraso estarão sujeitas a atualização monetária, juros de mora e multa, a qual varia entre 8% e 20% sobre o crédito devido. Maria, proprietária de uma sorveteria situada em uma cidade litorânea, adquiriu, de forma financiada, dois novos freezers para seu estabelecimento comercial. Em razão do período de baixa temporada, ocorreu considerável queda nas vendas da sorveteria, e o seu faturamento tornou-se insuficiente para arcar com todas as despesas. Diante dessa situação e visando honrar com o pagamento das prestações dos freezers, Maria deixou de repassar à previdência social as contribuições previdenciárias recolhidas dos cinco funcionários do estabelecimento, no prazo e na forma legal, tendo incorrido em crime contra seguridade social.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2016 — Técnico do Seguro Social — Caderno SUPER","examItem":89,"explain":"Gabarito oficial definitivo: ERRADO.","year":2016,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 89"},{"id":1090,"type":"tf","subject":"Direito Previdenciário","topic":"Crimes Previdenciários","sub":"Crimes contra a Seguridade Social","difficulty":"Difícil","text":"Iniciada ação fiscal em desfavor de Maria, o juiz responsável pelo processo não poderá deixar de aplicar pena, ainda que Maria efetue os pagamentos devidos, seja ré primária e goze de bons antecedentes.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2016 — Técnico do Seguro Social — Caderno SUPER","examItem":90,"explain":"Gabarito oficial definitivo: ERRADO.","year":2016,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 90"},{"id":1091,"type":"tf","subject":"Direito Previdenciário","topic":"Crimes Previdenciários","sub":"Crimes contra a Seguridade Social","difficulty":"Difícil","text":"A conduta de Maria configura crime de apropriação indébita previdenciária, para o qual a pena prevista é reclusão e multa. Mateus requereu ao órgão regional do INSS a conversão de auxílio-doença em aposentadoria por invalidez. O INSS indeferiu o pedido de Mateus por considerar que a doença que o acometera era curável, e que, por isso, ele era suscetível de reabilitação.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2016 — Técnico do Seguro Social — Caderno SUPER","examItem":91,"explain":"Gabarito oficial definitivo: CERTO.","year":2016,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 91"},{"id":1092,"type":"tf","subject":"Direito Previdenciário","topic":"Processo Administrativo Previdenciário","sub":"Recursos","difficulty":"Difícil","text":"Caso seja interposto recurso contra a decisão que indeferiu o pedido de Mateus, o órgão regional do INSS que proferiu a decisão não poderá reformá-la, devendo encaminhar o recurso à instância competente.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2016 — Técnico do Seguro Social — Caderno SUPER","examItem":92,"explain":"Gabarito oficial definitivo: ERRADO.","year":2016,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 92"},{"id":1093,"type":"tf","subject":"Direito Previdenciário","topic":"Processo Administrativo Previdenciário","sub":"Recursos","difficulty":"Difícil","text":"Contra a decisão do INSS pelo indeferimento, Mateus poderá interpor recurso administrativo, que será julgado, em primeira instância, pela Câmara de Julgamento da Previdência Social.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2016 — Técnico do Seguro Social — Caderno SUPER","examItem":93,"explain":"Gabarito oficial definitivo: ERRADO.","year":2016,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 93"},{"id":1094,"type":"tf","subject":"Direito Previdenciário","topic":"Decadência e Prescrição","sub":"Benefícios e contribuições","difficulty":"Difícil","text":"Dagoberto obteve aposentadoria por tempo de contribuição concedida pelo INSS em junho de 2012. Entretanto, o INSS não efetuou o pagamento do abono anual proporcional do ano de 2012 nem o do ano de 2013. Nessa situação, atualmente, Dagoberto não mais tem direito a exigir o pagamento dos abonos anuais referentes aos anos de 2012 e 2013, visto que está prescrito o direito ao percebimento das referidas prestações.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2016 — Técnico do Seguro Social — Caderno SUPER","examItem":94,"explain":"Gabarito oficial definitivo: ERRADO.","year":2016,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 94"},{"id":1095,"type":"tf","subject":"Direito Previdenciário","topic":"Decadência e Prescrição","sub":"Benefícios e contribuições","difficulty":"Difícil","text":"Ronaldo, segurado contribuinte individual da previdência social, optou pela contribuição de alíquota reduzida, de 11%, que exclui o direito ao benefício de aposentadoria por tempo de contribuição. Nessa situação, caso pretenda obter aposentadoria por tempo de contribuição, Ronaldo poderá fazer a complementação da diferença entre o percentual pago e o percentual devido, acrescida de juros moratórios.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2016 — Técnico do Seguro Social — Caderno SUPER","examItem":95,"explain":"Gabarito oficial definitivo: CERTO.","year":2016,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 95"},{"id":1096,"type":"tf","subject":"Direito Previdenciário","topic":"LOAS/BPC","sub":"Benefício de prestação continuada","difficulty":"Difícil","text":"Um dos critérios para o idoso habilitar-se à concessão do BPC é não possuir outro benefício da seguridade social, excetuados o de assistência médica e a pensão especial de natureza indenizatória.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2016 — Técnico do Seguro Social — Caderno SUPER","examItem":96,"explain":"Gabarito oficial definitivo: CERTO.","year":2016,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 96"},{"id":1097,"type":"tf","subject":"Direito Previdenciário","topic":"LOAS/BPC","sub":"Benefício de prestação continuada","difficulty":"Difícil","text":"O valor a ser pago ao beneficiário do BPC é de um salário mínimo mensal.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2016 — Técnico do Seguro Social — Caderno SUPER","examItem":97,"explain":"Gabarito oficial definitivo: CERTO.","year":2016,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 97"},{"id":1098,"type":"tf","subject":"Direito Previdenciário","topic":"LOAS/BPC","sub":"Benefício de prestação continuada","difficulty":"Difícil","text":"É permitido ao beneficiário do BPC acumular o recebimento desse benefício com o do seguro-desemprego.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2016 — Técnico do Seguro Social — Caderno SUPER","examItem":98,"explain":"Gabarito oficial definitivo: ERRADO.","year":2016,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 98"},{"id":1099,"type":"tf","subject":"Direito Previdenciário","topic":"LOAS/BPC","sub":"Benefício de prestação continuada","difficulty":"Difícil","text":"O BPC do idoso que se encontre na condição de acolhimento de longa permanência em hospital será suspenso até a data da sua alta.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2016 — Técnico do Seguro Social — Caderno SUPER","examItem":99,"explain":"Gabarito oficial definitivo: ERRADO.","year":2016,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 99"},{"id":1100,"type":"tf","subject":"Direito Previdenciário","topic":"LOAS/BPC","sub":"Benefício de prestação continuada","difficulty":"Difícil","text":"A idade mínima para que um indivíduo passe a ter direito ao BPC do idoso é de sessenta anos.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2016 — Técnico do Seguro Social — Caderno SUPER","examItem":100,"explain":"Gabarito oficial definitivo: ERRADO.","year":2016,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 100"},{"id":1101,"type":"tf","subject":"Direito Previdenciário","topic":"LOAS/BPC","sub":"Benefício de prestação continuada","difficulty":"Difícil","text":"No caso de morte do beneficiário do BPC, seus familiares são obrigados a informar tal fato ao INSS, situação em que o pagamento do benefício cessará.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2016 — Técnico do Seguro Social — Caderno SUPER","examItem":101,"explain":"Gabarito oficial definitivo: CERTO.","year":2016,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 101"},{"id":1102,"type":"tf","subject":"Direito Previdenciário","topic":"LOAS","sub":"Organização da Assistência Social","difficulty":"Difícil","text":"O centro de referência de assistência social (CRAS) é uma unidade de base estadual e tem por finalidade atender a população de baixa renda e as pessoas que estejam submetidas ao cumprimento de pena de reclusão.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2016 — Técnico do Seguro Social — Caderno SUPER","examItem":102,"explain":"Gabarito oficial definitivo: ERRADO.","year":2016,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 102"},{"id":1103,"type":"tf","subject":"Direito Previdenciário","topic":"LOAS","sub":"Organização da Assistência Social","difficulty":"Difícil","text":"O centro de referência especializado de assistência social (CREAS) constitui unidade que presta serviços a indivíduos e famílias que se encontrem em situação de risco pessoal ou social decorrente de violação de direitos.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2016 — Técnico do Seguro Social — Caderno SUPER","examItem":103,"explain":"Gabarito oficial definitivo: CERTO.","year":2016,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 103"},{"id":1104,"type":"tf","subject":"Direito Previdenciário","topic":"LOAS","sub":"Organização da Assistência Social","difficulty":"Difícil","text":"A política de assistência social tem como objetivos, entre outros, a promoção da integração do cidadão ao mercado de trabalho e o amparo às crianças e aos adolescentes carentes.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2016 — Técnico do Seguro Social — Caderno SUPER","examItem":104,"explain":"Gabarito oficial definitivo: CERTO.","year":2016,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 104"},{"id":1105,"type":"tf","subject":"Direito Previdenciário","topic":"LOAS","sub":"Organização da Assistência Social","difficulty":"Difícil","text":"A assistência social organiza-se por meio de um conjunto de serviços e programas que são estratificados em ações de proteção social básica, ações de proteção social secundária e ações de proteção social terciária, sendo essa última direcionada para pessoas em situação de violência.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2016 — Técnico do Seguro Social — Caderno SUPER","examItem":105,"explain":"Gabarito oficial definitivo: ERRADO.","year":2016,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 105"},{"id":1106,"type":"tf","subject":"Direito Previdenciário","topic":"LOAS","sub":"SUAS e CNAS","difficulty":"Difícil","text":"Situação hipotética: O CNAS, por decisão da maioria simples de seus membros, aprovou a pr oposição, ao Ministério do Planejamento, Orçamento e Gestão, de alteração dos limites de repasse mensal dos benefícios previstos em lei. Assertiva: Nessa situação, a aprovação da proposição ocorreu em conformidade com o que estabelece a Lei n.º 8.742/1993.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2016 — Técnico do Seguro Social — Caderno SUPER","examItem":106,"explain":"Gabarito oficial definitivo: ERRADO.","year":2016,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 106"},{"id":1107,"type":"tf","subject":"Direito Previdenciário","topic":"LOAS","sub":"SUAS e CNAS","difficulty":"Difícil","text":"Os conselhos estaduais de assistência social e os conselhos municipais de assistência social, instâncias deliberativas do SUAS, têm caráter permanente e composição paritária entre governo e sociedade civil.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2016 — Técnico do Seguro Social — Caderno SUPER","examItem":107,"explain":"Gabarito oficial definitivo: CERTO.","year":2016,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 107"},{"id":1108,"type":"tf","subject":"Direito Previdenciário","topic":"LOAS","sub":"SUAS e CNAS","difficulty":"Difícil","text":"O CNAS, instância responsável pela coordenação da PNAS, é presidido alternadamente pelo(a) ministro(a) da previdência social e por um representante eleito da sociedade civil, sendo de dois anos o mandato do seu presidente, permitida a recondução.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2016 — Técnico do Seguro Social — Caderno SUPER","examItem":108,"explain":"Gabarito oficial definitivo: ERRADO.","year":2016,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 108"},{"id":1109,"type":"tf","subject":"Direito Previdenciário","topic":"LOAS","sub":"SUAS e CNAS","difficulty":"Difícil","text":"O CNAS tem caráter paritário: metade dos seus membros são representantes governamentais e a outra metade é composta por representantes da sociedade civil.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2016 — Técnico do Seguro Social — Caderno SUPER","examItem":109,"explain":"Gabarito oficial definitivo: CERTO.","year":2016,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 109"},{"id":1110,"type":"tf","subject":"Direito Previdenciário","topic":"LOAS","sub":"SUAS e CNAS","difficulty":"Difícil","text":"Compete ao CNAS aprovar a PNAS, assim como convocar, ordinariamente, a cada quatro anos, a conferência nacional de assistência social, que terá a atribuição de avaliar a situação da assistência social e propor diretrizes para o aperfeiçoamento do sistema.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2016 — Técnico do Seguro Social — Caderno SUPER","examItem":110,"explain":"Gabarito oficial definitivo: CERTO.","year":2016,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 110"},{"id":1111,"type":"tf","subject":"Direito Previdenciário","topic":"RGPS","sub":"Benefícios e princípios","difficulty":"Difícil","text":"Não é considerada doença do trabalho a doença endêmica adquirida por segurado habitante de região em que ela se desenvolva, mesmo que essa doença seja resultante de contato direto determinado pela natureza do trabalho.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2016 — Técnico do Seguro Social — Caderno SUPER","examItem":111,"explain":"Gabarito oficial definitivo: ERRADO.","year":2016,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 111"},{"id":1112,"type":"tf","subject":"Direito Previdenciário","topic":"RGPS","sub":"Benefícios e princípios","difficulty":"Difícil","text":"Equipara-se ao acidente do trabalho o acidente sofrido pelo segurado, no local e no horário do trabalho, em consequência de desabamento, inundação, incêndio e outros casos fortuitos ou decorrentes de força maior.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2016 — Técnico do Seguro Social — Caderno SUPER","examItem":112,"explain":"Gabarito oficial definitivo: CERTO.","year":2016,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 112"},{"id":1113,"type":"tf","subject":"Direito Previdenciário","topic":"RGPS","sub":"Benefícios e princípios","difficulty":"Difícil","text":"Em regra, o período de carência para a concessão do benefício de auxílio-doença é de doze contribuições mensais.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2016 — Técnico do Seguro Social — Caderno SUPER","examItem":113,"explain":"Gabarito oficial definitivo: CERTO.","year":2016,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 113"},{"id":1114,"type":"tf","subject":"Direito Previdenciário","topic":"RGPS","sub":"Benefícios e princípios","difficulty":"Difícil","text":"Os princípios que regem a previdência social incluem a uniformidade e a equivalência dos benefícios e serviços prestados às populações urbanas e rurais.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2016 — Técnico do Seguro Social — Caderno SUPER","examItem":114,"explain":"Gabarito oficial definitivo: CERTO.","year":2016,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 114"},{"id":1115,"type":"tf","subject":"Direito Previdenciário","topic":"RGPS","sub":"Benefícios e princípios","difficulty":"Difícil","text":"Compõem o Conselho Nacional de Previdência Social representantes do governo federal e da sociedade civil, a qual é representada por aposentados e pensionistas, trabalhadores em atividade e empregadores. Com base no disposto no Decreto n.º 3.048/ 1999, que aprovou o regulamento da previdência social, julgue os itens subsecutivos.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2016 — Técnico do Seguro Social — Caderno SUPER","examItem":115,"explain":"Gabarito oficial definitivo: CERTO.","year":2016,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 115"},{"id":1116,"type":"tf","subject":"Direito Previdenciário","topic":"RGPS","sub":"Filiação e segurados","difficulty":"Difícil","text":"A dona de casa e o estudante podem filiar-se facultativamente ao RGPS mediante contribuição, desde que não estejam exercendo atividade remunerada que os enquadre como segurados obrigatórios da previdência social.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2016 — Técnico do Seguro Social — Caderno SUPER","examItem":116,"explain":"Gabarito oficial definitivo: CERTO.","year":2016,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 116"},{"id":1117,"type":"tf","subject":"Direito Previdenciário","topic":"RGPS","sub":"Filiação e segurados","difficulty":"Difícil","text":"A universalidade da cobertura e do atendimento inclui-se entre os princípios que regem as ações dos poderes públicos e da sociedade destinadas a assegurar o direito relativo à saúde, à previdência e à assistência social.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2016 — Técnico do Seguro Social — Caderno SUPER","examItem":117,"explain":"Gabarito oficial definitivo: CERTO.","year":2016,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 117"},{"id":1118,"type":"tf","subject":"Direito Previdenciário","topic":"RGPS","sub":"Filiação e segurados","difficulty":"Difícil","text":"Aquele que presta serviço de natureza contínua, mediante remuneração, a pessoa ou família, no âmbito residencial desta, em atividade sem fins lucrativos, é considerado contribuinte individual, segurado obrigatório da previdência social. Em fevereiro de 2016, Valdemar, que era empregado pelo regime celetista e recebia um salário mínimo de sua empregadora, foi demitido e, 30 dias depois, condenado à pena de prisão em regime fechado. Ele é casado com Idalina, com quem tem dois filhos menores. Considerando essa situação hipotética, julgue os itens que se seguem, com base nos regr amentos previdenciários acerca do auxílio-reclusão.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2016 — Técnico do Seguro Social — Caderno SUPER","examItem":118,"explain":"Gabarito oficial definitivo: ERRADO.","year":2016,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 118"},{"id":1119,"type":"tf","subject":"Direito Previdenciário","topic":"RGPS","sub":"Auxílio-reclusão","difficulty":"Difícil","text":"Como Valdemar é segurado de baixa renda da previdência social, ele e seus dependentes fazem jus ao recebimento do valor correspondente ao auxílio-reclusão, que é de um salário mínimo, a ser rateado entre eles.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2016 — Técnico do Seguro Social — Caderno SUPER","examItem":119,"explain":"Gabarito oficial definitivo: ERRADO.","year":2016,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 119"},{"id":1120,"type":"tf","subject":"Direito Previdenciário","topic":"RGPS","sub":"Auxílio-reclusão","difficulty":"Difícil","text":"Assim que terminar de cumprir a pena, Valdemar deixará de ser segurado da previdência social.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2016 — Técnico do Seguro Social — Caderno SUPER","examItem":120,"explain":"Gabarito oficial definitivo: ERRADO.","year":2016,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 120"},{"id":1251,"type":"tf","subject":"Direito Previdenciário","topic":"Legislação Previdenciária","sub":"Fontes e evolução histórica","difficulty":"Difícil","text":"A Constituição Federal é considerada uma fonte formal primária do direito previdenciário brasileiro.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2022 — Técnico do Seguro Social","examItem":51,"explain":"Gabarito oficial definitivo: CERTO.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 51"},{"id":1252,"type":"tf","subject":"Direito Previdenciário","topic":"Legislação Previdenciária","sub":"Fontes e evolução histórica","difficulty":"Difícil","text":"A Constituição outorgada por Getúlio Vargas em 1937, conhecida como Constituição Polaca, é considerada o marco do direito previdenciário brasileiro, pois foi ela que consolidou a legislação previdenciária no Brasil.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2022 — Técnico do Seguro Social","examItem":52,"explain":"Gabarito oficial definitivo: ERRADO.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 52"},{"id":1253,"type":"tf","subject":"Direito Previdenciário","topic":"Legislação Previdenciária","sub":"Fontes e evolução histórica","difficulty":"Difícil","text":"Os benefícios e serviços prestados pela seguridade social são exclusivos daqueles que participam do seu custeio.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2022 — Técnico do Seguro Social","examItem":53,"explain":"Gabarito oficial definitivo: ERRADO.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 53"},{"id":1254,"type":"tf","subject":"Direito Previdenciário","topic":"Seguridade Social","sub":"Princípios e interpretação","difficulty":"Difícil","text":"O princípio da seguridade social que estabelece que a contribuição social para o custeio do regime geral de previdência social deve ser proporcional à condição financeira dos seus contribuintes denomina-se equidade na forma de participação no custeio.","options":["Certo","Errado"],"answer":0,"annulled":true,"source":"INSS 2022 — Técnico do Seguro Social","examItem":54,"explain":"Gabarito oficial definitivo: ANULADA.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 54"},{"id":1255,"type":"tf","subject":"Direito Previdenciário","topic":"Seguridade Social","sub":"Princípios e interpretação","difficulty":"Difícil","text":"A assistência social integra a seguridade social, cujos programas são coordenados e executados pelas esferas estadual e municipal, com recursos do orçamento da seguridade social, bem como por entidades beneficentes e de assistência social.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2022 — Técnico do Seguro Social","examItem":55,"explain":"Gabarito oficial definitivo: ERRADO.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 55"},{"id":1256,"type":"tf","subject":"Direito Previdenciário","topic":"Seguridade Social","sub":"Princípios e interpretação","difficulty":"Difícil","text":"Caso haja lacuna na legislação, o intérprete poderá valer-se de analogia, costumes e princípios gerais do direito como instrumentos integrativos para resolver questões referentes a matéria previdenciária.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2022 — Técnico do Seguro Social","examItem":56,"explain":"Gabarito oficial definitivo: CERTO.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 56"},{"id":1257,"type":"tf","subject":"Direito Previdenciário","topic":"RGPS","sub":"Filiação e inscrição","difficulty":"Difícil","text":"O dependente do segurado do regime geral de previdência social (RGPS) pode, nessa condição, efetuar a sua inscrição junto ao INSS no momento em que este tiver de se habilitar ao recebimento do benefício a que faz jus.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2022 — Técnico do Seguro Social","examItem":57,"explain":"Gabarito oficial definitivo: ERRADO.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 57"},{"id":1258,"type":"tf","subject":"Direito Previdenciário","topic":"RGPS","sub":"Filiação e inscrição","difficulty":"Difícil","text":"Presentes os pressupostos da filiação, é admitida a inscrição post mortem  de segurado contribuinte individual e de segurado facultativo, mas não é admitida a inscrição post mortem de segurado especial.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2022 — Técnico do Seguro Social","examItem":58,"explain":"Gabarito oficial definitivo: ERRADO.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 58"},{"id":1259,"type":"tf","subject":"Direito Previdenciário","topic":"RGPS","sub":"Filiação e inscrição","difficulty":"Difícil","text":"Suponha que um estudante de quinze anos de idade pretenda se inscrever no regime geral de previdência social (RGPS) na condição de segurado facultativo. Nessa situação, a inscrição não será possível em decorrência da idade do estudante. No que se refere à aplicação da norma previdenciária, à seguridade social e ao empregador doméstico, julgue os próximos itens.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2022 — Técnico do Seguro Social","examItem":59,"explain":"Gabarito oficial definitivo: ERRADO.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 59"},{"id":1260,"type":"tf","subject":"Direito Previdenciário","topic":"Legislação Previdenciária","sub":"Aplicação da norma","difficulty":"Difícil","text":"Suponha que o Executivo federal tenha editado um decreto para regular matéria referente à criação de um novo benefício previdenciário e ao aumento da contribuição para arcar com o custeio do benefício criado. Nesse caso, tanto o segurado pode exigir a imediata concessão do benefício instituído quanto a previdência pode exigir o imediato pagamento da alíquota majorada.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2022 — Técnico do Seguro Social","examItem":60,"explain":"Gabarito oficial definitivo: CERTO.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 60"},{"id":1261,"type":"tf","subject":"Direito Previdenciário","topic":"RGPS","sub":"Segurado obrigatório","difficulty":"Difícil","text":"Suponha que um servidor público de carreira do Poder Judiciário de determinada unidade da Federação tenha sido nomeado para exercer um cargo em comissão junto a uma fundação pública federal, momento em que tenha optado por continuar recebendo remuneração do órgão em que exerça cargo efetivo. Nessa situação hipotética, em decorrência do cargo que passou a exercer na fundação pública, o referido servidor passa a integrar a condição de segurado obrigatório do RGPS.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2022 — Técnico do Seguro Social","examItem":61,"explain":"Gabarito oficial definitivo: CERTO.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 61"},{"id":1262,"type":"tf","subject":"Direito Previdenciário","topic":"RGPS","sub":"Empregador doméstico","difficulty":"Difícil","text":"Suponha que o proprietário de uma fazenda de produção de leite e gado de corte para o comércio local tenha contratado um indivíduo para exercer as funções de caseiro e gestor da fazenda. Nesse caso hipotético, para efeito previdenciário, o referido contratante é considerado empregador doméstico. A respeito do contribuinte individual, do segurado especial e do segurado facultativo, julgue os itens seguintes.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2022 — Técnico do Seguro Social","examItem":62,"explain":"Gabarito oficial definitivo: CERTO.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 62"},{"id":1263,"type":"tf","subject":"Direito Previdenciário","topic":"RGPS","sub":"Contribuinte individual, especial e facultativo","difficulty":"Difícil","text":"Suponha-se que, para complementar a renda familiar, Flávio, servidor público federal, exerça eventualmente atividade como motorista de aplicativo. Nessa situação hipotética, na condição de motorista de aplicativo, Flávio é considerado segurado obrigatório do RGPS.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2022 — Técnico do Seguro Social","examItem":63,"explain":"Gabarito oficial definitivo: CERTO.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 63"},{"id":1264,"type":"tf","subject":"Direito Previdenciário","topic":"RGPS","sub":"Contribuinte individual, especial e facultativo","difficulty":"Difícil","text":"Suponha-se que Pedro, após ter trabalhado como empregado contratado em determinada empresa privada por cerca de 20 anos, tenha deixado de exercer atividade remunerada e passado a se dedicar exclusivamente ao lar e a seus filhos, em razão de seu companheiro possuir renda para arcar com as despesas da família. Nesse caso hipotético, Pedro poderá manter o vínculo com o RGPS após o período de graça, desde que proceda à sua filiação na condição de segurado facultativo.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2022 — Técnico do Seguro Social","examItem":64,"explain":"Gabarito oficial definitivo: CERTO.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 64"},{"id":1265,"type":"tf","subject":"Direito Previdenciário","topic":"RGPS","sub":"Contribuinte individual, especial e facultativo","difficulty":"Difícil","text":"Suponha que Matilde, moradora no interior da Amazônia, utilizando-se de embarcação de pequeno porte, faça da pesca artesanal seu principal meio de vida. Nesse caso hipotético, para se filiar ao RGPS, Matilde poderá fazer a sua inscrição como segurada facultativa. A respeito do financiamento da seguridade social, julgue os itens subsequentes.","options":["Certo","Errado"],"answer":0,"annulled":true,"source":"INSS 2022 — Técnico do Seguro Social","examItem":65,"explain":"Gabarito oficial definitivo: ANULADA.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 65"},{"id":1266,"type":"tf","subject":"Direito Previdenciário","topic":"Financiamento da Seguridade Social","sub":"Financiamento e custeio","difficulty":"Difícil","text":"A licença-prêmio indenizada integra o salário de contribuição, nos termos da legislação.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2022 — Técnico do Seguro Social","examItem":66,"explain":"Gabarito oficial definitivo: ERRADO.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 66"},{"id":1267,"type":"tf","subject":"Direito Previdenciário","topic":"Financiamento da Seguridade Social","sub":"Financiamento e custeio","difficulty":"Difícil","text":"As igrejas e os templos de qualquer culto são isentos de contribuições para a seguridade social.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2022 — Técnico do Seguro Social","examItem":67,"explain":"Gabarito oficial definitivo: CERTO.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 67"},{"id":1268,"type":"tf","subject":"Direito Previdenciário","topic":"Financiamento da Seguridade Social","sub":"Financiamento e custeio","difficulty":"Difícil","text":"Os devedores da previdência social não podem receber benefícios ou incentivos fiscais ou creditícios do Estado.","options":["Certo","Errado"],"answer":0,"annulled":true,"source":"INSS 2022 — Técnico do Seguro Social","examItem":68,"explain":"Gabarito oficial definitivo: ANULADA.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 68"},{"id":1269,"type":"tf","subject":"Direito Previdenciário","topic":"Financiamento da Seguridade Social","sub":"Financiamento e custeio","difficulty":"Difícil","text":"Os contribuintes individual e facultativo podem optar pela alíquota de 11% incidente sobre o salário de contribuição caso renunciem ao direito à aposentadoria por tempo de contribuição.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2022 — Técnico do Seguro Social","examItem":69,"explain":"Gabarito oficial definitivo: ERRADO.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 69"},{"id":1270,"type":"tf","subject":"Direito Previdenciário","topic":"Financiamento da Seguridade Social","sub":"Financiamento e custeio","difficulty":"Difícil","text":"O percentual incidente sobre o resultado dos leilões dos bens apreendidos pelo Departamento da Receita Federal é fonte de receita da seguridade social, segundo a legislação.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2022 — Técnico do Seguro Social","examItem":70,"explain":"Gabarito oficial definitivo: CERTO.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 70"},{"id":1271,"type":"tf","subject":"Direito Previdenciário","topic":"Financiamento da Seguridade Social","sub":"Arrecadação, salário de contribuição e reajustamento","difficulty":"Difícil","text":"Os trabalhadores avulsos que prestam serviços a empresas e os contribuintes individual e facultativo devem recolher as contribuições à previdência social por conta própria.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2022 — Técnico do Seguro Social","examItem":71,"explain":"Gabarito oficial definitivo: CERTO.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 71"},{"id":1272,"type":"tf","subject":"Direito Previdenciário","topic":"Financiamento da Seguridade Social","sub":"Arrecadação, salário de contribuição e reajustamento","difficulty":"Difícil","text":"Compete ao INSS planejar, executar, acompanhar e avaliar as atividades relativas à tributação, à fiscalização, à arrecadação, à cobrança e ao recolhimento das contribuições previdenciárias.","options":["Certo","Errado"],"answer":0,"annulled":true,"source":"INSS 2022 — Técnico do Seguro Social","examItem":72,"explain":"Gabarito oficial definitivo: ANULADA.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 72"},{"id":1273,"type":"tf","subject":"Direito Previdenciário","topic":"Financiamento da Seguridade Social","sub":"Arrecadação, salário de contribuição e reajustamento","difficulty":"Difícil","text":"Os valores do salário de contribuição equivalem à renda mensal dos benefícios previdenciários.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2022 — Técnico do Seguro Social","examItem":73,"explain":"Gabarito oficial definitivo: ERRADO.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 73"},{"id":1274,"type":"tf","subject":"Direito Previdenciário","topic":"Financiamento da Seguridade Social","sub":"Arrecadação, salário de contribuição e reajustamento","difficulty":"Difícil","text":"Os valores do salário de contribuição e dos benefícios de prestação continuada da previdência social são reajustados na mesma época e nos mesmos índices.","options":["Certo","Errado"],"answer":0,"annulled":true,"source":"INSS 2022 — Técnico do Seguro Social","examItem":74,"explain":"Gabarito oficial definitivo: ANULADA.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 74"},{"id":1275,"type":"tf","subject":"Direito Previdenciário","topic":"Decadência e Prescrição","sub":"Benefícios e revisão","difficulty":"Difícil","text":"Paulo pode solicitar a revisão de sua aposentadoria até o dia 1.º de janeiro de 2026.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2022 — Técnico do Seguro Social","examItem":75,"explain":"Gabarito oficial definitivo: ERRADO.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 75"},{"id":1276,"type":"tf","subject":"Direito Previdenciário","topic":"Decadência e Prescrição","sub":"Benefícios e revisão","difficulty":"Difícil","text":"Jonas deve solicitar o benefício previdenciário em até cinco anos, contados da data em que ele foi acometido pela doença incapacitante.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2022 — Técnico do Seguro Social","examItem ain":"Gabarito oficial definitivo: ERRADO.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 79"},{"id":1280,"type":"tf","subject":"Direito Previdenciário","topic":"Crimes Previdenciários","sub":"Crimes contra a Seguridade Social","difficulty":"Difícil","text":"A empresa X praticou o delito de sonegação previdenciária.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2022 — Técnico do Seguro Social","examItem":80,"explain":"Gabarito oficial definitivo: ERRADO.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 80"},{"id":1281,"type":"tf","subject":"Direito Previdenciário","topic":"Crimes Previdenciários","sub":"Crimes contra a Seguridade Social","difficulty":"Difícil","text":"A empresa Y cometeu o delito de sonegação previdenciária.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2022 — Técnico do Seguro Social","examItem":81,"explain":"Gabarito oficial definitivo: CERTO.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 81"},{"id":1282,"type":"tf","subject":"Direito Previdenciário","topic":"Crimes Previdenciários","sub":"Crimes contra a Seguridade Social","difficulty":"Difícil","text":"A empresa Z tem direito à extinção da punibilidade, pelo pagamento da quantia anteriormente subtraída à previdência social.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2022 — Técnico do Seguro Social","examItem":82,"explain":"Gabarito oficial definitivo: CERTO.","year":2022,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — item 82"},{"id":1283,"type":"tf","subject":"Direito Previdenciário","topic":"Processo Administrativo Previdenciário","sub":"Recursos","difficulty":"Difícil","text":"Compete ao Conselho de Recursos da Previdência Social julgar os recursos de ofício interpostos contra decisões que tenham anulado lançamento de crédito previdenciário.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2022 — Técnico do Segu
