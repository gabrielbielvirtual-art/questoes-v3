{"id":2261,"type":"tf","subject":"Direito Previdenciário","topic":"Aposentadorias","sub":"Professor e contagem de tempo","difficulty":"Médio","text":"Consideram-se como tempo de contribuição para fins de aposentadoria os períodos desempenhados em entidade educacional de ensino básico em função de magistério como docentes, a qualquer título.","options":["Certo","Errado"],"answer":1,"explain":"ERRADO. Nem todo período em entidade educacional e em função de magistério, 'a qualquer título', atende aos requisitos legais para aposentadoria diferenciada. Fundamento: EC nº 103/2019 e regras do RGPS.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":61,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2262,"type":"tf","subject":"Direito Previdenciário","topic":"Aposentadorias","sub":"Professor e contagem de tempo","difficulty":"Médio","text":"É permitida a conversão de tempo de serviço de magistério na educação infantil, no ensino fundamental ou no ensino médio, exercido em qualquer época, em tempo de serviço comum. No que diz respeito à aposentadoria por idade dos trabalhadores rurais, julgue os próximos itens.","options":["Certo","Errado"],"answer":1,"explain":"ERRADO. A conversão de tempo de magistério em tempo comum possui limitações decorrentes das regras constitucionais e legais posteriores à EC 103/2019. Fundamento: EC nº 103/2019 e regras do RGPS.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":62,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2263,"type":"tf","subject":"Direito Previdenciário","topic":"Aposentadoria rural","sub":"Trabalhador rural e aposentadoria híbrida","difficulty":"Médio","text":"Para os segurados especiais que não contribuem facultativamente, a renda mensal inicial, relativa à aposentadoria por idade dos trabalhadores rurais, é de um salário mínimo.","options":["Certo","Errado"],"answer":0,"explain":"CERTO. Para segurado especial que não contribui facultativamente, a aposentadoria rural é, em regra, de um salário mínimo. Fundamento: Lei nº 8.213/1991, arts. 39, 48 e 55.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":63,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2264,"type":"tf","subject":"Direito Previdenciário","topic":"Aposentadoria rural","sub":"Trabalhador rural e aposentadoria híbrida","difficulty":"Médio","text":"A aposentadoria por idade das trabalhadoras rurais, desde que cumprida a carência exigida, é devida às seguradas que completarem 53 anos de idade.","options":["Certo","Errado"],"answer":1,"explain":"ERRADO. A idade mínima da trabalhadora rural é 55 anos, e não 53. Fundamento: Lei nº 8.213/1991, arts. 39, 48 e 55.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":64,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2265,"type":"tf","subject":"Direito Previdenciário","topic":"Aposentadoria rural","sub":"Trabalhador rural e aposentadoria híbrida","difficulty":"Médio","text":"São considerados trabalhadores rurais os produtores rurais, proprietários ou não, e os contribuintes individuais garimpeiros que não comprovem atividade em regime de economia familiar. Acerca da aposentadoria híbrida do trabalhador rural e das formas de comprovação de atividade rural, julgue os itens subsequentes.","options":["Certo","Errado"],"answer":1,"explain":"ERRADO. A definição de trabalhador rural não inclui, da forma ampla descrita, contribuinte individual garimpeiro sem comprovação de economia familiar. Fundamento: Lei nº 8.213/1991, arts. 39, 48 e 55.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":65,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2266,"type":"tf","subject":"Direito Previdenciário","topic":"Aposentadoria rural","sub":"Trabalhador rural e aposentadoria híbrida","difficulty":"Médio","text":"A comprovação do exercício de atividade rural pode ser feita, complementarmente à autodeclaração legal, mediante bloco de notas do produtor rural.","options":["Certo","Errado"],"answer":0,"explain":"CERTO. O bloco de produtor rural pode integrar a documentação complementar para comprovação da atividade rural. Fundamento: Lei nº 8.213/1991, arts. 39, 48 e 55.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":66,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2267,"type":"tf","subject":"Direito Previdenciário","topic":"Aposentadoria rural","sub":"Trabalhador rural e aposentadoria híbrida","difficulty":"Médio","text":"A aposentadoria híbrida é assim denominada porque ocorre a soma dos períodos de contribuição exercidos sob outras categorias que não de trabalhador rural.","options":["Certo","Errado"],"answer":1,"explain":"ERRADO. A aposentadoria híbrida resulta da soma de períodos rurais e urbanos, e não apenas de períodos de categorias não rurais. Fundamento: Lei nº 8.213/1991, arts. 39, 48 e 55.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":67,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2268,"type":"tf","subject":"Direito Previdenciário","topic":"Aposentadoria rural","sub":"Trabalhador rural e aposentadoria híbrida","difficulty":"Médio","text":"Para fazer jus à aposentadoria na modalidade híbrida, o trabalhador rural, se homem, deve ter completado 60 anos de idade e 20 anos de tempo de contribuição. Julgue os itens que se seguem no que se refere à aposentadoria especial e à Lei n.º 9.032/1995.","options":["Certo","Errado"],"answer":1,"explain":"ERRADO. Na aposentadoria híbrida, os requisitos de idade e tempo seguem a regra específica da modalidade; o item apresenta requisito de 20 anos de contribuição para homem que não corresponde à regra indicada. Fundamento: Lei nº 8.213/1991, arts. 39, 48 e 55.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":68,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2269,"type":"tf","subject":"Direito Previdenciário","topic":"Aposentadoria especial/PPP","sub":"Requisitos e direito adquirido","difficulty":"Médio","text":"A aposentadoria especial será devida, uma vez cumprida a carência exigida, ao segurado que tiver trabalhado sujeito a condições especiais que prejudiquem a saúde ou a integridade física durante 12 anos.","options":["Certo","Errado"],"answer":1,"explain":"ERRADO. A aposentadoria especial exige, conforme a atividade, 15, 20 ou 25 anos de exposição, e não 12 anos como regra geral. Fundamento: Lei nº 8.213/1991, arts. 57 e 58, e EC nº 103/2019.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":69,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2270,"type":"tf","subject":"Direito Previdenciário","topic":"Aposentadoria especial/PPP","sub":"Requisitos e direito adquirido","difficulty":"Médio","text":"Após a publicação da Lei n.º 9.032/1995, o titular de aposentadoria especial que retorne à atividade especial ou permaneça exercendo a mesma atividade, terá o seu benefício cessado.","options":["Certo","Errado"],"answer":0,"explain":"CERTO. O retorno à atividade especial após a aposentadoria especial produz os efeitos previstos no art. 57, § 8º, da Lei 8.213/1991. Fundamento: Lei nº 8.213/1991, arts. 57 e 58, e EC nº 103/2019.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":70,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2271,"type":"tf","subject":"Direito Previdenciário","topic":"Aposentadoria especial/PPP","sub":"Requisitos e direito adquirido","difficulty":"Médio","text":"O valor do benefício da aposentadoria especial, para direito adquirido até o dia 13 de novembro de 2019, é de 70% do salário de benefício.","options":["Certo","Errado"],"answer":1,"explain":"ERRADO. Para direito adquirido antes da EC 103/2019, a renda da aposentadoria especial segue a sistemática anterior, não 70% do salário de benefício. Fundamento: Lei nº 8.213/1991, arts. 57 e 58, e EC nº 103/2019.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":71,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2272,"type":"tf","subject":"Direito Previdenciário","topic":"Aposentadoria especial/PPP","sub":"Perfil profissiográfico previdenciário","difficulty":"Médio","text":"A partir do dia 1.º de janeiro de 2004, para caracterizar o exercício de atividade em condições especiais que prejudiquem a saúde, o segurado empregado ou o trabalhador avulso deve apresentar o PPP, conforme o modelo legal.","options":["Certo","Errado"],"answer":0,"explain":"CERTO. O PPP passou a ser documento central para comprovação da atividade especial a partir de 1º/1/2004. Fundamento: Lei nº 8.213/1991 e regulamentação do PPP.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":72,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2273,"type":"tf","subject":"Direito Previdenciário","topic":"Aposentadoria especial/PPP","sub":"Perfil profissiográfico previdenciário","difficulty":"Médio","text":"O PPP, cuja finalidade principal é a comprovação do exercício em atividade especial perante a Previdência Social, não pode ser usado como meios de prova junto aos sindicatos como forma de garantir o direito decorrente da relação de trabalho de modo coletivo.","options":["Certo","Errado"],"answer":1,"explain":"ERRADO. O PPP pode ser utilizado como documento de prova em outras finalidades relacionadas à relação de trabalho, conforme o caso. Fundamento: Lei nº 8.213/1991 e regulamentação do PPP.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":73,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2274,"type":"tf","subject":"Direito Previdenciário","topic":"Aposentadoria especial/PPP","sub":"Perfil profissiográfico previdenciário","difficulty":"Médio","text":"O PPP constitui-se em um documento histórico laboral do trabalhador que deve conter os dados administrativos da empresa e do trabalhador, os registros ambientais e os responsáveis pelas informações. Julgue os itens sequentes acerca da aposentadoria por tempo de contribuição e por idade do segurado com deficiência.","options":["Certo","Errado"],"answer":0,"explain":"CERTO. O PPP é histórico-laboral e reúne dados administrativos, registros ambientais e responsáveis pelas informações. Fundamento: Lei nº 8.213/1991 e regulamentação do PPP.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":74,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2275,"type":"tf","subject":"Direito Previdenciário","topic":"Aposentadoria da pessoa com deficiência","sub":"Aposentadoria da pessoa com deficiência","difficulty":"Médio","text":"A aposentadoria por tempo de contribuição do segurado com deficiência, cumprida a carência exigida, será devida ao segurado do Regime Geral de Previdência Social (RGPS) que tiver completado 15 anos, se mulher, de tempo de contribuição na condição de pessoa com deficiência grave.","options":["Certo","Errado"],"answer":1,"explain":"ERRADO. Para mulher com deficiência grave, a aposentadoria por tempo de contribuição exige 20 anos de contribuição nessa condição, e não 15. Fundamento: LC nº 142/2013 e legislação aplicável.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":75,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2276,"type":"tf","subject":"Direito Previdenciário","topic":"Aposentadoria da pessoa com deficiência","sub":"Aposentadoria da pessoa com deficiência","difficulty":"Médio","text":"Considera-se pessoa com deficiência aquela que tem impedimentos de longo prazo, restritos aos de natureza física, mental e intelectual, os quais, em interação com diversas barreiras, podem obstruir sua participação plena e efetiva na sociedade em igualdade de condições com as demais pessoas.","options":["Certo","Errado"],"answer":1,"explain":"ERRADO. A definição legal de pessoa com deficiência não se restringe a impedimentos físicos, mentais e intelectuais; inclui também impedimentos sensoriais. Fundamento: LC nº 142/2013 e legislação aplicável.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":76,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2277,"type":"tf","subject":"Direito Previdenciário","topic":"Aposentadoria da pessoa com deficiência","sub":"Aposentadoria da pessoa com deficiência","difficulty":"Médio","text":"À perícia médica federal e ao serviço social do INSS competem, para efeito de concessão da aposentadoria da pessoa com deficiência, reconhecer o grau de deficiência, bem como fixar a data provável do início da deficiência. No que diz respeito ao aproveitamento e à conversão de tempo de contribuição, à revisão e à manutenção da aposentadoria por tempo de contribuição e por idade do segurado com deficiência, julgue os próximos itens.","options":["Certo","Errado"],"answer":0,"explain":"CERTO. A avaliação do grau e do início da deficiência envolve perícia médica e avaliação social, conforme a legislação. Fundamento: LC nº 142/2013 e legislação aplicável.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":77,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2278,"type":"tf","subject":"Direito Previdenciário","topic":"Aposentadoria da pessoa com deficiência","sub":"Aposentadoria da pessoa com deficiência","difficulty":"Médio","text":"O pedido de revisão da avaliação médica e funcional é realizado tão só por iniciativa do INSS, aplicando-se o prazo decadencial, a contar do dia primeiro do mês seguinte ao do recebimento da primeira prestação do benefício.","options":["Certo","Errado"],"answer":1,"explain":"ERRADO. O pedido de revisão da avaliação não ocorre apenas por iniciativa do INSS; há possibilidade de iniciativa do segurado, observados os prazos. Fundamento: LC nº 142/2013 e legislação aplicável.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":78,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2279,"type":"tf","subject":"Direito Previdenciário","topic":"Aposentadoria da pessoa com deficiência","sub":"Aposentadoria da pessoa com deficiência","difficulty":"Médio","text":"É vedada a conversão do tempo de contribuição da pessoa com deficiência para fins de concessão da aposentadoria especial em condições que prejudiquem a saúde.","options":["Certo","Errado"],"answer":0,"explain":"CERTO. A conversão de tempo da pessoa com deficiência para aposentadoria especial é vedada nos termos legais. Fundamento: LC nº 142/2013 e legislação aplicável.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":79,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2280,"type":"tf","subject":"Direito Previdenciário","topic":"Aposentadoria da pessoa com deficiência","sub":"Aposentadoria da pessoa com deficiência","difficulty":"Médio","text":"O segurado aposentado pode permanecer na mesma atividade que exerce na condição de pessoa com deficiência ou desempenhar qualquer outra.","options":["Certo","Errado"],"answer":0,"explain":"CERTO. O aposentado da pessoa com deficiência pode continuar trabalhando, observadas as regras aplicáveis. Fundamento: LC nº 142/2013 e legislação aplicável.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":80,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2281,"type":"tf","subject":"Direito Previdenciário","topic":"Salário-maternidade","sub":"Requisitos e duração","difficulty":"Médio","text":"Maria e Joana, seguradas empregadas do RGPS, vivem em união estável e obtiveram a guarda judicial de uma criança de cinco ano de idade para efeito de adoção. Nesse caso, ambas as seguradas terão direito ao benefício do salário-maternidade.","options":["Certo","Errado"],"answer":1,"explain":"ERRADO. A guarda para adoção não confere automaticamente salário-maternidade às duas seguradas pelo mesmo fato; aplica-se a disciplina específica. Fundamento: Lei nº 8.213/1991, arts. 71 a 73, com alterações posteriores.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":81,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2282,"type":"tf","subject":"Direito Previdenciário","topic":"Salário-maternidade","sub":"Requisitos e duração","difficulty":"Médio","text":"Cláudia, segurada do RGPS em decorrência de contratos de trabalho com vínculos concomitantes mantidos na condição de empregada, deu à luz o seu filho João. Nesse caso, Cláudia terá direito ao benefício do salário-maternidade relativo a cada um dos empregos.","options":["Certo","Errado"],"answer":0,"explain":"CERTO. Nos vínculos concomitantes, o salário-maternidade pode ser devido em relação a cada emprego, observados os requisitos. Fundamento: Lei nº 8.213/1991, arts. 71 a 73, com alterações posteriores.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":82,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2283,"type":"tf","subject":"Direito Previdenciário","topic":"Salário-maternidade","sub":"Requisitos e duração","difficulty":"Médio","text":"A concessão do salário-maternidade para a segurada facultativa independe de carência.","options":["Certo","Errado"],"answer":0,"explain":"CERTO. Após a decisão do STF nas ADIs 2.110 e 2.111 e a regulamentação posterior, a carência do salário-maternidade deixou de ser exigida para todas as categorias. Fundamento: Lei nº 8.213/1991, arts. 71 a 73, com alterações posteriores.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":83,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2284,"type":"tf","subject":"Direito Previdenciário","topic":"Salário-maternidade","sub":"Requisitos e duração","difficulty":"Médio","text":"Em caso de adoção ou de aborto não criminoso, a segurada tem direito de receber o salário-maternidade pelo período de duas semanas.","options":["Certo","Errado"],"answer":0,"explain":"CERTO. A duração em caso de adoção não é de duas semanas; a regra é de 120 dias, enquanto o aborto não criminoso possui duração própria. Fundamento: Lei nº 8.213/1991, arts. 71 a 73, com alterações posteriores.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":84,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2285,"type":"tf","subject":"Direito Previdenciário","topic":"Salário-maternidade","sub":"Requisitos e duração","difficulty":"Médio","text":"O valor do salário-maternidade da segurada trabalhadora avulsa equivale à média aritmética simples das doze últimas contribuições mensais que antecedem a concessão do benefício. No que diz respeito ao benefício do salário-família concedido pelo Regime Geral de Previdência Social (RGPS), julgue os itens subsequentes.","options":["Certo","Errado"],"answer":1,"explain":"ERRADO. Para a segurada trabalhadora avulsa, o cálculo não é necessariamente a média simples das 12 últimas contribuições nos termos afirmados. Fundamento: Lei nº 8.213/1991, arts. 71 a 73, com alterações posteriores.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":85,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2286,"type":"tf","subject":"Direito Previdenciário","topic":"Salário-família","sub":"Beneficiários e pagamento","difficulty":"Médio","text":"Raimundo e Antônia são casados, ambos empregados domésticos onde recebem remuneração de um salário mínimo por mês cada um, e possuem três filhos em comuns, com três, cinco e nove anos respectivamente, e dois filhos apenas de Raimundo, que moram com o casal, de onze e treze anos. Nesse caso, ambos têm direito de receber o salário-família referente aos filhos comuns, e no caso de Antônia, também dos enteados.","options":["Certo","Errado"],"answer":1,"explain":"ERRADO. O salário-família é devido ao segurado que preencher os requisitos; enteados também podem ser considerados quando presentes as condições legais. Fundamento: Lei nº 8.213/1991, arts. 65 a 70.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":86,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2287,"type":"tf","subject":"Direito Previdenciário","topic":"Salário-família","sub":"Beneficiários e pagamento","difficulty":"Médio","text":"O salário-família devido ao segurado empregado é pago pelo seu empregador, e do segurado contribuinte individual é pago pelo INSS.","options":["Certo","Errado"],"answer":1,"explain":"ERRADO. O empregado recebe o salário-família pela empresa, enquanto o contribuinte individual não recebe simplesmente nas mesmas condições indicadas. Fundamento: Lei nº 8.213/1991, arts. 65 a 70.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":87,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2288,"type":"tf","subject":"Direito Previdenciário","topic":"Salário-família","sub":"Beneficiários e pagamento","difficulty":"Médio","text":"O segurado trabalhador avulso de baixa renda que tenha filho com idade inferior a quatorze anos ou inválido terá direito ao benefício do salário-família.","options":["Certo","Errado"],"answer":0,"explain":"CERTO. O trabalhador avulso de baixa renda pode ter direito ao salário-família para filho menor de 14 anos ou inválido, observados os requisitos. Fundamento: Lei nº 8.213/1991, arts. 65 a 70.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":88,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2289,"type":"tf","subject":"Direito Previdenciário","topic":"Salário-família","sub":"Beneficiários e pagamento","difficulty":"Médio","text":"No seu primeiro vínculo empregatício, João, pai de três filhos com idade de seis, oito e doze anos de idade, respectivamente, foi contratado para receber remuneração de um salário mínimo por mês. Nesse caso, a partir do primeiro mês de remuneração, João terá direito de receber salário-família.","options":["Certo","Errado"],"answer":0,"explain":"CERTO. O salário-família é devido a partir do mês em que preenchidos os requisitos e comprovada a situação exigida. Fundamento: Lei nº 8.213/1991, arts. 65 a 70.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":89,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2290,"type":"tf","subject":"Direito Previdenciário","topic":"Pensão por morte","sub":"Dependentes e duração","difficulty":"Médio","text":"Pedro faleceu há 10 anos, na condição de segurado do RGPS, e somente agora seu filho único Haroldo, que atualmente tem vinte e sete anos de idade, tomou conhecimento do óbito e requereu o benefício da pensão por morte junto ao INSS. Nesse caso, Haroldo terá direito ao recebimento do valor retroativo da pensão por morte, mas tão somente o valor referente ao período compreendido entre a data do óbito e a idade em que teria completado vinte e um anos de idade.","options":["Certo","Errado"],"answer":1,"explain":"ERRADO. Filho maior de 21 anos, salvo as hipóteses legais de invalidez ou deficiência, não mantém direito ao benefício desde o óbito por todo o período indicado. Fundamento: Lei nº 8.213/1991, arts. 74 a 79.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":90,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2291,"type":"tf","subject":"Direito Previdenciário","topic":"Pensão por morte","sub":"Dependentes e duração","difficulty":"Médio","text":"Rosa, que tinha dezesseis anos de idade, recebia do INSS o benefício da pensão por morte em decorrência do óbito de seu pai; no entanto, nessa condição, ficou grávida e faleceu no momento em que dava à luz a sua filha Maria. Nesse caso, Maria não terá direito de continuar recebendo do INSS a pensão por morte de seu avô.","options":["Certo","Errado"],"answer":1,"explain":"ERRADO. O direito da filha menor e a transmissão da cota de pensão seguem regras específicas; a situação descrita não gera automaticamente a manutenção indicada para a neta. Fundamento: Lei nº 8.213/1991, arts. 74 a 79.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":91,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2292,"type":"tf","subject":"Direito Previdenciário","topic":"Pensão por morte","sub":"Dependentes e duração","difficulty":"Médio","text":"Cônjuges divorciados terão direito à pensão por morte, desde que recebedores de pensão alimentícia, mesmo que este benefício tenha sido requerido e concedido a companheiro(a) ou novo cônjuge.","options":["Certo","Errado"],"answer":1,"explain":"ERRADO. A existência de pensão alimentícia pode conferir direito ao ex-cônjuge, observadas as regras de preferência e rateio com outros dependentes. Fundamento: Lei nº 8.213/1991, arts. 74 a 79.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":92,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2293,"type":"tf","subject":"Direito Previdenciário","topic":"Pensão por morte","sub":"Dependentes e duração","difficulty":"Médio","text":"Roberto, cujo pai morava em sua companhia, mas não era dependente, era segurado do RGPS, viúvo e com um filho inválido de vinte e cinco anos de idade quando faleceu. Nesse caso, têm direito à pensão por morte o filho e o pai de Roberto, cujo valor deverá ser rateado entre ambos, em partes iguais.","options":["Certo","Errado"],"answer":0,"explain":"CERTO. Pai não integra automaticamente a primeira classe; dependência econômica deve ser comprovada e há preferência das classes anteriores. Fundamento: Lei nº 8.213/1991, arts. 74 a 79.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":93,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2294,"type":"tf","subject":"Direito Previdenciário","topic":"Pensão por morte","sub":"Dependentes e duração","difficulty":"Médio","text":"Flávia, que faleceu em decorrência de morte súbita, estava casada com Cláudio havia um ano e oito meses e era segurada do RGPS havia um ano. Nesse caso, Cláudio terá direito ao recebimento da pensão por morte por um período de apenas quatro meses. Em relação ao auxílio-reclusão concedido pelo Regime Geral de Previdência Social (RGPS), julgue os itens a seguir.","options":["Certo","Errado"],"answer":1,"explain":"ERRADO. A duração da pensão depende, entre outros requisitos, do tempo de casamento/união e das contribuições; a afirmação de apenas quatro meses não decorre automaticamente dos dados fornecidos. Fundamento: Lei nº 8.213/1991, arts. 74 a 79.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":94,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2295,"type":"tf","subject":"Direito Previdenciário","topic":"Auxílio-reclusão","sub":"Requisitos e manutenção","difficulty":"Médio","text":"Considere que o companheiro e os filhos de Paula estejam recebendo auxílio-reclusão em decorrência da sua prisão e que, após dois anos de cárcere, Paula tenha cumprido todos os requisitos para a obtenção da aposentadoria por tempo de contribuição. Nesse caso, concedida a aposentadoria a Paula, cessa a concessão do auxílio-reclusão ao seu companheiro e filhos.","options":["Certo","Errado"],"answer":0,"explain":"CERTO. A aposentadoria do segurado preso pode fazer cessar o auxílio-reclusão quando presentes os requisitos legais. Fundamento: Lei nº 8.213/1991, art. 80.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":95,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2296,"type":"tf","subject":"Direito Previdenciário","topic":"Auxílio-reclusão","sub":"Requisitos e manutenção","difficulty":"Médio","text":"Considere que Manoel esteja recebendo aposentadoria por tempo de contribuição e tenha sido condenado a pena de reclusão. Nesse caso, após o seu recolhimento à prisão, a aposentadoria de Manoel será convertida em auxílio-reclusão.","options":["Certo","Errado"],"answer":1,"explain":"ERRADO. A aposentadoria não é convertida em auxílio-reclusão pelo simples recolhimento à prisão. Fundamento: Lei nº 8.213/1991, art. 80.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":96,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2297,"type":"tf","subject":"Direito Previdenciário","topic":"Auxílio-reclusão","sub":"Requisitos e manutenção","difficulty":"Médio","text":"Caso o segurado tenha cônjuge e filhos de qualquer idade, o valor do benefício previdenciária devido a título de auxílio-reclusão será rateado entre todos eles, em partes iguais.","options":["Certo","Errado"],"answer":1,"explain":"ERRADO. O auxílio-reclusão é rateado entre os dependentes habilitados, não entre todos os cônjuges e filhos independentemente dos requisitos de dependência. Fundamento: Lei nº 8.213/1991, art. 80.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":97,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2298,"type":"tf","subject":"Direito Previdenciário","topic":"Auxílio-reclusão","sub":"Requisitos e manutenção","difficulty":"Médio","text":"Caso o segurado de baixa renda conheça uma pessoa durante o período do encarceramento e com ela venha a contrair núpcias, ela não terá direito ao recebimento do auxílio-reclusão. No que se refere ao abono anual concedido pelo Regime Geral de Previdência Social (RGPS), julgue os itens subsequentes.","options":["Certo","Errado"],"answer":1,"explain":"ERRADO. A formação de nova união durante o encarceramento não exclui, por si só, a análise do direito da nova dependente segundo as regras aplicáveis. Fundamento: Lei nº 8.213/1991, art. 80.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":98,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2299,"type":"tf","subject":"Direito Previdenciário","topic":"Abono anual","sub":"Décimo terceiro previdenciário","difficulty":"Médio","text":"O segurado do RGPS que recebe pensão por morte e auxílio-reclusão não faz jus ao abono anual previdenciário.","options":["Certo","Errado"],"answer":1,"explain":"ERRADO. Pensão por morte e auxílio-reclusão geram direito ao abono anual nas hipóteses legais. Fundamento: Lei nº 8.213/1991, art. 40.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":99,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2300,"type":"tf","subject":"Direito Previdenciário","topic":"Abono anual","sub":"Décimo terceiro previdenciário","difficulty":"Médio","text":"Suponha que uma segurada contribuinte individual tenha recebido salário-maternidade de julho a outubro. Nesse caso, a segurada estava no direito de receber, junto com o valor do benefício recebido no mês de outubro, o equivalente a quatro doze avos a título de abono anual.","options":["Certo","Errado"],"answer":0,"explain":"CERTO. O abono anual do salário-maternidade é proporcional ao período de benefício, observada a regra de cálculo. Fundamento: Lei nº 8.213/1991, art. 40.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":100,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2301,"type":"tf","subject":"Direito Previdenciário","topic":"Atendimento/CNIS/PEP","sub":"PEP","difficulty":"Médio","text":"Todos os conteúdos educativos oferecidos pelo programa de educação previdenciária (PEP) por meio dos canais de comunicação do INSS e nas mídias eletrônicas são produzidos por instituições privadas, especialmente contratadas com a finalidade de divulgar esse programa.","options":["Certo","Errado"],"answer":1,"explain":"ERRADO. O PEP não é produzido exclusivamente por instituições privadas; o INSS coordena e desenvolve ações do programa. Fundamento: Normas do Programa de Educação Previdenciária do INSS.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":101,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2302,"type":"tf","subject":"Direito Previdenciário","topic":"Atendimento/CNIS/PEP","sub":"PEP","difficulty":"Médio","text":"O programa de educação previdenciária (PEP) tem por objetivo principal conscientizar os estudantes do ensino fundamental, médio e superior acerca dos benefícios dos planos de proteção previdenciária na vida dos beneficiários da previdência social.","options":["Certo","Errado"],"answer":1,"explain":"ERRADO. O PEP tem finalidade mais ampla de educação previdenciária, não apenas a conscientização de estudantes sobre benefícios. Fundamento: Normas do Programa de Educação Previdenciária do INSS.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":102,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2303,"type":"tf","subject":"Direito Previdenciário","topic":"Atendimento/CNIS/PEP","sub":"PEP","difficulty":"Médio","text":"O programa de educação previdenciária (PEP) tem por objetivo disseminar o conhecimento previdenciário por meio de diversas ações presenciais como palestras e cursos, e também por intermédio de ambientes virtuais como vídeos, podcasts e tutoriais. No que diz respeito ao Cadastro Nacional de Informações Sociais (CNIS), julgue os itens a seguir.","options":["Certo","Errado"],"answer":0,"explain":"CERTO. A disseminação do conhecimento previdenciário ocorre por ações presenciais e meios virtuais, conforme a descrição do programa. Fundamento: Normas do Programa de Educação Previdenciária do INSS.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":103,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2304,"type":"tf","subject":"Direito Previdenciário","topic":"Atendimento/CNIS/PEP","sub":"Dados e justificação administrativa","difficulty":"Médio","text":"É defeso utilizar os dados constantes do CNIS relativos a vínculos, remunerações e contribuições para comprovar filiação à previdência social, tempo de contribuição e salários de contribuição.","options":["Certo","Errado"],"answer":1,"explain":"ERRADO. Os dados do CNIS podem ser utilizados para comprovar filiação, tempo de contribuição e salário de contribuição, nas condições legais. Fundamento: Lei nº 8.213/1991 e IN INSS nº 128/2022.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":104,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2305,"type":"tf","subject":"Direito Previdenciário","topic":"Atendimento/CNIS/PEP","sub":"Dados e justificação administrativa","difficulty":"Médio","text":"Para solicitar inclusão, alteração, ratificação ou exclusão das informações divergentes, extemporâneas ou insuficientes, do CNIS, o filiado deverá apresentar requerimento, dispensado nas situações de atualização que não demandem a sua manifestação escrita, vinculadas ao requerimento de benefícios.","options":["Certo","Errado"],"answer":0,"explain":"CERTO. O requerimento é exigido para alterações no CNIS, com as dispensas previstas para atualizações vinculadas a requerimentos de benefícios. Fundamento: Lei nº 8.213/1991 e IN INSS nº 128/2022.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":105,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2306,"type":"tf","subject":"Direito Previdenciário","topic":"Atendimento/CNIS/PEP","sub":"Dados e justificação administrativa","difficulty":"Médio","text":"A justificação administrativa é conjunto de atividades realizadas junto a beneficiários, empresas, órgãos públicos e entidades representativas de classe necessárias para a atualização do CNIS e para reconhecimento, manutenção e revisão de direitos. Julgue os itens a seguir acerca da certidão de tempo de contribuição (CTC).","options":["Certo","Errado"],"answer":0,"explain":"CERTO. A justificação administrativa reúne atividades destinadas à atualização do CNIS e ao reconhecimento, manutenção e revisão de direitos. Fundamento: Lei nº 8.213/1991 e IN INSS nº 128/2022.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":106,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2307,"type":"tf","subject":"Direito Previdenciário","topic":"RPPS/CTC/Compensação","sub":"Certidão de tempo de contribuição","difficulty":"Médio","text":"A emissão de certidão única com destinação do tempo de contribuição para, no máximo, dois órgãos distintos, é permitida quando o documento for solicitado pelo segurado que exerce cargos constitucionalmente acumuláveis.","options":["Certo","Errado"],"answer":0,"explain":"CERTO. A CTC pode ter destinação para mais de um órgão nas hipóteses de cargos constitucionalmente acumuláveis, conforme as regras específicas. Fundamento: Constituição Federal, art. 201, § 9º, e IN INSS nº 128/2022.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":107,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2308,"type":"tf","subject":"Direito Previdenciário","topic":"RPPS/CTC/Compensação","sub":"Certidão de tempo de contribuição","difficulty":"Médio","text":"É vedada a emissão de CTC para fins de contagem de recíproca com conversão de tempo de contribuição do segurado na condição de pessoa com deficiência.","options":["Certo","Errado"],"answer":1,"explain":"ERRADO. A conversão de tempo da pessoa com deficiência para contagem recíproca não é admitida nos termos legais. Fundamento: Constituição Federal, art. 201, § 9º, e IN INSS nº 128/2022.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":108,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2309,"type":"tf","subject":"Direito Previdenciário","topic":"RPPS/CTC/Compensação","sub":"Certidão de tempo de contribuição","difficulty":"Médio","text":"É vedada a emissão de CTC para fins de contagem recíproca para o período de atividade rural comprovado como segurado especial, ainda que indenizado. Julgue os itens a seguir, relativos à compensação previdenciária.","options":["Certo","Errado"],"answer":1,"explain":"ERRADO. Há hipóteses em que o período rural de segurado especial pode ser utilizado para contagem recíproca mediante indenização; a vedação absoluta está incorreta. Fundamento: Constituição Federal, art. 201, § 9º, e IN INSS nº 128/2022.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":109,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2310,"type":"tf","subject":"Direito Previdenciário","topic":"RPPS/CTC/Compensação","sub":"Compensação entre regimes","difficulty":"Médio","text":"O Regime Geral de Previdência Social (RGPS) e os Regimes Próprios utilizarão o mesmo sistema para envio e análise dos requerimentos de compensação previdenciária.","options":["Certo","Errado"],"answer":0,"explain":"CERTO. RGPS e RPPS utilizam o sistema oficial de compensação previdenciária para processamento dos requerimentos. Fundamento: Legislação da compensação previdenciária.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":110,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2311,"type":"tf","subject":"Direito Previdenciário","topic":"RPPS/CTC/Compensação","sub":"Compensação entre regimes","difficulty":"Médio","text":"É vedada a compensação previdenciária para salário-maternidade, auxílio-doença, auxílio-reclusão e pensão por morte não precedida de aposentadoria. No que se refere aos procedimentos revisionais de benefícios, julgue os itens a seguir.","options":["Certo","Errado"],"answer":0,"explain":"CERTO. A compensação não é devida para determinados benefícios, incluindo os expressamente listados na legislação. Fundamento: Legislação da compensação previdenciária.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":111,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2312,"type":"tf","subject":"Direito Previdenciário","topic":"Revisão de benefícios","sub":"Procedimentos revisionais","difficulty":"Médio","text":"A revisão que acarretar prejuízo ao beneficiário produzirá efeitos imediatos, independentemente da conclusão dos procedimentos que assegurem o contraditório e a ampla defesa.","options":["Certo","Errado"],"answer":1,"explain":"ERRADO. Uma revisão que possa prejudicar o beneficiário deve respeitar contraditório e ampla defesa antes da produção de efeitos lesivos. Fundamento: Lei nº 9.784/1999, Lei nº 8.213/1991 e normas do INSS.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":112,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},

function makeQuestionQueue(arr){

  if(key===questionQueueKey && questionQueue.length===arr.length) return;
  let out=[];
  if(questionMixMode==='sequential') out=arr.slice();
  else if(questionMixMode==='random') out=shuffleArray(arr);
  else {
    const groups={};
    arr.forEach(q=>{const k=questionGroupKey(q);(groups[k]??=[]).push(q)});
    const groupList=shuffleArray(Object.values(groups));
    groupList.forEach(g=>{g.sort(()=>Math.random()-.5)});
    let lastGroup='';
    while(groupList.some(g=>g.length)){
      let candidates=groupList.filter(g=>g.length && questionGroupKey(g[0])!==lastGroup);
      if(!candidates.length)candidates=groupList.filter(g=>g.length);
      const g=candidates[Math.floor(Math.random()*candidates.length)];
      const q=g.shift(); out.push(q); lastGroup=questionGroupKey(q);

 </div>`;
}
function selectAnswer(id,ch){if(qs.find(x=>x.id===id)?.annulled)return;pendingChoice={id,choice:ch};questions()}
function confirmAnswer(id){if(!pendingChoice||pendingChoice.id!==id)return;answer(id,pendingChoice.choice);pendingChoice=null}

function clearFilters(){filter={search:'',subject:'Todos',topic:[],difficulty:'Todos',status:'Todos',bank:'Todos',exam:'Todos'};resetQuestionSession();questions()}
function toggleGabarito(id){
  const q=qs.find(x=>x.id===id); if(!q||q.annulled)return;
  const novo=q.type==='tf'?(q.answer===0?1:0):(q.answer+1)%q.options.length;
  q.answer=novo; state.gabaritoOverrides[id]=novo;
  if(state.answers[id]) state.answers[id].correct=state.answers[id].choice===novo;
  (state.history||[]).forEach(h=>{if(h.id===id) h.correct=h.choice===novo});
  save(); lastAnsweredId=id; pendingChoice=null; updateQuestionPerformanceIndicator(); document.dispatchEvent(new Event('performance-refresh'));
  toast('Gabarito alterado manualmente.'); questions();
}
function answer(id,ch){let q=qs.find(x=>x.id===id);if(q?.annulled){toast('Questão anulada: não entra no cálculo.');return;}let correct=ch===q.answer;state.answers[id]={choice:ch,correct,at:new Date().toISOString()};if(!(sessionAnsweredIds||[]).some(x=>String(x)===String(id))) sessionAnsweredIds.push(id);sessionAnswerHistory.push({id,correct,choice:ch,at:new Date().toISOString()});state.history.unshift({id,choice:ch,correct,at:new Date().toISOString()});state.history=state.history.slice(0,2000);showLastAnswerForId=id;save();updateQuestionPerformanceIndicator();document.dispatchEvent(new Event('performance-refresh'));lastAnsweredId=id;pendingChoice=null;toast(correct?'Resposta correta!':'Resposta incorreta. Revise o comentário.');questions(id)}
function toggleFavorite(id){state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];save();questions()}
function nextQ(){
  lastAnsweredId=null; pendingChoice=null; showLastAnswerForId=null;
  const total=Math.max(1,sessionQuestionIds.length||questionQueue.length);
  const next=Math.min(current+1,total-1);
  if(next!==current) current=next;
  questions();
}
function prevQ(){
  lastAnsweredId=null; pendingChoice=null; showLastAnswerForId=null;
  const prev=Math.max(0,current-1);
  if(prev!==current) current=prev;
  questions();
}
function filterActiveItems(){
  const selectedTopics=Array.isArray(filter.topic)?filter.topic:(filter.topic==='Todos'||!filter.topic?[]:[filter.topic]);
  const items=[];
  if(filter.subject!=='Todos') items.push({key:'Matéria',value:filter.subject,type:'subject'});
  selectedTopics.forEach((value,i)=>items.push({key:'Assunto',value,type:'topic',index:i}));
  if(filter.search) items.push({key:'Busca',value:filter.search,type:'search'});
  if(filter.difficulty!=='Todos') items.push({key:'Dificuldade',value:filter.difficulty,type:'difficulty'});
  if(filter.status!=='Todos') items.push({key:'Status',value:filter.status,type:'status'});
  if(filter.bank!=='Todos') items.push({key:'Banca',value:filter.bank,type:'bank'});
  if(filter.exam!=='Todos') items.push({key:'Prova',value:filter.exam,type:'exam'});
  return items;
}
function renderActiveFilters(){
  const items=filterActiveItems();
  const box=$('activeFilterChips'); if(!box)return;
  box.innerHTML=items.length?items.map((item,i)=>`<div class="active-chip" title="${esc(item.key)}: ${esc(item.value)}"><span>${esc(item.value)}</span><button type="button" class="chip-x" data-chip-index="${i}" aria-label="Remover ${esc(item.value)}">×</button></div>`).join(''):`<div class="active-empty"><b>Selecione os filtros ao lado</b><span>Os filtros escolhidos aparecerão aqui.</span></div>`;
  box.querySelectorAll('[data-chip-index]').forEach(btn=>btn.addEventListener('click',()=>{
    const item=items[Number(btn.dataset.chipIndex)]; if(!item)return;
    if(item.type==='topic') filter.topic=filterActiveItems().filter(x=>x.type==='topic').filter(x=>x.value!==item.value).map(x=>x.value);
    else if(item.type==='subject'){filter.subject='Todos';filter.topic=[]}
    else if(item.type==='search')filter.search='';
    else if(item.type==='difficulty')filter.difficulty='Todos';
    else if(item.type==='status')filter.status='Todos';
    else if(item.type==='bank')filter.bank='Todos';
    else if(item.type==='exam')filter.exam='Todos';
    resetQuestionSession();
    filtersPage();
  }));
}

  main.querySelector('#backToSubjects')?.addEventListener('click',()=>filtersPage());
  const search=main.querySelector('#filterListSearch'); search?.addEventListener('input',()=>{const term=search.value.toLowerCase().trim();main.querySelectorAll('[data-filter-list-value]').forEach(b=>b.style.display=(!term||b.textContent.toLowerCase().includes(term))?'flex':'none')});
  main.querySelectorAll('[data-filter-list-value]').forEach(btn=>btn.addEventListener('click',()=>{filter[type]=btn.dataset.filterListValue;resetQuestionSession();filtersPage()}));
}

function resetQuestionSession(){
  showLastAnswerForId=null;
  current=0;
  sessionQuestionNumber=1;
  lastAnsweredId=null;
  pendingChoice=null;
  questionQueue=[];
  questionQueueKey='';
  sessionQuestionIds=[];
  sessionAnsweredIds=[];
  sessionAnswerHistory=[];
}
function startQuestionSession(){
  const arr=filtered().filter(q=>!q.annulled);
  makeQuestionQueue(arr);
  sessionQuestionIds=questionQueue.slice();
  sessionAnsweredIds=[];
  sessionAnswerHistory=[];
  current=0;
  sessionQuestionNumber=1;
  lastAnsweredId=null;
  pendingChoice=null;
}
function refreshQuestionSession(){
  resetQuestionSession();
  startQuestionSession();
}

function filtersPage(){
  const subjects=[...new Set(qs.map(q=>q.subject).filter(Boolean))].sort();
  const selectedTopics=Array.isArray(filter.topic)?filter.topic:(filter.topic==='Todos'||!filter.topic?[]:[filter.topic]);
  const difficulties=['Todos','Fácil','Médio','Difícil'];
  const statuses=['Todos','Não resolvidas','Acertadas','Erradas','Favoritas'];
  const activeItems=filterActiveItems();
  const topicCount=selectedTopics.length;
  $('content').innerHTML=`
    <div class="filter-page-clean">
      <div class="filter-breadcrumb"><span>Estudo</span><b>›</b><strong>Filtrar questões</strong></div>
      <div class="filter-typebar">
        <label><input type="radio" name="filterType" checked> <b>Objetivas (todas)</b></label>
        <label class="muted-option"><input type="radio" name="filterType" disabled> Objetivas (inéditas)</label>
        <label class="muted-option"><input type="radio" name="filterType" disabled> Discursivas</label>
      </div>
      <div class="filter-workspace">
        <aside class="filter-side-menu">
          <div class="filter-side-title">Filtros</div>
          <button class="filter-side-item active" data-filter-section="subjects"><span>Matéria e assunto</span></button>
          <button class="filter-side-item" data-filter-section="bank"><span>Banca</span></button>
          <button class="filter-side-item" data-filter-section="exam"><span>Prova</span></button>
          <button class="filter-side-item" data-filter-section="organ"><span>Órgão e cargo</span></button>
          <button class="filter-side-item" data-filter-section="year"><span>Ano</span></button>
          <button class="filter-side-item" data-filter-section="school"><span>Escolaridade</span></button>
          <button class="filter-side-item" data-filter-section="search"><span>Enunciados</span></button>
          <button class="filter-side-item" data-filter-section="options"><span>Opções</span></button>
        </aside>
        <section class="filter-main-panel">
          <div class="filter-panel-head">
            <div class="filter-panel-tabs"><b>Matérias e assuntos</b><button type="button" id="filterSearchToggle">Pesquisar por nome&nbsp; ↔</button></div>
            <div class="filter-search-box" id="filterSearchBox"><span>⌕</span><input id="filterTreeSearch" value="${esc(filter.search)}" placeholder="Pesquisar por matéria ou assunto..."></div>
          </div>
          <div class="filter-tree" id="filterTree">
            <button type="button" class="tree-row tree-root" data-value="Todos"><span class="tree-arrow">▾</span><span class="tree-icon tree-root-arrow">➜</span><span>Todo o conteúdo</span></button>
            ${subjects.map(sub=>{
              const isSelected=filter.subject===sub;
              const allRows=qs.filter(q=>q.subject===sub);
              const centralTopics=[...new Set(allRows.map(q=>canonicalTopic(q.topic)).filter(Boolean))].sort();
              const groups=centralTopics.filter(t=>t!=='Geral').map(t=>{
                const rowsForTopic=allRows.filter(q=>canonicalTopic(q.topic)===t);
                return {name:t,children:[],directTopic:t,count:rowsForTopic.length};
              });
              const open=isSelected||groups.some(g=>selectedTopics.includes(g.directTopic));
              return `<div class="tree-group ${open?'open':''}" data-subject="${esc(sub)}">
                <div class="tree-row ${isSelected?'selected':''}" data-subject-select="${esc(sub)}"><span class="tree-arrow">${open?'▾':'▸'}</span><span class="tree-icon tree-folder" aria-hidden="true"></span><span class="tree-subject-name">${esc(sub)}</span><span class="tree-count">${allRows.length}</span><button type="button" class="tree-complete subject-complete" data-subject-complete="${esc(sub)}">Matéria completa</button></div>
                <div class="tree-children">
                    <div class="tree-central-children">${groups.map(g=>{
                      const gOpen=isSelected||selectedTopics.includes(g.directTopic)||g.children.some(c=>selectedTopics.includes(c));
                      const gCount=g.count||0;
                      return `<div class="tree-central-item">
                        <label class="tree-row tree-topic-check ${gOpen?'open':''}"><input type="checkbox" class="topic-filter-checkbox" value="${esc(g.directTopic||'')}" ${g.directTopic&&selectedTopics.includes(g.directTopic)?'checked':''} ${g.directTopic?'':'disabled'}><span class="tree-icon tree-folder" aria-hidden="true"></span><span>${esc(g.name)}</span><span class="tree-count">${gCount}</span></label>
                      </div>`;
                    }).join('')}</div>
                </div>
              </div>`;
            }).join('')}
          </div>
          <div class="filter-panel-footer"><span>${qs.length} questões no banco</span><button type="button" class="text-action" id="clearTreeTopics">Limpar assuntos</button></div>
        </section>
        <aside class="filter-active-panel">
          <div class="active-head"><b>Filtros ativos: ${activeItems.length}</b><button type="button" id="clearAllActive">${activeItems.length?'Limpar tudo':''}</button></div>
          <div class="active-list active-chip-list" id="activeFilterChips"></div>
          <div class="found-box"><strong>${filtered().length}</strong><span>questões encontradas</span><div class="found-actions"><button type="button" class="text-action">▦ Calcular dificuldade</button><button type="button" class="text-action">✎ Editar quantidades</button></div></div>

  document.querySelectorAll('[data-subject-complete]').forEach(btn=>btn.addEventListener('click',e=>{

    e.preventDefault(); e.stopPropagation();
    const group=btn.closest('.tree-group');
    const subject=group?.dataset.subject||filter.subject;
    const topic=btn.dataset.topicComplete||'';
    filter.subject=subject;
    if(topic){
      filter.topic=[topic];

      // Grupo especial: seleciona todos os tópicos que pertencem a ele.
      const specialChildren=[...new Set([...group.querySelectorAll('.tree-child input')].map(x=>x.value))];
      filter.topic=specialChildren;
    }
    resetQuestionSession();
    navigate('questions');
  }));
  document.querySelectorAll('#filterTree input.topic-filter-checkbox').forEach(cb=>cb.addEventListener('change',()=>{filter.topic=[...new Set([...document.querySelectorAll('#filterTree input.topic-filter-checkbox:checked')].map(x=>x.value).filter(Boolean))];resetQuestionSession();filtersPage()}));
  $('clearTreeTopics')?.addEventListener('click',()=>{filter.topic=[];resetQuestionSession();filtersPage()});
  $('clearAllActive')?.addEventListener('click',()=>{clearFilters();filtersPage()});
  $('restoreFilters')?.addEventListener('click',()=>{clearFilters();filtersPage()});
  $('applyFilterVisual')?.addEventListener('click',()=>{refreshQuestionSession();toast('Filtros aplicados.');navigate('questions')});
  document.querySelectorAll('[data-filter-section]').forEach(btn=>btn.addEventListener('click',()=>{
    const section=btn.dataset.filterSection;
    document.querySelectorAll('.filter-side-item').forEach(x=>x.classList.toggle('active',x===btn));
    if(section==='search'){searchBox.classList.add('show');treeSearch?.focus();return}
    if(section==='bank'){showFilterListPanel('bank',[...new Set(qs.map(q=>String(q.bank||'Sem banca')))],filter.bank);return}
    if(section==='exam'){showFilterListPanel('exam',[...new Set(qs.map(q=>String(q.exam||'Sem prova')))],filter.exam);return}
    if(section==='options'){showOptionsPanel(difficulties,statuses);return}

<script id="performance-pie-script">
(function(){
  function updatePerformance(){
    if(typeof state==='undefined') return;
    const allQs=(typeof qs!=='undefined')?qs:[];
    const currentIds=new Set(allQs.filter(q=>!q.annulled).map(q=>String(q.id)));
    const entries=(state.history||[]).filter(h=>h&&currentIds.has(String(h.id)));
    const solved=entries.length;
    const correct=entries.filter(x=>x.correct).length;
    const wrong=entries.filter(x=>!x.correct).length;
    const available=allQs.filter(q=>!q.annulled).length;
    const remaining=Math.max(0,available-new Set(entries.map(x=>String(x.id))).size);
    const rate=solved?Math.round(correct/solved*100):0;
    const degrees=solved?Math.round(correct/solved*360):0;
    const pie=document.getElementById('performancePie');
    if(pie) pie.style.background=`conic-gradient(#49b987 0deg ${degrees}deg,#df7075 ${degrees}deg 360deg)`;
    const set=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=v};
    set('performanceRate',rate+'%');
    set('performanceCorrect',correct);
    set('performanceWrong',wrong);
    set('performanceSolved',solved);
    set('performanceAvailable',available);
    set('performanceRemaining',remaining);
  }
  function openPerformance(){
    updatePerformance();
    const m=document.getElementById('performanceModal');
    if(m){m.classList.add('open');m.setAttribute('aria-hidden','false')}
  }
  function closePerformance(){
    const m=document.getElementById('performanceModal');
    if(m){m.classList.remove('open');m.setAttribute('aria-hidden','true')}
  }
  document.addEventListener('performance-refresh',updatePerformance);
  document.addEventListener('click',e=>{
    if(e.target.closest('#performanceBtn'))openPerformance();
    if(e.target.closest('[data-close-performance]'))closePerformance();
  });
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closePerformance()});
})();
</script>














<script id="clean-button-sounds">
(function(){
  let audioCtx = null;
  let soundEnabled = localStorage.getItem('questoesSound') !== 'off';
  let lastSound = 0;

  function ensureAudio(){
    const C = window.AudioContext || window.webkitAudioContext;
    if(!C) return null;
    audioCtx = audioCtx || new C();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function playButtonSound(){
    if(!soundEnabled) return;
    const now = performance.now();
    if(now - lastSound < 45) return;
    lastSound = now;
    try{
      const ctx = ensureAudio();
      if(!ctx) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(690, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(520, ctx.currentTime + .045);
      gain.gain.setValueAtTime(.0001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(.07, ctx.currentTime + .004);
      gain.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + .055);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + .06);
    }catch(e){}
  }

  const soundControl = document.getElementById('soundControl');
  if(soundControl){ soundControl.textContent = soundEnabled ? '🔊' : '🔇'; soundControl.title = soundEnabled ? 'Desativar sons' : 'Ativar sons'; }

  document.addEventListener('pointerdown', function(e){
    const control = e.target.closest('button, [role="button"], input[type="button"], input[type="submit"], .v22-option');
    if(!control || control.disabled || control.getAttribute('aria-disabled') === 'true') return;

    if(control.id === 'soundControl'){
      soundEnabled = !soundEnabled;
      localStorage.setItem('questoesSound', soundEnabled ? 'on' : 'off');
      control.textContent = soundEnabled ? '🔊' : '🔇';
      control.title = soundEnabled ? 'Desativar sons' : 'Ativar sons';
      control.setAttribute('aria-label', control.title);
      if(soundEnabled) playButtonSound();
      return;
    }

    control.classList.add('sound-pressed');
    setTimeout(() => control.classList.remove('sound-pressed'), 80);
    playButtonSound();
  }, true);
})();
</script>
