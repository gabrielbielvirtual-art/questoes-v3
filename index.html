{"id":2077,"type":"tf","subject":"Direito Previdenciário","topic":"Pensão por morte","sub":"Dependentes, duração e acumulação","difficulty":"Difícil","text":"Suponha que o INSS tenha concedido pensão por morte presumida aos dependentes de determinado segurado. Nesse caso, se o segurado aparecer vivo, o pagamento do benefício será cessado imediatamente, e os dependentes terão, por regra, de restituir ao INSS todos os valores recebidos a título de pensão por morte.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":77,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"CERTO. Na pensão por morte presumida, o reaparecimento do segurado encerra o benefício. A restituição dos valores recebidos é disciplinada pela legislação, ressalvadas situações de boa-fé e regras específicas; o item reproduz a regra geral considerada pela banca."},
{"id":2078,"type":"tf","subject":"Direito Previdenciário","topic":"Pensão por morte","sub":"Dependentes, duração e acumulação","difficulty":"Médio","text":"Considere que Marcos, segurado do RGPS, seja obrigado, em decorrência de decisão judicial, a pagar pensão alimentícia a sua ex-esposa, Luíza, pelo período de um ano. Nessa situação, caso Marcos faleça enquanto estiver pagando a pensão alimentícia a Luíza, esta terá direito de receber o benefício da pensão por morte pelo prazo remanescente constante na decisão judicial que impôs a Marcos a obrigação de pagar pensão alimentícia.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":78,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"CERTO. O ex-cônjuge que recebia pensão alimentícia pode ter direito à pensão por morte pelo período restante da obrigação alimentar, conforme as regras legais. Base: Lei nº 8.213/1991, art. 76, § 2º."},
{"id":2079,"type":"tf","subject":"Direito Previdenciário","topic":"Auxílio-reclusão","sub":"Requisitos e manutenção","difficulty":"Médio","text":"Ao segurado facultativo recolhido à prisão em regime fechado é assegurado o recebimento, pelo INSS, do auxílio-reclusão pelo tempo em que permanecer privado da sua liberdade.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":79,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"ERRADO. O auxílio-reclusão é benefício destinado aos dependentes do segurado de baixa renda recolhido à prisão, e não ao próprio segurado facultativo. O item confunde titularidade do benefício."},
{"id":2080,"type":"tf","subject":"Direito Previdenciário","topic":"Auxílio-reclusão","sub":"Requisitos e manutenção","difficulty":"Difícil","text":"O valor do auxílio-reclusão será equivalente à média aritmética das doze últimas contribuições mensais do segurado ao INSS, limitado a três salários mínimos.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":80,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"ERRADO. O auxílio-reclusão não é calculado pela média das 12 últimas contribuições limitada a três salários mínimos. A renda mensal segue o limite e a regra de cálculo previstos na legislação vigente."},
{"id":2081,"type":"tf","subject":"Direito Previdenciário","topic":"Auxílio-reclusão","sub":"Requisitos e manutenção","difficulty":"Médio","text":"Se, no curso do benefício auxílio-reclusão, o segurado, cumpridas todas as exigências legais, passar a receber aposentadoria programada, o pagamento do auxílio-reclusão será extinto, ainda que o segurado permaneça privado de sua liberdade.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":81,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"CERTO. A concessão de aposentadoria ao segurado preso é causa de cessação do auxílio-reclusão, pois não se admite a manutenção conjunta do benefício nessas condições. Base: Lei nº 8.213/1991."},
{"id":2082,"type":"tf","subject":"Direito Previdenciário","topic":"Abono anual","sub":"Abono anual","difficulty":"Médio","text":"O segurado que recebe auxílio-acidente não faz jus ao abono anual.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":82,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"ERRADO. O auxílio-acidente gera direito ao abono anual. A legislação inclui o auxílio-acidente entre os benefícios que dão ensejo ao abono. Base: Lei nº 8.213/1991, art. 40, e regulamentação."},
{"id":2083,"type":"tf","subject":"Direito Previdenciário","topic":"Abono anual","sub":"Abono anual","difficulty":"Médio","text":"O segurado que receber o benefício do auxílio por incapacidade temporária por um período de oito meses ao longo de um ano terá direito ao recebimento do abono anual equivalente a 8/12 do valor recebido a título de auxílio por incapacidade temporária.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":83,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"CERTO. O abono anual é proporcional aos meses em que houve recebimento do benefício no ano; oito meses correspondem a 8/12, observada a forma legal de cálculo."},
{"id":2084,"type":"tf","subject":"Direito Previdenciário","topic":"BPC/LOAS","sub":"Concessão, renda e manutenção","difficulty":"Difícil","text":"O BPC é garantido ao idoso com 65 anos ou mais de idade e à pessoa com deficiência que comprovem renda per capita inferior a 1/4 do salário mínimo vigente e a inexistência de meios de prover a própria existência bem como a de sua família.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":84,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"CERTO para o gabarito oficial da prova. O BPC é devido ao idoso a partir de 65 anos e à pessoa com deficiência que preencham os requisitos socioeconômicos e de ausência de meios de manutenção. Atenção: a LOAS atualmente trabalha com renda familiar per capita igual ou inferior a 1/4 do salário mínimo, além de admitir hipóteses legais de exclusão/dedução e avaliação da vulnerabilidade; portanto, o comentário atualiza a redação do item sem alterar o gabarito oficial."},
{"id":2085,"type":"tf","subject":"Direito Previdenciário","topic":"BPC/LOAS","sub":"Concessão, renda e manutenção","difficulty":"Difícil","text":"O BPC poderá ser acumulado com aposentadoria pelo RGPS, desde que a soma dos valores não ultrapasse o teto previdenciário.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":85,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"ERRADO. O BPC não pode ser acumulado com aposentadoria do RGPS apenas porque a soma não ultrapassa o teto. A regra é de vedação de acumulação com benefício previdenciário, ressalvadas as hipóteses expressamente previstas em lei. Base: LOAS, art. 20, § 4º."},
{"id":2086,"type":"tf","subject":"Direito Previdenciário","topic":"BPC/LOAS","sub":"Concessão, renda e manutenção","difficulty":"Difícil","text":"O BPC pode ser suspenso se o beneficiário não realizar a atualização cadastral no cadastro único para programas sociais do governo federal.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":86,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"CERTO. A manutenção do BPC depende, entre outros requisitos, da atualização do CadÚnico e da revisão periódica. A ausência de atualização pode levar à suspensão/cessação conforme o procedimento administrativo vigente."},
{"id":2087,"type":"tf","subject":"Direito Previdenciário","topic":"Benefícios especiais","sub":"Hemodiálise, ex-combatentes, anistiados, hanseníase, Zika","difficulty":"Médio","text":"A pensão especial concedida às vítimas da contaminação por hemodiálise em Caruaru – PE possui caráter contributivo e depende da comprovação de vínculo com o RGPS.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":87,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"ERRADO. A pensão especial de Caruaru tem natureza indenizatória/especial e não é benefício contributivo dependente de vínculo com o RGPS. Base: Lei nº 9.422/1996."},
{"id":2088,"type":"tf","subject":"Direito Previdenciário","topic":"Benefícios especiais","sub":"Hemodiálise, ex-combatentes, anistiados, hanseníase, Zika","difficulty":"Médio","text":"A pensão concedida aos ex-combatentes da Segunda Guerra Mundial pode ser transmitida aos dependentes, observando-se os mesmos critérios de pensão por morte previstos no RGPS.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":88,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"ERRADO. A pensão especial de ex-combatente é regida por legislação própria e sua transmissão não segue simplesmente os mesmos critérios da pensão por morte do RGPS. Base: Lei nº 8.059/1990."},
{"id":2089,"type":"tf","subject":"Direito Previdenciário","topic":"Benefícios especiais","sub":"Hemodiálise, ex-combatentes, anistiados, hanseníase, Zika","difficulty":"Difícil","text":"Por ter natureza jurídica remuneratória, a pensão especial destinada aos anistiados políticos não pode ser acumulada com aposentadoria concedida pelo RPPS.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":89,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"ERRADO. A reparação econômica do anistiado político tem natureza indenizatória e não é simplesmente remuneração; a legislação específica disciplina as hipóteses de acumulação. A afirmação de vedação fundada em “natureza remuneratória” está incorreta."},
{"id":2090,"type":"tf","subject":"Direito Previdenciário","topic":"Benefícios especiais","sub":"Hemodiálise, ex-combatentes, anistiados, hanseníase, Zika","difficulty":"Difícil","text":"As despesas com medicamentos e tratamentos médicos dos beneficiários do BPC não podem ser deduzidas para fins de cálculo da renda per capita familiar.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":90,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"ERRADO. Despesas com medicamentos e tratamentos podem ser consideradas nas hipóteses e limites previstos na LOAS/regulamentação para o cálculo da renda familiar. A vedação absoluta do item é incorreta."},
{"id":2091,"type":"tf","subject":"Direito Previdenciário","topic":"Benefícios especiais","sub":"Hemodiálise, ex-combatentes, anistiados, hanseníase, Zika","difficulty":"Médio","text":"A pensão especial para as vítimas da hanseníase submetidas a isolamento compulsório é vitalícia e personalíssima, não sendo transmissível aos dependentes.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":91,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"CERTO. A pensão especial da hanseníase é vitalícia e personalíssima, não sendo, em regra, transmissível aos dependentes. Base: Lei nº 11.520/2007, com alterações posteriores."},
{"id":2092,"type":"tf","subject":"Direito Previdenciário","topic":"Benefícios especiais","sub":"Hemodiálise, ex-combatentes, anistiados, hanseníase, Zika","difficulty":"Médio","text":"O auxílio especial destinado a jogadores das seleções brasileiras campeãs do mundo só é concedido mediante a comprovação de situação de vulnerabilidade social.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":92,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"ERRADO. O auxílio especial aos jogadores campeões mundiais não exige vulnerabilidade social como requisito geral. Trata-se de benefício previsto em legislação específica, com destinatários e condições próprias."},
{"id":2093,"type":"tf","subject":"Direito Previdenciário","topic":"Benefícios especiais","sub":"Hemodiálise, ex-combatentes, anistiados, hanseníase, Zika","difficulty":"Difícil","text":"O valor da renda mensal inicial da pensão especial destinada a crianças com síndrome congênita do Zika vírus será de dois salários mínimos, sendo transferível somente à genitora.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":93,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"CERTO — gabarito oficial definitivo da prova. Atenção de atualização: após a aplicação, a Lei nº 15.156/2025 criou nova pensão especial mensal e vitalícia para pessoa com deficiência permanente decorrente de síndrome congênita associada ao Zika, em valor equivalente ao maior salário de benefício do RGPS. Portanto, para estudo atual, diferencie a regra cobrada originalmente pela prova da legislação posterior vigente."},
{"id":2094,"type":"tf","subject":"Direito Previdenciário","topic":"BPC/LOAS","sub":"Pessoa com deficiência e revisão","difficulty":"Difícil","text":"A concessão do referido benefício exige a realização de avaliação biopsicossocial da pessoa com deficiência.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":94,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"ERRADO. A avaliação biopsicossocial é prevista para a pessoa com deficiência, mas a forma e a composição da avaliação dependem da regulamentação; a afirmação categórica de que a concessão exige sempre exatamente essa avaliação foi considerada incorreta pela banca."},
{"id":2095,"type":"tf","subject":"Direito Previdenciário","topic":"BPC/LOAS","sub":"Pessoa com deficiência e revisão","difficulty":"Difícil","text":"Esse benefício é devido desde o momento da constatação da deficiência, independentemente da data do requerimento.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":95,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"CERTO. O BPC é devido a partir do requerimento, preenchidos os requisitos, e não simplesmente da data em que a deficiência foi constatada. O item, portanto, é juridicamente problemático; o gabarito oficial marcou C, que deve ser mantido no banco como resposta da prova."},
{"id":2096,"type":"tf","subject":"Direito Previdenciário","topic":"BPC/LOAS","sub":"Pessoa com deficiência e revisão","difficulty":"Médio","text":"A revisão periódica do BPC deve ser realizada pelo INSS para a verificação da manutenção das condições que ensejaram a concessão do benefício.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":96,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"CERTO. O BPC está sujeito a revisão periódica para verificar a manutenção dos requisitos que justificaram sua concessão. Base: LOAS, art. 21."},
{"id":2097,"type":"tf","subject":"Direito Previdenciário","topic":"Benefícios especiais","sub":"Síndrome da Talidomida","difficulty":"Médio","text":"O referido benefício corresponde a uma prestação mensal vitalícia e é isento de imposto de renda.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":97,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"ERRADO. A pensão da talidomida é mensal e vitalícia, mas a isenção de imposto de renda deve ser analisada conforme a legislação tributária específica; a formulação integral do item não corresponde à regra considerada pela banca."},
{"id":2098,"type":"tf","subject":"Direito Previdenciário","topic":"Benefícios especiais","sub":"Síndrome da Talidomida","difficulty":"Difícil","text":"Essa pensão especial é acumulável com outros benefícios previdenciários do RGPS, desde que a soma dos benefícios acumulados não ultrapasse o teto de três salários mínimos.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":98,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"CERTO. A pensão especial da talidomida possui regras próprias de acumulação, e a legislação admite sua percepção juntamente com benefícios previdenciários nas hipóteses legais; o gabarito oficial da prova é C."},
{"id":2099,"type":"tf","subject":"Direito Previdenciário","topic":"Seguro-defeso","sub":"Pescador artesanal","difficulty":"Médio","text":"O seguro defeso garante ao pescador artesanal o recebimento de um salário mínimo durante o período de paralisação da atividade pesqueira.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":99,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"ERRADO. O seguro-defeso é benefício de um salário mínimo, mas não basta a paralisação: exige-se enquadramento como pescador profissional artesanal e o cumprimento dos requisitos legais. A afirmação é excessivamente genérica."},
{"id":2100,"type":"tf","subject":"Direito Previdenciário","topic":"Seguro-defeso","sub":"Pescador artesanal","difficulty":"Médio","text":"Para ter direito ao seguro defeso, o pescador deve comprovar que exerce a pesca como atividade profissional complementar ou que a atividade da pesca é única e exclusivamente para a subsistência de sua família.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":100,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"CERTO. O seguro-defeso exige que a pesca seja exercida profissionalmente em regime artesanal, nas condições legais, e não apenas como atividade eventual. A redação do item está alinhada ao requisito de exercício profissional da pesca."},
{"id":2101,"type":"tf","subject":"Direito Previdenciário","topic":"Atendimento/CNIS/PEP","sub":"Cadastro e atualização de informações","difficulty":"Médio","text":"Os dados constantes do CNIS relativos a vínculos, remunerações e contribuições são válidos para a comprovação de filiação à previdência social, de tempo de contribuição e de salários de contribuição.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":101,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"CERTO. As informações do CNIS relativas a vínculos, remunerações e contribuições são utilizadas como prova para filiação, tempo de contribuição e salários de contribuição, sem prejuízo de correção quando houver inconsistências. Base: IN INSS nº 128/2022, atualizada."},
{"id":2102,"type":"tf","subject":"Direito Previdenciário","topic":"Atendimento/CNIS/PEP","sub":"Cadastro e atualização de informações","difficulty":"Difícil","text":"A realização da pesquisa externa para a atualização do CNIS prescinde de prévia designação de servidor do INSS mediante portaria.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":102,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"ERRADO. A pesquisa externa exige designação formal de servidor competente, observados os procedimentos administrativos. A palavra “prescinde” torna o item incorreto. Base: IN INSS nº 128/2022, em texto atualizado."},
{"id":2103,"type":"tf","subject":"Direito Previdenciário","topic":"Atendimento/CNIS/PEP","sub":"Cadastro e atualização de informações","difficulty":"Difícil","text":"Para a solicitação de inclusão, alteração, ratificação ou exclusão de informações divergentes, extemporâneas ou insuficientes no CNIS, exige-se a apresentação de requerimento pelo filiado, inclusive nas situações de atualização que não demandem sua manifestação escrita, vinculadas ao pedido de benefícios.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":103,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"CERTO. A atualização de informações divergentes, extemporâneas ou insuficientes no CNIS segue requerimento e documentação conforme a natureza do pedido e a forma de atualização. A IN 128/2022 disciplina essas situações."},
{"id":2104,"type":"tf","subject":"Direito Previdenciário","topic":"RPPS/CTC/Compensação","sub":"Certidão de tempo de contribuição","difficulty":"Difícil","text":"É possível a emissão de certidão única com destinação do tempo de contribuição para, no máximo, dois órgãos distintos, quando o documento for solicitado pelo segurado que exerce cargos constitucionalmente acumuláveis.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":104,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"CERTO. É possível emissão de CTC única com destinação a mais de um órgão quando se trata de cargos constitucionalmente acumuláveis, observadas as regras de contagem recíproca."},
{"id":2105,"type":"tf","subject":"Direito Previdenciário","topic":"RPPS/CTC/Compensação","sub":"Certidão de tempo de contribuição","difficulty":"Difícil","text":"É vedada a emissão de certidão de tempo de serviço para período fracionado, razão por que o segurado da previdência social não pode levar para o regime de previdência próprio dos servidores públicos apenas o montante de tempo de serviço que lhe seja necessário para a obtenção da aposentadoria almejada.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":105,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"ERRADO. É possível fracionar o tempo certificado, observadas as regras da CTC e da contagem recíproca. O segurado pode destinar apenas o período necessário, quando juridicamente admitido."},
{"id":2106,"type":"tf","subject":"Direito Previdenciário","topic":"RPPS/CTC/Compensação","sub":"Certidão de tempo de contribuição","difficulty":"Difícil","text":"É vedada a emissão de CTC, para fins de contagem recíproca, com a contagem em dobro ou em outras condições especiais.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":106,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"CERTO. É vedada a emissão de CTC para contagem recíproca com tempo contado em dobro ou em condições especiais incompatíveis com a contagem recíproca. Base: regras da CTC e contagem recíproca."},
{"id":2107,"type":"tf","subject":"Direito Previdenciário","topic":"RPPS/CTC/Compensação","sub":"Compensação entre regimes","difficulty":"Difícil","text":"A compensação previdenciária consiste no acerto de contas de natureza financeira entre o RGPS e RPPS, e entre os regimes próprios, referente ao tempo de contribuição utilizado na concessão de benefícios nos termos da contagem recíproca.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":107,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"CERTO. A compensação previdenciária é o acerto financeiro entre regimes decorrente da contagem recíproca de tempo utilizado para concessão de benefício. Base: CF, art. 201, § 9º, e legislação da compensação."},
{"id":2108,"type":"tf","subject":"Direito Previdenciário","topic":"RPPS/CTC/Compensação","sub":"Compensação entre regimes","difficulty":"Difícil","text":"É vedada a utilização do mesmo sistema para envio e análise dos requerimentos de compensação previdenciária pelo RGPS e pelos RPPS.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":108,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"ERRADO. A compensação previdenciária utiliza sistema próprio de operacionalização que integra os regimes participantes; não existe a vedação absoluta afirmada pelo item."},
{"id":2109,"type":"tf","subject":"Direito Previdenciário","topic":"Revisão de benefícios","sub":"Procedimentos revisionais","difficulty":"Difícil","text":"A revisão de benefícios deve ser iniciada por determinação judicial, observadas as disposições relativas à prescrição e à decadência.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":109,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"ERRADO. A revisão de benefício pode ser iniciada administrativamente pelo INSS ou a pedido do interessado; não depende de determinação judicial. Prescrição e decadência são limites jurídicos, mas não tornam a revisão exclusivamente judicial."},
{"id":2110,"type":"tf","subject":"Direito Previdenciário","topic":"Revisão de benefícios","sub":"Procedimentos revisionais","difficulty":"Médio","text":"O requerimento de revisão de benefícios pode ser feito integralmente pela Internet, sendo desnecessário o comparecimento presencial do beneficiário ao INSS.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":110,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"CERTO. O requerimento de revisão pode ser realizado pelos canais remotos do INSS, observadas as hipóteses em que eventual comparecimento ou apresentação de documentos seja solicitado."},
{"id":2111,"type":"tf","subject":"Direito Previdenciário","topic":"Revisão de benefícios","sub":"Procedimentos revisionais","difficulty":"Difícil","text":"A revisão que acarretar prejuízo ao beneficiário produzirá efeitos apenas após a conclusão dos procedimentos que garantam o contraditório e a ampla defesa.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":111,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"CERTO. Se a revisão administrativa puder reduzir ou cessar benefício, devem ser observados contraditório e ampla defesa antes da produção dos efeitos prejudiciais, conforme o devido processo administrativo."},
{"id":2112,"type":"tf","subject":"Direito Previdenciário","topic":"Processo Administrativo Previdenciário","sub":"CRPS e recursos","difficulty":"Médio","text":"É assegurado ao requerente cujo pedido seja indeferido pelo INSS o direito de interpor recurso ao CRPS contra a decisão de indeferimento.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":112,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"CERTO. O requerente tem direito de recorrer ao CRPS contra decisão de indeferimento do INSS, nos termos da legislação e dos regulamentos do processo administrativo previdenciário."},
{"id":2113,"type":"tf","subject":"Direito Previdenciário","topic":"Processo Administrativo Previdenciário","sub":"CRPS e recursos","difficulty":"Difícil","text":"O prazo para interposição dos recursos ordinário e especial, bem como para apresentação dos incidentes processuais é de cinco dias úteis, a contar da data da ciência da decisão questionada pela parte.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":113,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"ERRADO. O prazo indicado de cinco dias úteis não corresponde ao prazo geral dos recursos previdenciários do CRPS; a disciplina administrativa estabelece prazo próprio, atualmente de 30 dias para recurso ordinário, salvo regra específica."},
{"id":2114,"type":"tf","subject":"Direito Previdenciário","topic":"Processo Administrativo Previdenciário","sub":"CRPS e recursos","difficulty":"Difícil","text":"Quando as câmaras de julgamento entenderem pela necessidade de anulação do julgamento pretérito, será admitida a devolução dos autos à junta de recursos de origem para reexame da matéria e nova decisão de mérito, ou, em atendimento ao princípio de economia processual, se não houver prejuízo à instrução processual ou à defesa das partes, poderão estas pronunciar-se em caráter definitivo sobre o mérito da controvérsia no âmbito administrativo.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":114,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"CERTO. Em determinadas hipóteses, as câmaras podem anular o julgamento e devolver os autos ou, se não houver prejuízo à instrução ou à defesa, decidir definitivamente o mérito, em observância à economia processual."},
{"id":2115,"type":"tf","subject":"Direito Previdenciário","topic":"Acordos internacionais","sub":"Organismos de ligação e aplicação","difficulty":"Difícil","text":"A celebração de acordo internacional de previdência social implica a modificação da legislação vigente no país, razão por que o país signatário deixa de analisar os pedidos de benefícios com fundamento em sua legislação interna e passa a decidir sobre eles apenas com base no referido tratado.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":115,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"ERRADO. O acordo internacional não substitui a legislação interna. Ele coordena os sistemas dos países signatários e é aplicado conjuntamente com a legislação nacional, dentro do seu campo de incidência."},
{"id":2116,"type":"tf","subject":"Direito Previdenciário","topic":"Acordos internacionais","sub":"Organismos de ligação e aplicação","difficulty":"Difícil","text":"Compete privativamente ao Ministério das Relações Exteriores gerenciar e acompanhar as negociações de acordos internacionais em matéria de previdência social.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":116,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"ERRADO. A negociação e a gestão de acordos internacionais de previdência social não competem privativamente ao Ministério das Relações Exteriores; há participação institucional do órgão previdenciário competente."},
{"id":2117,"type":"tf","subject":"Direito Previdenciário","topic":"Acordos internacionais","sub":"Organismos de ligação e aplicação","difficulty":"Difícil","text":"São as seguintes as competências do organismo de ligação: promover o intercâmbio de informações com o país acordante; analisar e concluir as solicitações relativas ao tempo de contribuição ou ao seguro vertidos para países signatários de acordo internacional; emitir certificados e documentos para a aplicação do acordo; e prestar atendimento aos segurados.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":117,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"CERTO. O organismo de ligação atua no intercâmbio de informações, processamento das solicitações abrangidas pelo acordo, emissão de certificados/documentos e atendimento aos segurados, conforme o instrumento internacional e a regulamentação."},
{"id":2118,"type":"tf","subject":"Direito Previdenciário","topic":"Atendimento/CNIS/PEP","sub":"PEP","difficulty":"Médio","text":"Gerenciado pelo INSS, o PEP visa à promoção de educação básica aos filhos dos segurados que não possuem acesso à educação formal promovida pelo poder público.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":118,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"ERRADO. O PEP não é programa de educação básica para filhos de segurados. Seu objetivo é ampliar a educação previdenciária da população, orientando sobre direitos, deveres e serviços da Previdência Social."},
{"id":2119,"type":"tf","subject":"Direito Previdenciário","topic":"Atendimento/CNIS/PEP","sub":"PEP","difficulty":"Médio","text":"O conteúdo do PEP é divulgado por meio de ações presenciais e virtuais, tais como a promoção de cursos com os mais variados temas de interesses dos segurados, bem como o uso de rádio e mídias eletrônicas, com enciclopédia, vídeos, podcasts e interação em redes sociais.","options":["Certo","Errado"],"answer":0,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":119,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"CERTO. O PEP utiliza ações presenciais e virtuais e diferentes meios de comunicação, incluindo cursos, rádio, mídias eletrônicas, vídeos, podcasts e redes sociais."},
{"id":2120,"type":"tf","subject":"Direito Previdenciário","topic":"Atendimento/CNIS/PEP","sub":"PEP","difficulty":"Médio","text":"O PEP é promovido por empresas contratadas pelo INSS, mediante licitação, para a disseminação de conteúdos de interesse coletivo e ampliação do conhecimento acerca dos mais diversos temas, de cunho social, econômico, cultural e ambiental.","options":["Certo","Errado"],"answer":1,"annulled":false,"source":"INSS 2025 — Curso de Formação (3ª Turma)","examItem":120,"year":2025,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (3ª Turma)","explain":"ERRADO. O PEP é uma ação institucional do INSS, não um serviço necessariamente executado por empresas privadas contratadas mediante licitação. O item atribui a terceiros uma característica que não define o programa."},
{"id":2201,"type":"tf","subject":"Direito Previdenciário","topic":"Atendimento/CNIS/PEP","sub":"Estrutura e atendimento","difficulty":"Médio","text":"A central de atendimento 135 foi criada com o propósito de ampliar o acesso da população aos serviços do INSS por meio de um canal de atendimento por telefone.","options":["Certo","Errado"],"answer":0,"explain":"CERTO. O 135 é canal telefônico criado para ampliar o acesso aos serviços do INSS. Fundamento: INSS e normas administrativas de atendimento.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":1,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2202,"type":"tf","subject":"Direito Previdenciário","topic":"Atendimento/CNIS/PEP","sub":"Estrutura e atendimento","difficulty":"Médio","text":"Atendimentos de alta complexidade nas agências somente podem ser realizados por servidores do INSS.","options":["Certo","Errado"],"answer":1,"explain":"ERRADO. Atendimentos de alta complexidade não são, pela simples classificação do serviço, exclusivos de servidores do INSS. Fundamento: INSS e normas administrativas de atendimento.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":2,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2203,"type":"tf","subject":"Direito Previdenciário","topic":"Atendimento/CNIS/PEP","sub":"Estrutura e atendimento","difficulty":"Médio","text":"Na estrutura do INSS, as superintendências regionais são subordinadas às gerências executivas, que coordenam as políticas de atendimento em grandes regiões. Julgue os itens subsequentes a respeito do benefício de prestação continuada (BPC/LOAS).","options":["Certo","Errado"],"answer":1,"explain":"ERRADO. A relação hierárquica indicada está invertida: superintendências regionais não são subordinadas às gerências executivas. Fundamento: INSS e normas administrativas de atendimento.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":3,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2204,"type":"tf","subject":"Direito Previdenciário","topic":"BPC/LOAS","sub":"Requisitos e manutenção","difficulty":"Médio","text":"O BPC/LOAS integra a proteção social básica do Sistema Único de Assistência Social (SUAS), sendo os Centros de Referência de Assistência Social (CRAS) responsáveis por orientar, encaminhar e acompanhar os beneficiários.","options":["Certo","Errado"],"answer":0,"explain":"CERTO. O BPC integra a proteção social básica do SUAS, e o CRAS atua na orientação e encaminhamento dos usuários. Fundamento: Lei nº 8.742/1993 (LOAS), especialmente art. 20.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":4,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2205,"type":"tf","subject":"Direito Previdenciário","topic":"BPC/LOAS","sub":"Requisitos e manutenção","difficulty":"Médio","text":"O BPC/LOAS é um benefício vitalício, e sua fruição independe da manutenção das condições que lhe deram origem.","options":["Certo","Errado"],"answer":1,"explain":"ERRADO. O BPC não é vitalício de forma incondicionada; sua manutenção depende da permanência dos requisitos legais. Fundamento: Lei nº 8.742/1993 (LOAS), especialmente art. 20.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":5,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2206,"type":"tf","subject":"Direito Previdenciário","topic":"BPC/LOAS","sub":"Requisitos e manutenção","difficulty":"Médio","text":"Para fins de concessão do BPC/LOAS, considera-se em situação de miserabilidade o requerente cuja renda mensal familiar per capita seja igual ou inferior ao salário mínimo, calculada pela divisão da renda familiar bruta pelo número de integrantes da família. Acerca da pensão especial da síndrome de talidomida e da pensão especial de seringueiros, julgue os itens a seguir.","options":["Certo","Errado"],"answer":1,"explain":"ERRADO. A miserabilidade não corresponde à renda per capita igual ou inferior ao salário mínimo; o critério legal é outro e admite avaliação de outros elementos. Fundamento: Lei nº 8.742/1993 (LOAS), especialmente art. 20.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":6,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2207,"type":"tf","subject":"Direito Previdenciário","topic":"Benefícios especiais","sub":"Talidomida e seringueiros","difficulty":"Médio","text":"Após o falecimento do beneficiário, a pensão especial da síndrome de talidomida pode ser transferida a seus dependentes.","options":["Certo","Errado"],"answer":1,"explain":"ERRADO. A pensão especial de talidomida é personalíssima e não se transfere aos dependentes após o falecimento. Fundamento: Leis nº 7.070/1982 e nº 7.986/1989.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":7,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2209,"type":"tf","subject":"Direito Previdenciário","topic":"Benefícios especiais","sub":"Talidomida e seringueiros","difficulty":"Médio","text":"A pensão especial da síndrome de talidomida é vitalícia e não gera direito ao pagamento de abono anual (décimo terceiro salário ou gratificação natalina).","options":["Certo","Errado"],"answer":0,"explain":"CERTO. A pensão especial de talidomida possui caráter vitalício e não gera abono anual. Fundamento: Leis nº 7.070/1982 e nº 7.986/1989.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":9,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2210,"type":"tf","subject":"Direito Previdenciário","topic":"Benefícios especiais","sub":"Talidomida e seringueiros","difficulty":"Médio","text":"O beneficiário da pensão especial de seringueiros pode receber outros benefícios pagos pelo Regime Geral da Previdência Social (RGPS) ou pelo Regime Próprio de Previdência Social (RPPS).","options":["Certo","Errado"],"answer":1,"explain":"ERRADO. A acumulação do benefício com benefícios previdenciários ou de regime próprio não é livre e irrestrita. Fundamento: Leis nº 7.070/1982 e nº 7.986/1989.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":10,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2211,"type":"tf","subject":"Direito Previdenciário","topic":"Benefícios especiais","sub":"Hemodiálise e anistiado político","difficulty":"Médio","text":"A aposentadoria excepcional ao anistiado político é concedida a todo requerente que se declare perseguido político, mesmo sem o reconhecimento formal da condição de anistiado.","options":["Certo","Errado"],"answer":1,"explain":"ERRADO. A condição de anistiado político depende do reconhecimento formal nos termos da legislação específica. Fundamento: Leis nº 9.422/1996 e nº 10.559/2002.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":11,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2213,"type":"tf","subject":"Direito Previdenciário","topic":"Benefícios especiais","sub":"Hemodiálise e anistiado político","difficulty":"Médio","text":"A pensão especial às vítimas de hemodiálise de Caruaru pode ser acumulada com benefícios previdenciários, mas não pode ser acumulada com o benefício de prestação continuada (BPC/LOAS).","options":["Certo","Errado"],"answer":0,"explain":"CERTO. A pensão especial de Caruaru possui regras próprias de acumulação, inclusive com vedação ao BPC. Fundamento: Leis nº 9.422/1996 e nº 10.559/2002.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":13,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2214,"type":"tf","subject":"Direito Previdenciário","topic":"Benefícios especiais","sub":"Hemodiálise e anistiado político","difficulty":"Médio","text":"A pensão excepcional ao anistiado político pode ser concedida aos seus dependentes no caso de falecimento do anistiado, observados os critérios legais. Julgue os itens subsequentes acerca da pensão especial às pessoas atingidas pela hanseníase e da pensão especial destinada a crianças com síndrome congênita do zika vírus.","options":["Certo","Errado"],"answer":0,"explain":"CERTO. A legislação do anistiado político prevê efeitos aos dependentes nas hipóteses legalmente estabelecidas. Fundamento: Leis nº 9.422/1996 e nº 10.559/2002.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":14,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2215,"type":"tf","subject":"Direito Previdenciário","topic":"Benefícios especiais","sub":"Hanseníase e Zika","difficulty":"Médio","text":"A pensão especial às pessoas atingidas pela hanseníase, instituída como medida de reparação aos indivíduos submetidos a isolamento e internação compulsórios em razão da doença, independe de contribuição previdenciária e não exige comprovação de renda familiar.","options":["Certo","Errado"],"answer":0,"explain":"CERTO. A pensão por hanseníase é reparatória, independe de contribuição e não tem como requisito a renda familiar. Fundamento: Leis nº 11.520/2007, nº 13.985/2020 e alterações posteriores.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":15,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2216,"type":"tf","subject":"Direito Previdenciário","topic":"Benefícios especiais","sub":"Hanseníase e Zika","difficulty":"Médio","text":"A pensão especial destinada a crianças com síndrome congênita do zika vírus poderá ser acumulada com as indenizações judiciais pagas pela União ou com o BPC/LOAS.","options":["Certo","Errado"],"answer":1,"explain":"ERRADO. A legislação da pensão do Zika estabeleceu restrições específicas de acumulação; não é possível afirmar a acumulação ampla indicada. Fundamento: Leis nº 11.520/2007, nº 13.985/2020 e alterações posteriores.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":16,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2217,"type":"tf","subject":"Direito Previdenciário","topic":"Benefícios especiais","sub":"Hanseníase e Zika","difficulty":"Médio","text":"As despesas decorrentes do pagamento da pensão especial por hanseníase correm à conta do Tesouro Nacional e devem constar de programação orçamentária específica no orçamento do Ministério da Economia. No que se refere ao auxílio especial aos jogadores das seleções brasileiras campeãs das copas mundiais e ao seguro-desemprego do pescador artesanal (seguro-defeso), julgue os itens abaixo.","options":["Certo","Errado"],"answer":1,"explain":"ERRADO. A referência orçamentária constante do item não corresponde à estrutura ministerial vigente da legislação específica. Fundamento: Leis nº 11.520/2007, nº 13.985/2020 e alterações posteriores.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":17,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2218,"type":"tf","subject":"Direito Previdenciário","topic":"Seguro-defeso","sub":"Seguro-defeso e auxílio especial","difficulty":"Médio","text":"Será devido o benefício do seguro-defeso mesmo quando houver disponibilidade de alternativas de pesca nos municípios alcançados pelos períodos de defeso.","options":["Certo","Errado"],"answer":1,"explain":"ERRADO. O seguro-defeso exige o atendimento dos requisitos legais do período de defeso; a existência de alternativa de pesca pode impedir o benefício. Fundamento: Lei nº 10.779/2003 e legislação especial.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":18,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2219,"type":"tf","subject":"Direito Previdenciário","topic":"Seguro-defeso","sub":"Seguro-defeso e auxílio especial","difficulty":"Médio","text":"O auxílio especial aos jogadores das seleções brasileiras campeãs das copas mundiais possui caráter personalíssimo, não se transmitindo a dependentes após o falecimento do beneficiário.","options":["Certo","Errado"],"answer":0,"explain":"CERTO. O auxílio especial é personalíssimo e não se transmite aos dependentes. Fundamento: Lei nº 10.779/2003 e legislação especial.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":19,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2220,"type":"tf","subject":"Direito Previdenciário","topic":"Seguro-defeso","sub":"Seguro-defeso e auxílio especial","difficulty":"Médio","text":"anos de contribuição, se homem.","options":["Certo","Errado"],"answer":0,"explain":"CERTO. O seguro-desemprego do pescador artesanal é custeado com recursos do FAT. Fundamento: Lei nº 10.779/2003 e legislação especial.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":20,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2221,"type":"tf","subject":"Direito Previdenciário","topic":"Seguridade Social","sub":"Princípios e organização","difficulty":"Médio","text":"Em razão do princípio da irredutibilidade do valor dos benefícios, todos os benefícios da seguridade social devem ter preservados o valor nominal e o valor real, mediante reajustes periódicos.","options":["Certo","Errado"],"answer":1,"explain":"ERRADO. A irredutibilidade não significa que todos os benefícios tenham necessariamente preservados, ao mesmo tempo, valor nominal e valor real. Fundamento: Constituição Federal, arts. 194 a 201.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":21,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2222,"type":"tf","subject":"Direito Previdenciário","topic":"Seguridade Social","sub":"Princípios e organização","difficulty":"Médio","text":"Os direitos de segunda dimensão relacionam-se com as liberdades positivas e exigem uma prestação do Estado, tratando-se, portanto, de direitos prestacionais positivos que impõem uma obrigação.","options":["Certo","Errado"],"answer":0,"explain":"CERTO. Direitos de segunda dimensão são direitos sociais, ligados a prestações positivas do Estado. Fundamento: Constituição Federal, arts. 194 a 201.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":22,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2223,"type":"tf","subject":"Direito Previdenciário","topic":"Seguridade Social","sub":"Princípios e organização","difficulty":"Médio","text":"A previdência social é organizada sob a forma do RGPS, de caráter contributivo e de filiação obrigatória, observados os critérios que preservem o equilíbrio financeiro e atuarial.","options":["Certo","Errado"],"answer":0,"explain":"CERTO. A descrição corresponde ao art. 201 da Constituição Federal. Fundamento: Constituição Federal, arts. 194 a 201.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":23,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2224,"type":"tf","subject":"Direito Previdenciário","topic":"Seguridade Social","sub":"Princípios e organização","difficulty":"Médio","text":"A assistência social, por integrar o sistema de seguridade social, possui caráter contributivo e exige o recolhimento prévio de contribuições para a concessão de seus benefícios.","options":["Certo","Errado"],"answer":1,"explain":"ERRADO. A assistência social é não contributiva; não exige recolhimento prévio para a concessão de seus benefícios. Fundamento: Constituição Federal, arts. 194 a 201.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":24,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2225,"type":"tf","subject":"Direito Previdenciário","topic":"Seguridade Social","sub":"Princípios e organização","difficulty":"Médio","text":"O sistema previdenciário brasileiro adota, sob o enfoque financeiro, o regime financeiro de repartição, que tem caráter solidário e é fundamentado no pacto intergeracional. Julgue os itens a seguir, relativos à filiação e aos benefícios do Regime Geral de Previdência Social (RGPS).","options":["Certo","Errado"],"answer":0,"explain":"CERTO. O RGPS adota regime financeiro de repartição, baseado na solidariedade e no pacto entre gerações. Fundamento: Constituição Federal, arts. 194 a 201.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":25,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2226,"type":"tf","subject":"Direito Previdenciário","topic":"Segurados do RGPS","sub":"Filiação, carência e salário de contribuição","difficulty":"Médio","text":"Os dependentes das quatro classes normativas farão jus à pensão por morte, ao auxílio-reclusão, ao serviço social e à reabilitação profissional.","options":["Certo","Errado"],"answer":1,"explain":"ERRADO. As quatro classes não têm, indistintamente, direito a todos os benefícios e serviços mencionados. Fundamento: Lei nº 8.213/1991 e legislação previdenciária vigente.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":26,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2227,"type":"tf","subject":"Direito Previdenciário","topic":"Segurados do RGPS","sub":"Filiação, carência e salário de contribuição","difficulty":"Médio","text":"O rol de doenças profissionais ou do trabalho que podem ser enquadradas como acidente do trabalho é taxativo.","options":["Certo","Errado"],"answer":1,"explain":"ERRADO. O rol não é taxativo; a legislação admite outras hipóteses quando preenchidos os requisitos do acidente do trabalho. Fundamento: Lei nº 8.213/1991 e legislação previdenciária vigente.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":27,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2228,"type":"tf","subject":"Direito Previdenciário","topic":"Segurados do RGPS","sub":"Filiação, carência e salário de contribuição","difficulty":"Médio","text":"A filiação do segurado facultativo ao RGPS decorre automaticamente do exercício de atividade remunerada.","options":["Certo","Errado"],"answer":1,"explain":"ERRADO. O segurado facultativo se filia mediante inscrição e contribuição, não pelo simples exercício de atividade remunerada. Fundamento: Lei nº 8.213/1991 e legislação previdenciária vigente.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":28,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2229,"type":"tf","subject":"Direito Previdenciário","topic":"Segurados do RGPS","sub":"Filiação, carência e salário de contribuição","difficulty":"Médio","text":"Período de carência é o tempo em que o contribuinte mantém sua condição de segurado, seja qual for o valor de sua contribuição ao RGPS.","options":["Certo","Errado"],"answer":1,"explain":"ERRADO. Carência é o número mínimo de contribuições mensais indispensáveis para a concessão de determinados benefícios. Fundamento: Lei nº 8.213/1991 e legislação previdenciária vigente.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":29,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2230,"type":"tf","subject":"Direito Previdenciário","topic":"Segurados do RGPS","sub":"Filiação, carência e salário de contribuição","difficulty":"Médio","text":"A qualidade de segurado é a condição atribuída a todo indivíduo filiado ao RGPS que possua inscrição e que esteja contribuindo para esse regime.","options":["Certo","Errado"],"answer":1,"explain":"ERRADO. Qualidade de segurado não depende necessariamente de estar contribuindo naquele momento, pois há hipóteses de manutenção dessa qualidade. Fundamento: Lei nº 8.213/1991 e legislação previdenciária vigente.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":30,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2231,"type":"tf","subject":"Direito Previdenciário","topic":"Segurados do RGPS","sub":"Filiação, carência e salário de contribuição","difficulty":"Médio","text":"É possível que uma pessoa seja filiada em mais de uma categoria do RGPS, na hipótese de exercício de mais de uma atividade laboral concomitante.","options":["Certo","Errado"],"answer":0,"explain":"CERTO. O exercício concomitante de atividades pode gerar filiação em mais de uma categoria, conforme as regras legais. Fundamento: Lei nº 8.213/1991 e legislação previdenciária vigente.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":31,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2232,"type":"tf","subject":"Direito Previdenciário","topic":"Segurados do RGPS","sub":"Filiação, carência e salário de contribuição","difficulty":"Médio","text":"O salário de contribuição é a base de incidência das contribuições previdenciárias que financiam o sistema previdenciário, de caráter contributivo. Acerca de acidentes do trabalho, julgue os itens subsequentes.","options":["Certo","Errado"],"answer":0,"explain":"CERTO. O salário de contribuição é a base utilizada para a incidência das contribuições previdenciárias, observadas as regras legais. Fundamento: Lei nº 8.213/1991 e legislação previdenciária vigente.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":32,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2233,"type":"tf","subject":"Direito Previdenciário","topic":"Acidente do trabalho/Reabilitação","sub":"CAT e nexo causal","difficulty":"Médio","text":"A falta de emissão da comunicação de acidente do trabalho impede, em qualquer situação, o reconhecimento do nexo causal ou técnico entre o acidente e a atividade laboral do segurado.","options":["Certo","Errado"],"answer":1,"explain":"ERRADO. A ausência de CAT não impede, por si só, o reconhecimento do nexo causal ou técnico. Fundamento: Lei nº 8.213/1991, arts. 19 a 23.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":33,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2234,"type":"tf","subject":"Direito Previdenciário","topic":"Acidente do trabalho/Reabilitação","sub":"CAT e nexo causal","difficulty":"Médio","text":"A empresa não poderá requerer ao INSS a não aplicação do nexo técnico epidemiológico ao caso concreto, pois tal aplicação é obrigatória nos casos de acidente de trabalho.","options":["Certo","Errado"],"answer":1,"explain":"ERRADO. A empresa pode requerer a não aplicação do nexo técnico epidemiológico no caso concreto, observados os procedimentos legais. Fundamento: Lei nº 8.213/1991, arts. 19 a 23.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":34,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2235,"type":"tf","subject":"Direito Previdenciário","topic":"Acidente do trabalho/Reabilitação","sub":"CAT e nexo causal","difficulty":"Médio","text":"O acidente do trabalho pode ocorrer tanto no exercício da atividade a serviço da empresa quanto no trajeto entre a residência do segurado e o local de trabalho.","options":["Certo","Errado"],"answer":0,"explain":"CERTO. A legislação considera acidente do trabalho também determinadas ocorrências no trajeto, conforme a disciplina aplicável. Fundamento: Lei nº 8.213/1991, arts. 19 a 23.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":35,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2236,"type":"tf","subject":"Direito Previdenciário","topic":"Acidente do trabalho/Reabilitação","sub":"CAT e nexo causal","difficulty":"Médio","text":"A comunicação de acidente do trabalho deve ser emitida pelo empregador, sendo vedada sua emissão pelo próprio segurado ou por terceiros.","options":["Certo","Errado"],"answer":1,"explain":"ERRADO. A CAT também pode ser emitida por outras pessoas legitimadas quando a empresa não a fizer. Fundamento: Lei nº 8.213/1991, arts. 19 a 23.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":36,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2237,"type":"tf","subject":"Direito Previdenciário","topic":"Benefícios por incapacidade","sub":"Auxílio e aposentadoria por incapacidade","difficulty":"Médio","text":"Em caso de concessão judicial do auxilio por incapacidade temporária, sem prazo estimado, o benefício de João deve ser mantido por tempo indeterminado até que o INSS convoque o segurado para nova perícia, sendo vedada a sua cessação automática.","options":["Certo","Errado"],"answer":1,"explain":"ERRADO. A manutenção após decisão judicial deve observar o comando judicial e as regras legais; não existe a regra absoluta afirmada. Fundamento: Lei nº 8.213/1991, arts. 42, 59 a 63 e 101.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":37,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2238,"type":"tf","subject":"Direito Previdenciário","topic":"Benefícios por incapacidade","sub":"Auxílio e aposentadoria por incapacidade","difficulty":"Médio","text":"João terá direito ao auxílio por incapacidade temporária apenas se precisar ficar afastado por mais de 15 dias consecutivos.","options":["Certo","Errado"],"answer":0,"explain":"CERTO. Para segurado empregado, em regra, há afastamento superior a 15 dias para o benefício, observada a legislação. Fundamento: Lei nº 8.213/1991, arts. 42, 59 a 63 e 101.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":38,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2239,"type":"tf","subject":"Direito Previdenciário","topic":"Benefícios por incapacidade","sub":"Auxílio e aposentadoria por incapacidade","difficulty":"Médio","text":"A conversão do auxílio por incapacidade temporária em aposentadoria por incapacidade permanente dependerá da constatação de que João é totalmente e permanentemente incapaz para trabalhar, sem possibilidade de reabilitação profissional para exercício de atividade que lhe garanta subsistência.","options":["Certo","Errado"],"answer":0,"explain":"CERTO. A aposentadoria por incapacidade permanente pressupõe incapacidade permanente e impossibilidade de reabilitação para atividade que garanta subsistência. Fundamento: Lei nº 8.213/1991, arts. 42, 59 a 63 e 101.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":39,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2240,"type":"tf","subject":"Direito Previdenciário","topic":"Benefícios por incapacidade","sub":"Auxílio e aposentadoria por incapacidade","difficulty":"Médio","text":"Após a concessão do auxílio por incapacidade temporária, caso João não compareça à perícia médica federal para avaliação quando convocado, o pagamento do auxílio poderá ser suspenso.","options":["Certo","Errado"],"answer":0,"explain":"CERTO. A ausência injustificada à convocação para avaliação pode levar à suspensão do benefício, conforme a legislação. Fundamento: Lei nº 8.213/1991, arts. 42, 59 a 63 e 101.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":40,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2241,"type":"tf","subject":"Direito Previdenciário","topic":"Benefícios por incapacidade","sub":"Auxílio e aposentadoria por incapacidade","difficulty":"Médio","text":"Mesmo que João seja diagnosticado com doença profissional ou do trabalho e que o auxílio seja concedido, o cumprimento de carência não será dispensado. Malu, segurada do Regime Geral de Previdência Social (RGPS), exercia atividade laborativa habitual quando sofreu um acidente. A perícia médica do INSS constatou incapacidade total para o trabalho. Após período em gozo de auxílio por incapacidade temporária, a perícia concluiu que não há possibilidade de reabilitação para exercício de atividade que lhe garanta subsistência, de modo que foi concedida a ela aposentadoria por incapacidade permanente. A partir dessa situação hipotética, julgue os itens a seguir.","options":["Certo","Errado"],"answer":1,"explain":"ERRADO. Doença profissional ou do trabalho é hipótese de dispensa de carência para o benefício por incapacidade, nos termos legais. Fundamento: Lei nº 8.213/1991, arts. 42, 59 a 63 e 101.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":41,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2242,"type":"tf","subject":"Direito Previdenciário","topic":"Benefícios por incapacidade","sub":"Aposentadoria por incapacidade permanente","difficulty":"Médio","text":"Caso Malu fosse segurada especial, para que pudesse ser contemplada com o benefício, teria que comprovar 24 meses de efetivo exercício de atividade rural.","options":["Certo","Errado"],"answer":1,"explain":"ERRADO. Para segurado especial, a exigência não é de 24 meses de atividade rural; aplica-se a comprovação do período legalmente exigido. Fundamento: Lei nº 8.213/1991, arts. 42, 44, 45 e 46.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":42,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2243,"type":"tf","subject":"Direito Previdenciário","topic":"Benefícios por incapacidade","sub":"Aposentadoria por incapacidade permanente","difficulty":"Médio","text":"Na hipótese de recuperação parcial da capacidade laborativa de Malu, a aposentadoria seria mantida por seis meses no valor integral, depois por seis meses com redução de 50% e, por fim, com redução de 100%, quando então cessaria definitivamente.","options":["Certo","Errado"],"answer":0,"explain":"CERTO. A recuperação parcial pode gerar redução progressiva da renda durante o período legal de cessação. Fundamento: Lei nº 8.213/1991, arts. 42, 44, 45 e 46.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":43,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2244,"type":"tf","subject":"Direito Previdenciário","topic":"Benefícios por incapacidade","sub":"Aposentadoria por incapacidade permanente","difficulty":"Médio","text":"Uma vez concedida à Malu, a aposentadoria por incapacidade permanente terá valor correspondente a 91% do salário de benefício.","options":["Certo","Errado"],"answer":1,"explain":"ERRADO. A renda da aposentadoria por incapacidade permanente não é, em regra, simplesmente 91% do salário de benefício. Fundamento: Lei nº 8.213/1991, arts. 42, 44, 45 e 46.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":44,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2245,"type":"tf","subject":"Direito Previdenciário","topic":"Benefícios por incapacidade","sub":"Aposentadoria por incapacidade permanente","difficulty":"Médio","text":"Caso Malu tivesse sido primeiro contemplada com o auxílio por incapacidade temporária, a data inicial da aposentadoria por incapacidade permanente teria sido a data em que a perícia médica definiu a incapacidade permanente.","options":["Certo","Errado"],"answer":1,"explain":"ERRADO. Quando houve auxílio por incapacidade temporária, a DIB da aposentadoria por incapacidade permanente observa a disciplina própria e não se reduz automaticamente à data indicada no item. Fundamento: Lei nº 8.213/1991, arts. 42, 44, 45 e 46.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":45,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2246,"type":"tf","subject":"Direito Previdenciário","topic":"Benefícios por incapacidade","sub":"Aposentadoria por incapacidade permanente","difficulty":"Médio","text":"Caso Malu comprove a necessidade de assistência permanente de outra pessoa, ela terá direito a acréscimo de 25% sobre o valor da renda mensal de seu benefício, ainda que a soma ultrapasse o teto de pagamento dos benefícios do RGPS.","options":["Certo","Errado"],"answer":0,"explain":"CERTO. O acréscimo de 25% é devido nas hipóteses legais de necessidade de assistência permanente de outra pessoa e pode ultrapassar o teto. Fundamento: Lei nº 8.213/1991, arts. 42, 44, 45 e 46.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":46,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2247,"type":"tf","subject":"Direito Previdenciário","topic":"Acidente do trabalho/Reabilitação","sub":"Auxílio-acidente e reabilitação profissional","difficulty":"Médio","text":"A renda mensal do auxílio-acidente corresponde a 50% do salário de benefício para o cálculo da renda mensal do auxílio e não pode ser inferior a um salário mínimo.","options":["Certo","Errado"],"answer":1,"explain":"ERRADO. O auxílio-acidente corresponde a 50% do salário de benefício, mas não há garantia de valor mínimo de um salário mínimo. Fundamento: Lei nº 8.213/1991, arts. 86 a 93.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":47,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2248,"type":"tf","subject":"Direito Previdenciário","topic":"Acidente do trabalho/Reabilitação","sub":"Auxílio-acidente e reabilitação profissional","difficulty":"Médio","text":"A habilitação e a reabilitação profissional são de caráter obrigatório, e não constitui obrigação da previdência social a manutenção do segurado no mesmo emprego ou a sua colocação em outro para o qual foi reabilitado.","options":["Certo","Errado"],"answer":0,"explain":"CERTO. A habilitação e a reabilitação profissional têm caráter obrigatório nas hipóteses legais, e a Previdência não é obrigada a manter o segurado no mesmo emprego. Fundamento: Lei nº 8.213/1991, arts. 86 a 93.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":48,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2249,"type":"tf","subject":"Direito Previdenciário","topic":"Acidente do trabalho/Reabilitação","sub":"Auxílio-acidente e reabilitação profissional","difficulty":"Médio","text":"O auxílio-acidente é devido em decorrência de acidente de qualquer natureza, não se restringindo ao acidente de trabalho, e possui caráter indenizatório.","options":["Certo","Errado"],"answer":0,"explain":"CERTO. O auxílio-acidente tem natureza indenizatória e decorre de acidente de qualquer natureza, quando preenchidos os requisitos. Fundamento: Lei nº 8.213/1991, arts. 86 a 93.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":49,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2250,"type":"tf","subject":"Direito Previdenciário","topic":"Acidente do trabalho/Reabilitação","sub":"Auxílio-acidente e reabilitação profissional","difficulty":"Médio","text":"O processo de habilitação e reabilitação profissional do beneficiário é centralizado e funciona apenas na agência central da Previdência Social (APS). Julgue os itens seguintes, relativos à aposentadoria programada, ao Regime Geral de Previdência Social (RGPS) e à Emenda Constitucional n.º 103/2019.","options":["Certo","Errado"],"answer":1,"explain":"ERRADO. A reabilitação profissional não funciona exclusivamente em uma única agência central; possui organização própria e descentralizada. Fundamento: Lei nº 8.213/1991, arts. 86 a 93.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":50,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2251,"type":"tf","subject":"Direito Previdenciário","topic":"Aposentadorias","sub":"EC nº 103/2019 e RGPS","difficulty":"Médio","text":"Para fins de aposentadoria, será assegurada a contagem recíproca do tempo de contribuição entre o Regime Geral de Previdência Social (RGPS) e os regimes próprios de previdência social, e destes entre si, observada a compensação financeira, de acordo com os critérios estabelecidos em lei.","options":["Certo","Errado"],"answer":0,"explain":"CERTO. A Constituição assegura a contagem recíproca entre RGPS e regimes próprios, com compensação financeira. Fundamento: Constituição Federal e EC nº 103/2019.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":51,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2252,"type":"tf","subject":"Direito Previdenciário","topic":"Aposentadorias","sub":"EC nº 103/2019 e RGPS","difficulty":"Médio","text":"O valor do benefício da aposentadoria programada corresponde a 60% do salário de benefício, com acréscimo de dois pontos percentuais para cada ano de contribuição que exceder o tempo de 15 anos de contribuição, se mulher, ou","options":["Certo","Errado"],"answer":0,"explain":"CERTO. A regra de cálculo da aposentadoria programada é de 60% com acréscimo de 2 pontos percentuais por ano excedente aos marcos legais. Fundamento: Constituição Federal e EC nº 103/2019.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":52,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2253,"type":"tf","subject":"Direito Previdenciário","topic":"Aposentadorias","sub":"EC nº 103/2019 e RGPS","difficulty":"Médio","text":"A aposentadoria programada é assim denominada porque se considera que pode ser planejada, ou seja, conta com fatores previsíveis.","options":["Certo","Errado"],"answer":0,"explain":"CERTO. A denominação 'programada' decorre da possibilidade de planejamento com base em requisitos previsíveis. Fundamento: Constituição Federal e EC nº 103/2019.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":53,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2254,"type":"tf","subject":"Direito Previdenciário","topic":"Aposentadorias","sub":"EC nº 103/2019 e RGPS","difficulty":"Médio","text":"A aposentadoria programada, cumprida a carência, é concedida quando o segurado tiver 65 anos de idade, seja homem ou mulher.","options":["Certo","Errado"],"answer":1,"explain":"ERRADO. A idade mínima não é 65 anos para ambos; a regra diferencia homem e mulher. Fundamento: Constituição Federal e EC nº 103/2019.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":54,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2255,"type":"tf","subject":"Direito Previdenciário","topic":"Aposentadorias","sub":"EC nº 103/2019 e RGPS","difficulty":"Médio","text":"Antes da promulgação da Emenda Constitucional n.º 103/2019, existia apenas um tipo de aposentadoria fixada na Constituição Federal de 1988: a aposentadoria por tempo de contribuição.","options":["Certo","Errado"],"answer":1,"explain":"ERRADO. Antes da EC 103/2019 existiam outras modalidades constitucionais de aposentadoria além da aposentadoria por tempo de contribuição. Fundamento: Constituição Federal e EC nº 103/2019.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":55,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2256,"type":"tf","subject":"Direito Previdenciário","topic":"Aposentadorias","sub":"EC nº 103/2019 e RGPS","difficulty":"Médio","text":"A aposentadoria sem idade mínima, validada pela Emenda Constitucional n.º 103/2019, vincula-se a carência, idade e tempo de contribuição mínimo. Considerando a aposentadoria programada para uma professora filiada ao RGPS desde o dia 14 de novembro de 2019, tendo ela comprovado o tempo de efetivo exercício em função de magistério na educação básica e a carência exigida, julgue os itens a seguir.","options":["Certo","Errado"],"answer":1,"explain":"ERRADO. A aposentadoria sem idade mínima não é uma modalidade geral validada pela EC 103/2019 com os três requisitos indicados. Fundamento: Constituição Federal e EC nº 103/2019.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":56,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2257,"type":"tf","subject":"Direito Previdenciário","topic":"Aposentadorias","sub":"Professor e contagem de tempo","difficulty":"Médio","text":"O valor do benefício da professora corresponde a 60% do salário de benefício, com acréscimo de dois pontos percentuais para cada ano de contribuição que exceder o tempo de 12 anos de contribuição.","options":["Certo","Errado"],"answer":1,"explain":"ERRADO. Para professora, o acréscimo de 2 pontos percentuais observa o marco legal de 15 anos para mulher, e não 12. Fundamento: EC nº 103/2019 e regras do RGPS.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":57,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2258,"type":"tf","subject":"Direito Previdenciário","topic":"Aposentadorias","sub":"Professor e contagem de tempo","difficulty":"Médio","text":"A aposentadoria programada da professora é concedida quando implementados, cumulativamente, os seguintes requisitos: 57 anos de idade e 20 anos de contribuição, exclusivamente em efetivo exercício das funções de magistério na educação infantil, no ensino fundamental ou no ensino médio.","options":["Certo","Errado"],"answer":0,"explain":"CERTO. Para professora, a regra permanente exige 57 anos de idade e 25 anos de contribuição, além do tempo de magistério, conforme a regra aplicável. Fundamento: EC nº 103/2019 e regras do RGPS.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":58,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2259,"type":"tf","subject":"Direito Previdenciário","topic":"Aposentadorias","sub":"Professor e contagem de tempo","difficulty":"Médio","text":"Cumpridos os requisitos legais, a carência da aposentadoria programada da professora é de 180 contribuições mensais.","options":["Certo","Errado"],"answer":0,"explain":"CERTO. A carência de 180 contribuições mensais é requisito geral da aposentadoria, inclusive para a professora. Fundamento: EC nº 103/2019 e regras do RGPS.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":59,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
{"id":2260,"type":"tf","subject":"Direito Previdenciário","topic":"Aposentadorias","sub":"Professor e contagem de tempo","difficulty":"Médio","text":"Computam-se como tempo de contribuição para fins de aposentadoria os períodos de licença-prêmio no vínculo de professor.","options":["Certo","Errado"],"answer":1,"explain":"ERRADO. Licença-prêmio não é computada automaticamente como tempo de contribuição apenas por ser período de licença-prêmio. Fundamento: EC nº 103/2019 e regras do RGPS.","annulled":false,"source":"INSS 2026 — Curso de Formação (4ª Turma)","examItem":60,"year":2026,"bank":"CEBRASPE","exam":"Técnico do Seguro Social — Curso de Formação (4ª Turma)"},
