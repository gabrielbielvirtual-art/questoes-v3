<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<title>Questões V10</title>
<style>
:root{
  --bg:#f4f6fa;--surface:#fff;--surface-2:#f8fafc;--text:#172033;--muted:#667085;
  --line:#e4e7ec;--primary:#2457d6;--primary-2:#173ea5;--success:#087a52;
  --danger:#b42318;--warning:#b54708;--nav:#0d1728;--nav-muted:#a9b5c8;
  --shadow:0 8px 24px rgba(16,24,40,.06);--radius:14px
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid rgba(36,87,214,.18);outline-offset:1px}
.app{min-height:100vh}
.sidebar{position:fixed;z-index:20;inset:0 auto 0 0;width:252px;background:var(--nav);color:#fff;padding:22px 14px;display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:11px;padding:2px 12px 26px;font-weight:850;font-size:20px;letter-spacing:-.4px}
.logo-mark{width:36px;height:36px;border-radius:10px;background:#fff;display:grid;place-items:center;color:var(--primary);font-weight:900}
.logo small{display:block;color:#93a4bd;font-size:11px;font-weight:600;margin-top:2px;letter-spacing:.2px}
.nav{display:grid;gap:5px}
.nav button{border:0;background:transparent;color:var(--nav-muted);display:flex;align-items:center;gap:12px;text-align:left;padding:11px 13px;border-radius:10px;font-weight:650}
.nav button:hover{background:#17243a;color:#fff}
.nav button.active{background:#1b3f93;color:#fff}
.nav .icon{width:22px;text-align:center;font-size:17px}
.nav-section{padding:20px 12px 7px;color:#667892;font-size:10px;text-transform:uppercase;letter-spacing:1.1px;font-weight:800}
.side-bottom{margin-top:auto;border-top:1px solid #233149;padding:15px 7px 0}
.profile-mini{display:flex;align-items:center;gap:10px;padding:9px}
.avatar{width:34px;height:34px;border-radius:50%;background:#dce7ff;color:#204ab8;display:grid;place-items:center;font-weight:800}
.profile-mini b{font-size:13px}.profile-mini span{display:block;color:#8ea0ba;font-size:11px;margin-top:1px}
.main{margin-left:252px;min-height:100vh}
.topbar{height:72px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:10}
.mobile-menu{display:none;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 10px}
.search{width:min(430px,45vw);position:relative}
.search input{width:100%;height:42px;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:0 14px 0 40px;color:var(--text)}
.search span{position:absolute;left:13px;top:9px;color:#7b8798}
.top-actions{display:flex;align-items:center;gap:10px}
.icon-btn{border:1px solid var(--line);background:#fff;border-radius:10px;width:40px;height:40px}
.user-pill{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:#fff;padding:6px 10px 6px 6px;border-radius:999px;font-size:13px;font-weight:700}
.page{padding:30px;max-width:1500px;margin:0 auto}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:24px}
.page-head h1{margin:0;font-size:29px;letter-spacing:-.8px}
.page-head p{margin:6px 0 0;color:var(--muted);font-size:14px}
.head-actions{display:flex;gap:9px}
.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:750;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn.primary{background:var(--primary);color:#fff}.btn.primary:hover{background:var(--primary-2)}
.btn.secondary{background:#fff;color:#344054;border:1px solid var(--line)}.btn.secondary:hover{background:#f8fafc}
.btn.danger{background:#fff;color:var(--danger);border:1px solid #f2c2be}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.stat-top{display:flex;justify-content:space-between;align-items:center}.stat small{color:var(--muted);font-weight:650}.stat-icon{width:34px;height:34px;border-radius:9px;background:#eef4ff;color:var(--primary);display:grid;place-items:center}
.stat strong{display:block;font-size:29px;letter-spacing:-.8px;margin-top:8px}.stat .trend{font-size:11px;color:var(--muted);margin-top:5px}
.section-grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(320px,.8fr);gap:16px;margin-top:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.card h2{margin:0;font-size:17px;letter-spacing:-.25px}.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:17px}
.link-btn{border:0;background:transparent;color:var(--primary);font-weight:750;padding:0}
.progress{height:8px;background:#edf0f5;border-radius:999px;overflow:hidden}.progress i{display:block;height:100%;background:var(--primary);border-radius:inherit}
.subject-row{padding:13px 0;border-bottom:1px solid var(--line)}.subject-row:last-child{border-bottom:0}
.subject-meta{display:flex;justify-content:space-between;gap:12px;margin-bottom:8px;font-size:13px}.subject-meta span:last-child{color:var(--muted)}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:750;background:#eef4ff;color:var(--primary)}
.badge.green{background:#ecfdf3;color:var(--success)}.badge.red{background:#fef3f2;color:var(--danger)}.badge.gray{background:#f2f4f7;color:#475467}.badge.orange{background:#fff7ed;color:var(--warning)}
.shortcut-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.shortcut{border:1px solid var(--line);background:#fff;text-align:left;padding:14px;border-radius:11px}.shortcut:hover{background:#f8fafc}.shortcut b{display:block;font-size:13px}.shortcut span{display:block;color:var(--muted);font-size:11px;margin-top:4px}
.activity{display:grid;gap:10px}.activity-row{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}.activity-row:last-child{border-bottom:0}.dot{width:9px;height:9px;border-radius:50%;background:var(--primary);margin-top:5px;flex:none}.activity-row b{font-size:13px}.activity-row small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.filters-card{margin-bottom:16px}.filters{display:grid;grid-template-columns:2fr repeat(3,1fr);gap:9px}.field{width:100%;height:42px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:0 11px;color:var(--text)}
.filters-more{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:9px}
.question-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px}
.question-card{padding:24px}
.q-meta{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.tags{display:flex;gap:6px;flex-wrap:wrap}
.favorite{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 12px;font-weight:700}.favorite.on{background:#fff8e8;border-color:#f5d38c;color:#9a6700}
.q-number{font-size:12px;color:var(--muted);font-weight:700;margin-top:20px}.question-text{font-size:20px;line-height:1.55;font-weight:650;letter-spacing:-.25px;margin:8px 0 20px}
.options{display:grid;gap:10px}.option{border:1px solid var(--line);background:#fff;border-radius:11px;padding:14px;text-align:left;display:flex;gap:11px;align-items:flex-start;line-height:1.45}.option:hover{border-color:#b9c8e9;background:#fbfcff}.letter{width:28px;height:28px;border-radius:7px;background:#f2f4f7;display:grid;place-items:center;font-weight:800;color:#475467;flex:none}.option.selected{border:2px solid var(--primary);padding:13px;background:#f5f8ff}.option.correct{border-color:#73c6a5;background:#effcf6}.option.wrong{border-color:#ee9b93;background:#fff5f4}
.answer-box{margin-top:17px;border-radius:11px;padding:15px;background:#f8fafc;border:1px solid var(--line)}.answer-box strong{display:block;margin-bottom:5px}.answer-box.ok strong{color:var(--success)}.answer-box.bad strong{color:var(--danger)}
.q-actions{display:flex;justify-content:space-between;align-items:center;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}.q-actions .center{color:var(--muted);font-size:12px;font-weight:700}
.side-panel .row{padding:12px 0;border-bottom:1px solid var(--line)}.side-panel .row:last-child{border-bottom:0}.row-title{display:flex;justify-content:space-between;gap:10px;font-size:13px}.row-title span{color:var(--muted)}
.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:13px 10px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}.table th{font-size:11px;text-transform:uppercase;letter-spacing:.55px;color:#667085;background:#fafbfc}.table tr:last-child td{border-bottom:0}
.empty{text-align:center;padding:45px 20px;color:var(--muted)}.empty b{display:block;color:var(--text);margin-bottom:5px}
.book-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.book{border:1px solid var(--line);border-radius:12px;padding:17px;background:#fff}.book h3{margin:0 0 5px;font-size:15px}.book p{margin:0;color:var(--muted);font-size:12px}.book .progress{margin:14px 0 10px}
.sim-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.form-stack{display:grid;gap:10px}.form-stack label{font-size:12px;font-weight:750;color:#475467}.form-stack .field{margin-top:5px}
.result-hero{padding:26px;text-align:center;background:#f8faff;border:1px solid #dce6ff;border-radius:12px}.result-hero strong{font-size:44px;display:block;letter-spacing:-1px}.result-hero span{color:var(--muted);font-size:13px}
.toast{position:fixed;right:22px;bottom:22px;background:#111827;color:#fff;padding:12px 15px;border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.2);font-size:13px;z-index:50;display:none}.toast.show{display:block}
.overlay{position:fixed;inset:0;background:rgba(8,15,28,.5);z-index:40;display:none}.overlay.show{display:block}
@media(max-width:1100px){.sidebar{width:220px}.main{margin-left:220px}.grid{grid-template-columns:repeat(2,1fr)}.section-grid,.question-layout{grid-template-columns:1fr}.filters{grid-template-columns:1fr 1fr}.book-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.sidebar{transform:translateX(-100%);transition:transform .2s}.sidebar.open{transform:translateX(0)}.main{margin-left:0}.topbar{padding:0 14px}.mobile-menu{display:block}.search{display:none}.page{padding:20px 14px}.page-head{flex-direction:column}.grid,.sim-grid,.book-grid{grid-template-columns:1fr}.filters,.filters-more{grid-template-columns:1fr}.user-pill span{display:none}.top-actions{margin-left:auto}.page-head h1{font-size:25px}}
@media(max-width:480px){.topbar{height:62px}.user-pill{padding:5px}.q-actions{gap:8px}.q-actions .center{display:none}.question-text{font-size:18px}.shortcut-grid{grid-template-columns:1fr}}
</style>
</head>

function books(){
 $('content').innerHTML=pageHead('Cadernos','Organize suas questões para revisão.',`<button class="btn primary" onclick="newBook()">＋ Novo caderno</button>`)+
 `<div class="book-grid">${state.notebooks.map((b,i)=>{let done=b.ids.filter(id=>state.answers[id]).length,p=b.ids.length?Math.round(done/b.ids.length*100):0;return `<div class="book"><h3>${esc(b.name)}</h3><p>${b.ids.length} questão${b.ids.length===1?'':'ões'} · ${done} resolvida${done===1?'':'s'}</p><div class="progress"><i style="width:${p}%"></i></div><div style="display:flex;justify-content:space-between;align-items:center"><span class="badge gray">${p}% concluído</span><button class="btn secondary" onclick="openBook(${i})">Abrir</button></div></div>`}).join('')}</div>`;
}
function newBook(){let n=prompt('Nome do novo caderno:');if(!n?.trim())return;state.notebooks.push({name:n.trim(),ids:[]});save();books();toast('Caderno criado.')}
function openBook(i){let b=state.notebooks[i],arr=qs.filter(q=>b.ids.includes(q.id));$('content').innerHTML=pageHead(b.name,`${arr.length} questão${arr.length===1?'':'ões'} neste caderno.`,`<button class="btn secondary" onclick="books()">← Voltar</button>`)+`<div class="card">${arr.length?`<div class="table-wrap"><table class="table"><tr><th>Questão</th><th>Matéria</th><th>Status</th><th></th></tr>${arr.map(q=>{let a=state.answers[q.id];return `<tr><td><b>#${q.id}</b> ${esc(q.text)}</td><td>${esc(q.subject)}</td><td>${a?(a.correct?'<span class="badge green">Acertada</span>':'<span class="badge red">Errada</span>'):'<span class="badge gray">Não resolvida</span>'}</td><td><button class="btn secondary" onclick="removeFromBook(${i},${q.id})">Remover</button></td></tr>`}).join('')}</table></div>`:'<div class="empty"><b>Caderno vazio</b>Adicione questões pelo banco de questões.</div>'}</div>`}
function removeFromBook(i,id){state.notebooks[i].ids=state.notebooks[i].ids.filter(x=>x!==id);save();openBook(i);toast('Questão removida.')}
function simulados(){
 $('content').innerHTML=pageHead('Simulados','Monte provas personalizadas e acompanhe seus resultados.')+
 `<div class="sim-grid"><section class="card"><div class="card-head"><h2>Novo simulado</h2></div><div class="form-stack">
 <label>Quantidade<select class="field" id="simN"><option>5</option><option>10</option><option>20</option><option>30</option></select></label>
 <label>Matéria<select class="field" id="simS"><option>Todos</option>${[...new Set(qs.map(q=>q.subject))].sort().map(x=>`<option>${esc(x)}</option>`).join('')}</select></label>
 <label>Nível<select class="field" id="simD"><option>Todos</option><option>Fácil</option><option>Médio</option><option>Difícil</option></select></label>
 <button class="btn primary" onclick="startSim()">Iniciar simulado</button></div></section>
 <section class="card"><div class="card-head"><h2>Últimos resultados</h2></div>${state.simulados.length?state.simulados.slice(0,8).map(s=>`<div class="row"><div class="row-title"><b>${esc(s.date)}</b><span>${s.correct}/${s.total}</span></div><span class="badge ${s.rate>=70?'green':s.rate>=50?'orange':'red'}">${s.rate}%</span></div>`).join(''):'<div class="empty"><b>Nenhum simulado realizado</b>Seu histórico aparecerá aqui.</div>'}</section></div>`;
}
function startSim(){let n=+$('simN').value,sub=$('simS').value,d=$('simD').value,p=qs.filter(q=>(sub==='Todos'||q.subject===sub)&&(d==='Todos'||q.difficulty===d));p=[...p].sort(()=>Math.random()-.5).slice(0,n);if(!p.length){toast('Não há questões para essa combinação.');return}sim={qs:p,i:0,a:[]};simQuestion()}
function simQuestion(){let q=sim.qs[sim.i],ch=sim.a[sim.i];$('content').innerHTML=pageHead('Simulado em andamento',`Questão ${sim.i+1} de ${sim.qs.length}`)+`<section class="card question-card"><div class="q-meta"><div class="tags"><span class="badge">${esc(q.subject)}</span><span class="badge gray">${esc(q.difficulty)}</span></div><span class="badge gray">Sem gabarito durante a prova</span></div><div class="question-text">${esc(q.text)}</div><div class="options">${q.options.map((o,i)=>`<button class="option ${ch===i?'selected':''}" onclick="simPick(${i})"><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(o)}</span></button>`).join('')}</div><div class="q-actions"><button class="btn secondary" onclick="simPrev()">← Anterior</button><span class="center">${ch==null?'Escolha uma alternativa':'Resposta marcada'}</span>${sim.i===sim.qs.length-1?'<button class="btn primary" onclick="finishSim()">Finalizar</button>':'<button class="btn primary" onclick="simNext()">Próxima →</button>'}</div></section>`}
function simPick(i){sim.a[sim.i]=i;simQuestion()}function simNext(){if(sim.i<sim.qs.length-1){sim.i++;simQuestion()}}function simPrev(){if(sim.i>0){sim.i--;simQuestion()}}
function finishSim(){let c=sim.qs.reduce((n,q,i)=>n+(sim.a[i]===q.answer?1:0),0),t=sim.qs.length,r=Math.round(c/t*100);state.simulados.unshift({date:new Date().toLocaleString('pt-BR'),correct:c,total:t,rate:r});save();let oldSim=sim;sim=null;$('content').innerHTML=pageHead('Resultado do simulado','Confira seu desempenho e continue estudando.')+`<section class="card"><div class="result-hero"><strong>${r}%</strong><span>${c} acerto${c===1?'':'s'} de ${t} questão${t===1?'':'ões'}</span></div><div class="q-actions"><button class="btn secondary" onclick="navigate('sim')">Voltar</button><button class="btn primary" onclick="navigate('questions')">Continuar estudando</button></div></section>`}
function performance(){let s=stats(),by={};qs.forEach(q=>{by[q.subject]??={done:0,c:0};let a=state.answers[q.id];if(a){by[q.subject].done++;if(a.correct)by[q.subject].c++}});$('content').innerHTML=pageHead('Desempenho','Acompanhe seus resultados por matéria e encontre pontos de atenção.')+`<div class="grid"><div class="stat"><small>Aproveitamento geral</small><strong>${s.rate}%</strong></div><div class="stat"><small>Resolvidas</small><strong>${s.done}</strong></div><div class="stat"><small>Acertos</small><strong>${s.c}</strong></div><div class="stat"><small>Erros</small><strong>${s.wrong}</strong></div></div><div class="card" style="margin-top:16px"><div class="card-head"><h2>Detalhamento por matéria</h2></div>${Object.entries(by).map(([k,v])=>{let p=v.done?Math.round(v.c/v.done*100):0;return `<div class="subject-row"><div class="subject-meta"><b>${esc(k)}</b><span>${v.c} acertos · ${v.done-v.c} erros · ${p}%</span></div><div class="progress"><i style="width:${p}%"></i></div></div>`}).join('')}</div>`}
function historyPage(){$('content').innerHTML=pageHead('Histórico','Tudo que você já respondeu neste dispositivo.',`<button class="btn secondary" onclick="exportData()">↥ Exportar backup</button>`)+`<div class="card"><div class="table-wrap">${state.history.length?`<table class="table"><tr><th>Questão</th><th>Matéria</th><th>Resultado</th><th>Data</th></tr>${state.history.slice(0,300).map(h=>{let q=qs.find(x=>x.id===h.id);return `<tr><td><b>#${h.id}</b> ${esc(q?.text||'Questão')}</td><td>${esc(q?.subject||'-')}</td><td>${h.correct?'<span class="badge green">Acerto</span>':'<span class="badge red">Erro</span>'}</td><td>${new Date(h.at).toLocaleString('pt-BR')}</td></tr>`}).join('')}</table>`:'<div class="empty"><b>Seu histórico está vazio</b>Resolva questões para começar a acompanhar sua evolução.</div>'}</div></div>`}
function favorites(){let arr=qs.filter(q=>state.favorites.includes(q.id));$('content').innerHTML=pageHead('Favoritas','Questões que você salvou para revisar depois.')+`<div class="card">${arr.length?`<div class="table-wrap"><table class="table"><tr><th>Questão</th><th>Matéria</th><th>Status</th><th></th></tr>${arr.map(q=>{let a=state.answers[q.id];return `<tr><td><b>#${q.id}</b> ${esc(q.text)}</td><td>${esc(q.subject)}</td><td>${a?(a.correct?'<span class="badge green">Acertada</span>':'<span class="badge red">Errada</span>'):'<span class="badge gray">Não resolvida</span>'}</td><td><button class="btn secondary" onclick="openQuestion(${q.id})">Resolver</button></td></tr>`}).join('')}</table></div>`:'<div class="empty"><b>Nenhuma favorita</b>Use ☆ Favoritar no banco de questões para guardar questões.</div>'}</div>`}
function openQuestion(id){let arr=filtered();let idx=arr.findIndex(q=>q.id===id);if(idx>=0)current=idx;else{filter={search:'',subject:'Todos',topic:'Todos',difficulty:'Todos',status:'Todos',type:'Todos'};current=qs.findIndex(q=>q.id===id)}navigate('questions')}
function admin(){
 $('content').innerHTML=pageHead('Administração','Gerencie o banco local e faça backups do seu progresso.')+
 `<div class="grid"><div class="stat"><small>Questões</small><strong>${qs.length}</strong></div><div class="stat"><small>Matérias</small><strong>${new Set(qs.map(q=>q.subject)).size}</strong></div><div class="stat"><small>Favoritas</small><strong>${state.favorites.length}</strong></div><div class="stat"><small>Respostas</small><strong>${state.history.length}</strong></div></div>
 <div class="sim-grid" style="margin-top:16px"><section class="card"><div class="card-head"><h2>Adicionar questão</h2></div><div class="form-stack">
 <label>Matéria<input class="field" id="as"></label><label>Assunto<input class="field" id="at"></label><label>Subassunto<input class="field" id="au"></label><label>Tipo<select class="field" id="ay"><option value="mc">Múltipla escolha</option><option value="tf">Certo/Errado</option></select></label><label>Dificuldade<select class="field" id="ad"><option>Fácil</option><option>Médio</option><option>Difícil</option></select></label><label>Enunciado<textarea class="field" id="ax" rows="4"></textarea></label><label>Alternativa A<input class="field" id="aa"></label><label>Alternativa B<input class="field" id="ab"></label><label>Alternativa C<input class="field" id="ac"></label><label>Alternativa D<input class="field" id="ae"></label><label>Gabarito<select class="field" id="ag"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select></label><label>Comentário<textarea class="field" id="ex" rows="3"></textarea></label><button class="btn primary" onclick="addQuestion()">Salvar questão</button></div></section>
 <section class="card"><div class="card-head"><h2>Backup e manutenção</h2></div><p style="color:var(--muted);font-size:13px;line-height:1.6">Os dados desta versão ficam salvos no navegador. Exporte um backup antes de trocar de dispositivo ou publicar uma nova versão.</p><div class="head-actions" style="flex-wrap:wrap"><button class="btn secondary" onclick="exportData()">↥ Exportar backup</button><button class="btn secondary" onclick="$('importFile').click()">↧ Restaurar backup</button><input id="importFile" type="file" accept=".json" style="display:none" onchange="importData(event)"></div><hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><button class="btn danger" onclick="resetData()">Apagar dados locais</button></section></div>`;
}
function addQuestion(){let s=$('as').value.trim(),t=$('at').value.trim(),u=$('au').value.trim(),x=$('ax').value.trim(),type=$('ay').value,d=$('ad').value,o=type==='tf'?['Certo','Errado']:[$('aa').value.trim(),$('ab').value.trim(),$('ac').value.trim(),$('ae').value.trim()].filter(Boolean);if(!s||!t||!x||o.length<2){toast('Preencha os campos obrigatórios.');return}let q={id:Date.now(),type,subject:s,topic:t,sub:u||'Geral',difficulty:d,text:x,options:o,answer:Math.min(+$('ag').value,o.length-1),explain:$('ex').value.trim()||'Sem comentário cadastrado.'};state.customQuestions.push(q);qs.push(q);save();toast('Questão adicionada ao banco.');admin()}
function exportData(){let b=new Blob([JSON.stringify({version:'V10',state},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='questoes-v10-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.state)throw 0;Object.assign(state,d.state);state.customQuestions=state.customQuestions||[];state.notebooks=state.notebooks||[{name:'Revisão geral',ids:[]}];qs=[...seed,...state.customQuestions];save();toast('Backup restaurado.');navigate('dashboard')}catch(_){toast('Backup inválido.')}};r.readAsText(f)}
function resetData(){if(confirm('Apagar progresso, favoritos, cadernos, simulados e questões adicionadas neste dispositivo?')){localStorage.removeItem('questoesV10');location.reload()}}
navigate('dashboard');
</script>
</body>
</html>
